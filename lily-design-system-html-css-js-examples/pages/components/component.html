                "aotearoa-national-health-index-input": {"usage":{"lang":"html","code":"<Field label=\"National Health Index (NHI) Number\" required>\n  <AotearoaNationalHealthIndexInput label=\"National Health Index (NHI) Number\" value={value} required />\n  <Hint>Seven-character identifier (three letters, four digits). The legacy AAANNNC format uses a Modulus-11 check digit over the six preceding characters; an expanded AAANNAX format (issued from July 2026) uses a Modulus-23 check digit instead, to extend the identifier space.</Hint>\n  <ErrorMessage>Please enter a valid National Health Index</ErrorMessage>\n</Field>\n"}},
                "aotearoa-national-health-index-view": {"usage":{"lang":"html","code":"<SummaryList>\n  <SummaryListItem term=\"National Health Index (NHI) Number\">\n    <AotearoaNationalHealthIndexView label=\"National Health Index (NHI) Number\" value={value} />\n  </SummaryListItem>\n</SummaryList>\n"}},
                "pilipinas-philhealth-identification-number-input": {"usage":{"lang":"html","code":"<Field label=\"PhilHealth Identification Number (PIN)\" required>\n  <PilipinasPhilhealthIdentificationNumberInput label=\"PhilHealth Identification Number (PIN)\" value={value} required />\n  <Hint>Twelve-digit number assigned by the Philippine Health Insurance Corporation (PhilHealth) to every enrolled member, commonly displayed grouped as NN-NNNNNNNNN-N. No published check-digit algorithm; correctness is confirmed against PhilHealth's own membership records.</Hint>\n  <ErrorMessage>Please enter a valid PhilHealth Identification Number</ErrorMessage>\n</Field>\n"}},
                "pilipinas-philhealth-identification-number-view": {"usage":{"lang":"html","code":"<SummaryList>\n  <SummaryListItem term=\"PhilHealth Identification Number (PIN)\">\n    <PilipinasPhilhealthIdentificationNumberView label=\"PhilHealth Identification Number (PIN)\" value={value} />\n  </SummaryListItem>\n</SummaryList>\n"}},
                "brasil-cartao-nacional-de-saude-input": {"usage":{"lang":"html","code":"<Field label=\"Cartão Nacional de Saúde (CNS)\" required>\n  <BrasilCartaoNacionalDeSaudeInput label=\"Cartão Nacional de Saúde (CNS)\" value={value} required />\n  <Hint>Fifteen-digit number issued by Brazil's Sistema Único de Saúde (SUS), grouped as NNN NNNN NNNN NNNN. Numbers starting 1 or 2 are definitive (linked to the national civil registry); numbers starting 7, 8, or 9 are provisional. Both forms are validated with a weighted-sum Modulus-11 check across all 15 digits.</Hint>\n  <ErrorMessage>Please enter a valid Cartão Nacional de Saúde</ErrorMessage>\n</Field>\n"}},
                "brasil-cartao-nacional-de-saude-view": {"usage":{"lang":"html","code":"<SummaryList>\n  <SummaryListItem term=\"Cartão Nacional de Saúde (CNS)\">\n    <BrasilCartaoNacionalDeSaudeView label=\"Cartão Nacional de Saúde (CNS)\" value={value} />\n  </SummaryListItem>\n</SummaryList>\n"}},
                "schweiz-ahv-nummer-input": {"usage":{"lang":"html","code":"<Field label=\"AHV-Nummer / Numéro AVS\" required>\n  <SchweizAhvNummerInput label=\"AHV-Nummer / Numéro AVS\" value={value} required />\n  <Hint>Thirteen digits, displayed as 756.NNNN.NNNN.NN, always beginning with the country prefix 756. It is a valid EAN-13 barcode number: the final digit is an EAN-13 check digit computed over the twelve preceding digits (alternating-position weights of 1 and 3). Replaced the old 11-digit AHV card number on 1 July 2008.</Hint>\n  <ErrorMessage>Please enter a valid AHV-Nummer / Numéro AVS</ErrorMessage>\n</Field>\n"}},
                "schweiz-ahv-nummer-view": {"usage":{"lang":"html","code":"<SummaryList>\n  <SummaryListItem term=\"AHV-Nummer / Numéro AVS\">\n    <SchweizAhvNummerView label=\"AHV-Nummer / Numéro AVS\" value={value} />\n  </SummaryListItem>\n</SummaryList>\n"}},
                "canada-social-insurance-number-input": {"usage":{"lang":"html","code":"<Field label=\"Social Insurance Number (SIN)\" required>\n  <CanadaSocialInsuranceNumberInput label=\"Social Insurance Number (SIN)\" value={value} required />\n  <Hint>Nine digits, usually displayed in three groups of three (NNN NNN NNN). The leading digit denotes the region of registration (1 Atlantic, 2-3 Quebec, 4-5 Ontario, 6 Prairies, 7 Pacific, 9 temporary residents), the following seven digits are a serial number, and the final digit is a Luhn (Modulus-10) check digit over the first eight.</Hint>\n  <ErrorMessage>Please enter a valid Social Insurance Number</ErrorMessage>\n</Field>\n"}},
                "canada-social-insurance-number-view": {"usage":{"lang":"html","code":"<SummaryList>\n  <SummaryListItem term=\"Social Insurance Number (SIN)\">\n    <CanadaSocialInsuranceNumberView label=\"Social Insurance Number (SIN)\" value={value} />\n  </SummaryListItem>\n</SummaryList>\n"}},
                "hanguk-jumin-deungnok-beonho-input": {"usage":{"lang":"html","code":"<Field label=\"Resident Registration Number (주민등록번호)\" required>\n  <HangukJuminDeungnokBeonhoInput label=\"Resident Registration Number (주민등록번호)\" value={value} required />\n  <Hint>Thirteen digits, displayed as NNNNNN-NNNNNNN. The first six digits encode date of birth (YYMMDD); the seventh digit encodes sex and birth century; digits eight through eleven encode place of registration; the twelfth is a sequence number; the thirteenth is a Modulus-11 check digit over the preceding twelve.</Hint>\n  <ErrorMessage>Please enter a valid Resident Registration Number</ErrorMessage>\n</Field>\n"}},
                "hanguk-jumin-deungnok-beonho-view": {"usage":{"lang":"html","code":"<SummaryList>\n  <SummaryListItem term=\"Resident Registration Number (주민등록번호)\">\n    <HangukJuminDeungnokBeonhoView label=\"Resident Registration Number (주민등록번호)\" value={value} />\n  </SummaryListItem>\n</SummaryList>\n"}},
                "nihon-kojin-bango-input": {"usage":{"lang":"html","code":"<Field label=\"Individual Number / My Number (マイナンバー)\" required>\n  <NihonKojinBangoInput label=\"Individual Number / My Number (マイナンバー)\" value={value} required />\n  <Hint>Twelve digits, issued to every resident of Japan since 2016. The twelfth digit is a check digit: the first eleven digits are each multiplied by a position-dependent weight (6,5,4,3,2 for positions 1-5; 7,6,5,4,3,2 for positions 6-11), summed, taken Modulus-11, and the remainder subtracted from 11 (remainders of 0 or 1 both yield a check digit of 0).</Hint>\n  <ErrorMessage>Please enter a valid Individual Number / My Number</ErrorMessage>\n</Field>\n"}},
                "nihon-kojin-bango-view": {"usage":{"lang":"html","code":"<SummaryList>\n  <SummaryListItem term=\"Individual Number / My Number (マイナンバー)\">\n    <NihonKojinBangoView label=\"Individual Number / My Number (マイナンバー)\" value={value} />\n  </SummaryListItem>\n</SummaryList>\n"}},
                "bharat-aadhaar-input": {"usage":{"lang":"html","code":"<Field label=\"Aadhaar (आधार)\" required>\n  <BharatAadhaarInput label=\"Aadhaar (आधार)\" value={value} required />\n  <Hint>Twelve digits, the first of which is never 0 or 1. The twelfth digit is a check digit computed with the Verhoeff algorithm, a checksum that detects every single-digit error and every adjacent-digit transposition. Issued by the Unique Identification Authority of India (UIDAI).</Hint>\n  <ErrorMessage>Please enter a valid Aadhaar</ErrorMessage>\n</Field>\n"}},
                "bharat-aadhaar-view": {"usage":{"lang":"html","code":"<SummaryList>\n  <SummaryListItem term=\"Aadhaar (आधार)\">\n    <BharatAadhaarView label=\"Aadhaar (आधार)\" value={value} />\n  </SummaryListItem>\n</SummaryList>\n"}},
                "yisrael-teudat-zehut-input": {"usage":{"lang":"html","code":"<Field label=\"Teudat Zehut (תעודת זהות)\" required>\n  <YisraelTeudatZehutInput label=\"Teudat Zehut (תעודת זהות)\" value={value} required />\n  <Hint>Nine digits (left-padded with zeros when shorter), with the ninth a Luhn (Modulus-10) check digit: digits alternate between weights of 1 and 2 from the left, any doubled product over 9 has its own two digits summed, and the total must be a multiple of 10.</Hint>\n  <ErrorMessage>Please enter a valid Teudat Zehut</ErrorMessage>\n</Field>\n"}},
                "yisrael-teudat-zehut-view": {"usage":{"lang":"html","code":"<SummaryList>\n  <SummaryListItem term=\"Teudat Zehut (תעודת זהות)\">\n    <YisraelTeudatZehutView label=\"Teudat Zehut (תעודת זהות)\" value={value} />\n  </SummaryListItem>\n</SummaryList>\n"}},
                "south-africa-identity-number-input": {"usage":{"lang":"html","code":"<Field label=\"South African Identity Number\" required>\n  <SouthAfricaIdentityNumberInput label=\"South African Identity Number\" value={value} required />\n  <Hint>Thirteen digits in the form YYMMDDSSSSCAZ: the first six encode date of birth; the next four encode sex (0000-4999 female, 5000-9999 male); the eleventh digit encodes citizenship status (0 citizen, 1 permanent resident, 2 refugee); the twelfth is a legacy field fixed at 8 on modern cards; the thirteenth is a Luhn (Modulus-10) check digit over the preceding twelve.</Hint>\n  <ErrorMessage>Please enter a valid South African Identity Number</ErrorMessage>\n</Field>\n"}},
                "south-africa-identity-number-view": {"usage":{"lang":"html","code":"<SummaryList>\n  <SummaryListItem term=\"South African Identity Number\">\n    <SouthAfricaIdentityNumberView label=\"South African Identity Number\" value={value} />\n  </SummaryListItem>\n</SummaryList>\n"}},
                "mexico-clave-unica-de-registro-de-poblacion-input": {"usage":{"lang":"html","code":"<Field label=\"Clave Única de Registro de Población (CURP)\" required>\n  <MexicoClaveUnicaDeRegistroDePoblacionInput label=\"Clave Única de Registro de Población (CURP)\" value={value} required />\n  <Hint>Eighteen-character alphanumeric code built from name, date of birth, sex, and state of birth: first letter of the first surname plus its first internal vowel; first letter of the second surname (or X if none); first letter of the given name; six-digit date of birth (YYMMDD); H or M for sex (X for non-binary); a two-letter state code (NE for those born abroad); a consonant from each surname and the given name; then two further disambiguating characters. No trailing check digit.</Hint>\n  <ErrorMessage>Please enter a valid Clave Única de Registro de Población</ErrorMessage>\n</Field>\n"}},
                "mexico-clave-unica-de-registro-de-poblacion-view": {"usage":{"lang":"html","code":"<SummaryList>\n  <SummaryListItem term=\"Clave Única de Registro de Población (CURP)\">\n    <MexicoClaveUnicaDeRegistroDePoblacionView label=\"Clave Única de Registro de Población (CURP)\" value={value} />\n  </SummaryListItem>\n</SummaryList>\n"}},
                "singapore-national-registration-identity-card-input": {"usage":{"lang":"html","code":"<Field label=\"National Registration Identity Card Number / Foreign Identification Number (NRIC/FIN)\" required>\n  <SingaporeNationalRegistrationIdentityCardInput label=\"National Registration Identity Card Number / Foreign Identification Number (NRIC/FIN)\" value={value} required />\n  <Hint>One letter (S or T for citizens/permanent residents; F or G for long-term foreign residents; M for newer FIN series), seven digits, and a trailing check letter. The check letter is computed by multiplying the seven digits by fixed weights (2,7,6,5,4,3,2), summing the products (adding 4 for a G/T prefix or 3 for an M prefix), taking the sum Modulus 11, and mapping (10 - remainder) through a lookup table to a letter.</Hint>\n  <ErrorMessage>Please enter a valid National Registration Identity Card Number / Foreign Identification Number</ErrorMessage>\n</Field>\n"}},
                "singapore-national-registration-identity-card-view": {"usage":{"lang":"html","code":"<SummaryList>\n  <SummaryListItem term=\"National Registration Identity Card Number / Foreign Identification Number (NRIC/FIN)\">\n    <SingaporeNationalRegistrationIdentityCardView label=\"National Registration Identity Card Number / Foreign Identification Number (NRIC/FIN)\" value={value} />\n  </SummaryListItem>\n</SummaryList>\n"}},
                "osterreich-sozialversicherungsnummer-input": {"usage":{"lang":"html","code":"<Field label=\"Sozialversicherungsnummer (SVNR)\" required>\n  <OsterreichSozialversicherungsnummerInput label=\"Sozialversicherungsnummer (SVNR)\" value={value} required />\n  <Hint>Ten digits, displayed as NNNN DDMMYY. The first three digits are a serial number (the first not zero) followed by a Modulus-11 check digit as the fourth digit; the remaining six digits encode date of birth (DDMMYY). If the Modulus-11 remainder is 10, the serial number is incremented by one and the check digit recalculated.</Hint>\n  <ErrorMessage>Please enter a valid Sozialversicherungsnummer</ErrorMessage>\n</Field>\n"}},
                "osterreich-sozialversicherungsnummer-view": {"usage":{"lang":"html","code":"<SummaryList>\n  <SummaryListItem term=\"Sozialversicherungsnummer (SVNR)\">\n    <OsterreichSozialversicherungsnummerView label=\"Sozialversicherungsnummer (SVNR)\" value={value} />\n  </SummaryListItem>\n</SummaryList>\n"}},
                "magyarorszag-taj-szam-input": {"usage":{"lang":"html","code":"<Field label=\"Társadalombiztosítási Azonosító Jel (TAJ)\" required>\n  <MagyarorszagTajSzamInput label=\"Társadalombiztosítási Azonosító Jel (TAJ)\" value={value} required />\n  <Hint>Nine digits, displayed as SSS SSS SSK. The first eight digits are a simple issued-in-order serial number; the ninth is a check digit computed by multiplying the first eight digits by alternating weights 3 and 7, summing the products, and taking the result Modulus 10 — an algorithm unique to Hungary, distinct from Luhn.</Hint>\n  <ErrorMessage>Please enter a valid Társadalombiztosítási Azonosító Jel</ErrorMessage>\n</Field>\n"}},
                "magyarorszag-taj-szam-view": {"usage":{"lang":"html","code":"<SummaryList>\n  <SummaryListItem term=\"Társadalombiztosítási Azonosító Jel (TAJ)\">\n    <MagyarorszagTajSzamView label=\"Társadalombiztosítási Azonosító Jel (TAJ)\" value={value} />\n  </SummaryListItem>\n</SummaryList>\n"}},
                "luxembourg-matricule-input": {"usage":{"lang":"html","code":"<Field label=\"Numéro d'Identification Nationale (Matricule)\" required>\n  <LuxembourgMatriculeInput label=\"Numéro d'Identification Nationale (Matricule)\" value={value} required />\n  <Hint>Thirteen digits in the form YYYYMMDDNNNCC: the first eight digits encode date of birth (YYYYMMDD); the next three are a sequence number; the twelfth digit is a Luhn (Modulus-10) check digit computed over the first eleven digits; the thirteenth digit is a second, independent check digit computed with the Verhoeff algorithm over the first twelve digits.</Hint>\n  <ErrorMessage>Please enter a valid Numéro d'Identification Nationale</ErrorMessage>\n</Field>\n"}},
                "luxembourg-matricule-view": {"usage":{"lang":"html","code":"<SummaryList>\n  <SummaryListItem term=\"Numéro d'Identification Nationale (Matricule)\">\n    <LuxembourgMatriculeView label=\"Numéro d'Identification Nationale (Matricule)\" value={value} />\n  </SummaryListItem>\n</SummaryList>\n"}},
                "zhongguo-jumin-shenfenzheng-haoma-input": {"usage":{"lang":"html","code":"<Field label=\"居民身份证号码 (Jūmín Shēnfènzhèng Hàomǎ)\" required>\n  <ZhongguoJuminShenfenzhengHaomaInput label=\"居民身份证号码 (Jūmín Shēnfènzhèng Hàomǎ)\" value={value} required />\n  <Hint>Eighteen characters under national standard GB 11643. The first six digits encode the region of registration; the next eight encode date of birth (YYYYMMDD); the next three are a sequence number whose last digit's parity encodes sex (odd male, even female); the eighteenth character is a check character computed with the ISO 7064:1983 MOD 11-2 algorithm over the first seventeen digits — a value of 10 is written as the letter X.</Hint>\n  <ErrorMessage>Please enter a valid 居民身份证号码</ErrorMessage>\n</Field>\n"}},
                "zhongguo-jumin-shenfenzheng-haoma-view": {"usage":{"lang":"html","code":"<SummaryList>\n  <SummaryListItem term=\"居民身份证号码 (Jūmín Shēnfènzhèng Hàomǎ)\">\n    <ZhongguoJuminShenfenzhengHaomaView label=\"居民身份证号码 (Jūmín Shēnfènzhèng Hàomǎ)\" value={value} />\n  </SummaryListItem>\n</SummaryList>\n"}},
                "rossiya-snils-input": {"usage":{"lang":"html","code":"<Field label=\"СНИЛС (Strakhovoy Nomer Individualnogo Litsevogo Scheta)\" required>\n  <RossiyaSnilsInput label=\"СНИЛС (Strakhovoy Nomer Individualnogo Litsevogo Scheta)\" value={value} required />\n  <Hint>Eleven digits, displayed as NNN-NNN-NNN CC. The first nine digits are an account number; the last two form a Modulus-101 check value computed as a weighted sum of the first nine digits (each multiplied by its position from 9 down to 1), with sums of 100 or 101 both mapping to a check value of 00.</Hint>\n  <ErrorMessage>Please enter a valid СНИЛС</ErrorMessage>\n</Field>\n"}},
                "rossiya-snils-view": {"usage":{"lang":"html","code":"<SummaryList>\n  <SummaryListItem term=\"СНИЛС (Strakhovoy Nomer Individualnogo Litsevogo Scheta)\">\n    <RossiyaSnilsView label=\"СНИЛС (Strakhovoy Nomer Individualnogo Litsevogo Scheta)\" value={value} />\n  </SummaryListItem>\n</SummaryList>\n"}},
                "turkiye-tc-kimlik-numarasi-input": {"usage":{"lang":"html","code":"<Field label=\"T.C. Kimlik Numarası\" required>\n  <TurkiyeTcKimlikNumarasiInput label=\"T.C. Kimlik Numarası\" value={value} required />\n  <Hint>Eleven digits, the first never zero. The tenth digit is the units digit of ((sum of digits 1,3,5,7,9) × 7) plus ((sum of digits 2,4,6,8) × 9); the eleventh digit is the units digit of the sum of the first ten digits. The eleventh digit is always even.</Hint>\n  <ErrorMessage>Please enter a valid T.C. Kimlik Numarası</ErrorMessage>\n</Field>\n"}},
                "turkiye-tc-kimlik-numarasi-view": {"usage":{"lang":"html","code":"<SummaryList>\n  <SummaryListItem term=\"T.C. Kimlik Numarası\">\n    <TurkiyeTcKimlikNumarasiView label=\"T.C. Kimlik Numarası\" value={value} />\n  </SummaryListItem>\n</SummaryList>\n"}},
                "argentina-codigo-unico-de-identificacion-laboral-input": {"usage":{"lang":"html","code":"<Field label=\"Código Único de Identificación Laboral (CUIL)\" required>\n  <ArgentinaCodigoUnicoDeIdentificacionLaboralInput label=\"Código Único de Identificación Laboral (CUIL)\" value={value} required />\n  <Hint>Displayed as XX-NNNNNNNN-X: a two-digit prefix denoting registration type/sex (historically 20 male, 27 female, though this classification was discontinued in 2012), the eight-digit DNI (national identity document) number, and a Modulus-11 check digit computed over the ten preceding digits.</Hint>\n  <ErrorMessage>Please enter a valid Código Único de Identificación Laboral</ErrorMessage>\n</Field>\n"}},
                "argentina-codigo-unico-de-identificacion-laboral-view": {"usage":{"lang":"html","code":"<SummaryList>\n  <SummaryListItem term=\"Código Único de Identificación Laboral (CUIL)\">\n    <ArgentinaCodigoUnicoDeIdentificacionLaboralView label=\"Código Único de Identificación Laboral (CUIL)\" value={value} />\n  </SummaryListItem>\n</SummaryList>\n"}},
                "ukrayina-reyestratsiyniy-nomer-oblikovoyi-kartky-platnyka-podatkiv-input": {"usage":{"lang":"html","code":"<Field label=\"Реєстраційний номер облікової картки платника податків (РНОКПП)\" required>\n  <UkrayinaReyestratsiyniyNomerOblikovoyiKartkyPlatnykaPodatkivInput label=\"Реєстраційний номер облікової картки платника податків (РНОКПП)\" value={value} required />\n  <Hint>Ten digits. The first five encode date of birth as the number of days elapsed since 1 January 1900; the next four are a registration sequence number, whose own last digit's parity encodes sex (odd male, even female); the tenth digit is a check digit computed with a weighted-sum algorithm over the first nine digits.</Hint>\n  <ErrorMessage>Please enter a valid Реєстраційний номер облікової картки платника податків</ErrorMessage>\n</Field>\n"}},
                "ukrayina-reyestratsiyniy-nomer-oblikovoyi-kartky-platnyka-podatkiv-view": {"usage":{"lang":"html","code":"<SummaryList>\n  <SummaryListItem term=\"Реєстраційний номер облікової картки платника податків (РНОКПП)\">\n    <UkrayinaReyestratsiyniyNomerOblikovoyiKartkyPlatnykaPodatkivView label=\"Реєстраційний номер облікової картки платника податків (РНОКПП)\" value={value} />\n  </SummaryListItem>\n</SummaryList>\n"}},
                "indonesia-nomor-induk-kependudukan-input": {"usage":{"lang":"html","code":"<Field label=\"Nomor Induk Kependudukan (NIK)\" required>\n  <IndonesiaNomorIndukKependudukanInput label=\"Nomor Induk Kependudukan (NIK)\" value={value} required />\n  <Hint>Sixteen digits in the form PPKKCC-DDMMYY-NNNN: the first six digits encode province, regency/city, and sub-district of first registration; the next six encode date of birth (with 40 added to the day-of-month digits for a female holder, e.g. day 10 becomes 50); the final four digits are a sequence number disambiguating same-day-same-subdistrict registrations. No published check digit.</Hint>\n  <ErrorMessage>Please enter a valid Nomor Induk Kependudukan</ErrorMessage>\n</Field>\n"}},
                "indonesia-nomor-induk-kependudukan-view": {"usage":{"lang":"html","code":"<SummaryList>\n  <SummaryListItem term=\"Nomor Induk Kependudukan (NIK)\">\n    <IndonesiaNomorIndukKependudukanView label=\"Nomor Induk Kependudukan (NIK)\" value={value} />\n  </SummaryListItem>\n</SummaryList>\n"}},
                "prathet-thai-lek-prajam-tua-prachachon-input": {"usage":{"lang":"html","code":"<Field label=\"เลขประจำตัวประชาชน (Lek Prajam Tua Prachachon)\" required>\n  <PrathetThaiLekPrajamTuaPrachachonInput label=\"เลขประจำตัวประชาชน (Lek Prajam Tua Prachachon)\" value={value} required />\n  <Hint>Thirteen digits. Digit 1 denotes registration category; digits 2-5 denote the district/province office of registration; digits 6-10 form a serial number; digit 11 is a Modulus-11 check digit computed over the first ten digits; digits 12-13 are further disambiguating digits.</Hint>\n  <ErrorMessage>Please enter a valid เลขประจำตัวประชาชน</ErrorMessage>\n</Field>\n"}},
                "prathet-thai-lek-prajam-tua-prachachon-view": {"usage":{"lang":"html","code":"<SummaryList>\n  <SummaryListItem term=\"เลขประจำตัวประชาชน (Lek Prajam Tua Prachachon)\">\n    <PrathetThaiLekPrajamTuaPrachachonView label=\"เลขประจำตัวประชาชน (Lek Prajam Tua Prachachon)\" value={value} />\n  </SummaryListItem>\n</SummaryList>\n"}},
                "chile-rol-unico-nacional-input": {"usage":{"lang":"html","code":"<Field label=\"Rol Único Nacional (RUN)\" required>\n  <ChileRolUnicoNacionalInput label=\"Rol Único Nacional (RUN)\" value={value} required />\n  <Hint>Seven or eight digits plus a trailing check character. The check character is computed with a Modulus-11 algorithm: each body digit, read right to left, is multiplied by a repeating weight sequence 2,3,4,5,6,7; the products are summed; the check value is 11 minus the sum's Modulus-11 remainder, where a result of 11 maps to 0 and a result of 10 maps to the letter K.</Hint>\n  <ErrorMessage>Please enter a valid Rol Único Nacional</ErrorMessage>\n</Field>\n"}},
                "chile-rol-unico-nacional-view": {"usage":{"lang":"html","code":"<SummaryList>\n  <SummaryListItem term=\"Rol Único Nacional (RUN)\">\n    <ChileRolUnicoNacionalView label=\"Rol Único Nacional (RUN)\" value={value} />\n  </SummaryListItem>\n</SummaryList>\n"}},
                "misr-al-raqm-al-qawmi-input": {"usage":{"lang":"html","code":"<Field label=\"الرقم القومي (Al-Raqm Al-Qawmi)\" required>\n  <MisrAlRaqmAlQawmiInput label=\"الرقم القومي (Al-Raqm Al-Qawmi)\" value={value} required />\n  <Hint>Fourteen digits. The first digit encodes century of birth (2 for 1900-1999, 3 for 2000-2099); the next six encode date of birth (YYMMDD); the next two encode governorate of birth/registration; the next four are a serial number whose own parity encodes sex (odd male, even female); the fourteenth digit is a check digit.</Hint>\n  <ErrorMessage>Please enter a valid الرقم القومي</ErrorMessage>\n</Field>\n"}},
                "misr-al-raqm-al-qawmi-view": {"usage":{"lang":"html","code":"<SummaryList>\n  <SummaryListItem term=\"الرقم القومي (Al-Raqm Al-Qawmi)\">\n    <MisrAlRaqmAlQawmiView label=\"الرقم القومي (Al-Raqm Al-Qawmi)\" value={value} />\n  </SummaryListItem>\n</SummaryList>\n"}},
                "one-time-password-input": {"usage":{"lang":"html","code":"<OneTimePasswordInput label=\"Verification code\" length={6} bind:value={code} name=\"otp\" required />\n"},"variants":[{"title":"Four digits","html":"<label class=\"label\" for=\"otp-four\">PIN</label> <input class=\"one-time-password-input\" id=\"otp-four\" type=\"text\" inputmode=\"numeric\" autocomplete=\"one-time-code\" maxlength=\"4\" pattern=\"[0-9]*\" spellcheck=\"false\" autocapitalize=\"off\" data-length=\"4\" aria-label=\"PIN\" />"}]},

                function renderComponent(component) {
                    var heading = document.getElementById("page-heading");
                    var content = document.getElementById("component-content");
                    var tag = slugToTag(component.slug);
                    var desc =
                        component.description.charAt(0).toUpperCase() +
                        component.description.slice(1);

                    document.title = component.name + " — Lily Design System";
                    heading.textContent = component.name;

                    var demoHtml = componentDemos[component.slug] || '';
                    var example = componentExamples[component.slug] || {};
                    var variantsHtml = '';
                    if (example.variants && example.variants.length) {
                        variantsHtml = '<div class="card" role="region" aria-label="More examples"><h2>More examples</h2>';
                        for (var vi = 0; vi < example.variants.length; vi++) {
                            var variant = example.variants[vi];
                            variantsHtml +=
                                '<h3>' + escapeHtml(variant.title) + '</h3>' +
                                '<div style="padding: 1.5rem;">' + variant.html + '</div>' +
                                '<details><summary>Show markup</summary><pre tabindex="0"><code>' +
                                escapeHtml(variant.html) + '</code></pre></details>';
                        }
                        variantsHtml += '</div>';
                    }
                    var usageHtml = example.usage
                        ? escapeHtml(example.usage.code)
                        : '&lt;' + escapeHtml(tag) + '&gt;\n  &lt;!-- content --&gt;\n&lt;/' + escapeHtml(tag) + '&gt;';

                    content.innerHTML =
                        '<p><a href="index.html">Back to all components</a></p>' +
                        '<div class="card" role="region" aria-label="Live demo">' +
                        '<h2>Demo</h2>' +
                        '<div style="padding: 1.5rem;">' +
                        demoHtml +
                        '</div>' +
                        '<details><summary>Show demo markup</summary><pre tabindex="0"><code>' +
                        escapeHtml(demoHtml) +
                        '</code></pre></details>' +
                        '</div>' +
                        variantsHtml +
                        '<div class="card" role="region" aria-label="Component overview">' +
                        "<h2>Overview</h2>" +
                        '<table class="data-table" aria-label="Component details">' +
                        "<tbody>" +
                        '<tr><th scope="row">Name</th><td>' +
                        escapeHtml(component.name) +
                        "</td></tr>" +
                        '<tr><th scope="row">Slug</th><td><code>' +
                        escapeHtml(component.slug) +
                        "</code></td></tr>" +
                        '<tr><th scope="row">Description</th><td>' +
                        escapeHtml(desc) +
                        ".</td></tr>" +
                        '<tr><th scope="row">HTML Tag</th><td><code>&lt;' +
                        escapeHtml(tag) +
                        "&gt;</code></td></tr>" +
                        "</tbody>" +
                        "</table>" +
                        "</div>" +
                        '<div class="card" role="region" aria-label="Usage example">' +
                        "<h2>Usage</h2>" +
                        '<pre tabindex="0"><code>' +
                        usageHtml +
                        "</code></pre>" +
                        "</div>" +
                        '<div class="card" role="region" aria-label="Import example">' +
                        "<h2>Import</h2>" +
                        '<pre tabindex="0"><code>&lt;script src="components/' +
                        escapeHtml(component.slug) +
                        "/" +
                        escapeHtml(component.slug) +
                        '.js"&gt;&lt;/script&gt;</code></pre>' +
                        "</div>" +
                        '<p><a href="index.html">Back to all components</a></p>';
                }

                function renderNotFound(slug) {
                    var heading = document.getElementById("page-heading");
                    var content = document.getElementById("component-content");

                    document.title = "Component Not Found — Lily Design System";
                    heading.textContent = "Component Not Found";

                    content.innerHTML =
                        '<div class="banner" role="alert" aria-label="Error">' +
                        "<p>No component found with slug <code>" +
                        escapeHtml(slug || "") +
                        "</code>.</p>" +
                        "</div>" +
                        '<p><a href="index.html">Back to all components</a></p>';
                }

                var params = new URLSearchParams(window.location.search);
                var slug = params.get("slug");

                if (!slug) {
                    renderNotFound("");
                    return;
                }

                var found = null;
                for (var i = 0; i < components.length; i++) {
                    if (components[i].slug === slug) {
                        found = components[i];
                        break;
                    }
                }

                if (found) {
                    renderComponent(found);
                } else {
                    renderNotFound(slug);
                }
            })();
        </script>
