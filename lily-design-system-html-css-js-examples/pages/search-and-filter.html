<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search and Filter — Lily Design System</title>
  <link rel="stylesheet" href="/assets/css/app-shell.css">
  <script src="/assets/js/theme-boot.js"></script>
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to main content</a>

  <header class="header" aria-label="Site header">
    <span class="site-header-pickers">
    <theme-picker
      label="Choose a theme"
      themes-url="/themes/"
      themes="united-kingdom-national-health-service-england-for-patients,united-kingdom-national-health-service-england-for-practitioners,united-kingdom-national-health-service-scotland-for-patients,united-kingdom-national-health-service-wales-for-patients,united-kingdom-government-digital-service,united-states-web-design-system,adobe-spectrum,mozilla-protocol,light,dark"
      theme-labels="{&quot;united-kingdom-national-health-service-england-for-patients&quot;: &quot;NHS England (patients)&quot;, &quot;united-kingdom-national-health-service-england-for-practitioners&quot;: &quot;NHS England (practitioners)&quot;, &quot;united-kingdom-national-health-service-scotland-for-patients&quot;: &quot;NHS Scotland (patients)&quot;, &quot;united-kingdom-national-health-service-wales-for-patients&quot;: &quot;NHS Wales (patients)&quot;, &quot;united-kingdom-government-digital-service&quot;: &quot;GOV.UK GDS&quot;, &quot;united-states-web-design-system&quot;: &quot;USWDS&quot;, &quot;adobe-spectrum&quot;: &quot;Adobe Spectrum&quot;, &quot;mozilla-protocol&quot;: &quot;Mozilla Protocol&quot;, &quot;light&quot;: &quot;Light&quot;, &quot;dark&quot;: &quot;Dark&quot;}"
      default-value="united-kingdom-national-health-service-england-for-patients"
      storage-key="lily-theme"
    ></theme-picker>
      <locale-picker
        label="Choose a language"
        locales="en-GB,cy-GB,fr-FR,ar"
        locale-labels="{&quot;en-GB&quot;: &quot;English (UK)&quot;, &quot;cy-GB&quot;: &quot;Cymraeg&quot;, &quot;fr-FR&quot;: &quot;Français&quot;, &quot;ar&quot;: &quot;العربية&quot;}"
        default-value="en-GB"
        storage-key="lily-locale"
      ></locale-picker>
      <text-size-picker
        label="Text size"
        sizes="small,medium,large"
        size-labels="{&quot;small&quot;: &quot;Small&quot;, &quot;medium&quot;: &quot;Medium&quot;, &quot;large&quot;: &quot;Large&quot;}"
        default-value="medium"
        storage-key="lily-text-size"
      ></text-size-picker>
    </span>
    <h1>Search and Filter</h1>
    <nav class="navigation-menu" aria-label="Main navigation">
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="search-and-filter.html" aria-current="page">Search</a></li>
      </ul>
    </nav>
  </header>

  <main id="main-content" class="page-wrapper">
    <h1>Product Search</h1>

    <input class="search-input" role="searchbox" type="search" aria-label="Search products" placeholder="Search by name..." id="search-input">

    <h2>Filter by Category</h2>
    <div class="combobox" role="combobox" aria-label="Select category" aria-expanded="false" id="category-combobox">
      <input class="text-input" type="text" aria-label="Category filter" placeholder="Type to filter categories..." id="combo-input" autocomplete="off">
      <ul role="listbox" aria-label="Category suggestions" id="combo-listbox" hidden>
      </ul>
    </div>

    <div class="tag-group" role="group" aria-label="Active filters" id="tag-group">
    </div>

    <h2>Results (<span id="result-count">8</span>)</h2>
    <table class="data-table" aria-label="Product catalog">
      <thead>
        <tr>
          <th scope="col">Name</th>
          <th scope="col">Category</th>
          <th scope="col">Price</th>
          <th scope="col">Status</th>
        </tr>
      </thead>
      <tbody id="product-tbody">
      </tbody>
    </table>
  </main>

  <footer class="footer" aria-label="Site footer">
    <p class="footer-trademark">Lily™ and Lily Design System™ are trademarks.</p>
    <p>&copy; 2026 Lily Design System. All rights reserved.</p>
  </footer>

  <script src="/assets/js/pages/search-and-filter.js"></script>
  <script type="module" src="/assets/js/theme-picker.js"></script>
  <script type="module" src="/assets/js/locale-picker.js"></script>
  <script type="module" src="/assets/js/text-size-picker.js"></script>
</body>
</html>
