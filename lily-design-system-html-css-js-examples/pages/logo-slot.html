<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Logo slot — Lily Design System</title>
  <link rel="stylesheet" href="/assets/css/app-shell.css">
  <script src="/assets/js/theme-boot.js"></script>
  <style>
    /* The adopter (or a theme) sets these; Lily sets neither. */
    :root {
      --lily-logo-clear-space: 0.5rem;
      --lily-logo-min-size: 8rem;
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to main content</a>

  <header class="header" aria-label="Site header">
    <!-- The adopter's own mark. This one is a fictional organisation, drawn inline. -->
    <a href="index.html" data-lily-logo>
      <svg role="img" aria-label="Example Organisation" viewBox="0 0 160 40" width="160" height="40">
        <rect width="40" height="40" rx="8" fill="currentColor"></rect>
        <text x="50" y="27" font-size="20" font-family="system-ui, sans-serif" fill="currentColor">Example Org</text>
      </svg>
    </a>
    <nav class="navigation-menu" aria-label="Main navigation">
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="logo-slot.html" aria-current="page">Logo slot</a></li>
      </ul>
    </nav>
  </header>

  <main id="main-content" class="page-wrapper">
    <h1>Logo slot</h1>
    <p>
      The header mark is the adopter's own SVG inside a link to the home page. Its accessible name is the organisation's name,
      and the theme's shared Logo slot section adds the clear space and minimum size this page sets.
    </p>
  </main>
</body>
</html>
