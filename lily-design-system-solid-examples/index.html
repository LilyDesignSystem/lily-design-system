<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    />
    <title>Lily Design System — Solid examples</title>
    <meta
      name="description"
      content="Solid 2.0 examples of the Lily Design System using NHS UK styles"
    />
    <script>
      // Creates the managed theme <link> before first paint (the stored slug if any, else the default) and sets
      // data-theme, so nothing paints unthemed; the theme picker adopts this link when it mounts.
      (function () {
        var slug = "united-kingdom-national-health-service-england-for-patients";
        try {
          var stored = localStorage.getItem("lily-theme");
          if (stored && /^[a-z0-9-]+$/.test(stored)) slug = stored;
        } catch (e) {}
        var link = document.createElement("link");
        link.rel = "stylesheet";
        link.setAttribute("data-lily-theme-picker", "theme");
        link.href = "/themes/" + slug + ".css";
        document.head.appendChild(link);
        document.documentElement.setAttribute("data-theme", slug);
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script
      type="module"
      src="/src/main.tsx"
    ></script>
  </body>
</html>
