name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # pnpm 11, matching the rest of the monorepo (plan P7-T12). Pinned
      # here explicitly because this repo's pnpm-workspace.yaml carries an
      # `overrides` block -- a pnpm 10+ feature -- that pnpm 9 silently
      # ignores; under a frozen-lockfile install, pnpm 9 then reports the
      # lockfile's recorded override as a "config mismatch" against the
      # (from its perspective) unconfigured current state. Confirmed
      # 2026-09-06: regenerating the lockfile under pnpm 9 instead would
      # have reverted the cookie override to the vulnerable 0.6.0
      # (GHSA-pxg6-pf52-xh8x) -- a real security regression, not a fix.
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build site
        run: pnpm build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
