  <h1>ભાષા પસંદ કરો</h1>
  <p class="page-intro-tagline">
    મુખ્ય પૃષ્ઠ નીચેની દરેક ભાષામાં અનુવાદિત છે. ઊંડાં પૃષ્ઠો (ટ્યુટોરિયલ, ઘટક દસ્તાવેજો) હાલ હજી ફક્ત અંગ્રેજીમાં છે — દરેક અનુવાદિત મુખ્ય પૃષ્ઠ પર તેની પોતાની ભાષામાં નોંધ જુઓ.
  </p>
