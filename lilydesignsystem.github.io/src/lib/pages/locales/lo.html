<section class="page-intro">
  <h1>ເລືອກພາສາ</h1>
  <p class="page-intro-tagline">
    ໜ້າຫຼັກຖືກແປເປັນທຸກພາສາຂ້າງລຸ່ມ. ໜ້າທີ່ເລິກກວ່າ (ບົດສອນ, ເອກະສານອົງປະກອບ) ຍັງເປັນພາສາອັງກິດເທົ່ານັ້ນໃນຕອນນີ້ — ເບິ່ງໝາຍເຫດເປັນພາສາຂອງມັນເອງໃນທຸກໜ້າຫຼັກທີ່ແປແລ້ວ.
  </p>
</section>
