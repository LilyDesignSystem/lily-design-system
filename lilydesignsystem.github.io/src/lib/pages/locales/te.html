<section class="page-intro">
  <h1>భాషను ఎంచుకోండి</h1>
  <p class="page-intro-tagline">
    హోమ్ పేజీ క్రింద ఉన్న ప్రతి భాషలోకి అనువదించబడింది. లోతైన పేజీలు (ట్యుటోరియల్స్, కాంపోనెంట్ డాక్యుమెంటేషన్) ప్రస్తుతానికి ఇంకా ఇంగ్లీష్‌లో మాత్రమే ఉన్నాయి — ప్రతి అనువదించిన హోమ్ పేజీలో దాని స్వంత భాషలో గమనిక చూడండి.
  </p>
</section>
