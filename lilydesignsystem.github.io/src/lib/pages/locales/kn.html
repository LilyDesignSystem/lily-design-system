<section class="page-intro">
  <h1>ಭಾಷೆಯನ್ನು ಆರಿಸಿ</h1>
  <p class="page-intro-tagline">
    ಮುಖಪುಟವನ್ನು ಕೆಳಗಿನ ಪ್ರತಿ ಭಾಷೆಗೂ ಅನುವಾದಿಸಲಾಗಿದೆ. ಆಳವಾದ ಪುಟಗಳು (ಟ್ಯುಟೋರಿಯಲ್‌ಗಳು, ಘಟಕ ದಾಖಲೆಗಳು) ಸದ್ಯಕ್ಕೆ ಇಂಗ್ಲಿಷ್‌ನಲ್ಲಿ ಮಾತ್ರ — ಪ್ರತಿ ಅನುವಾದಿತ ಮುಖಪುಟದಲ್ಲಿ ಅದರದೇ ಭಾಷೆಯ ಟಿಪ್ಪಣಿ ನೋಡಿ.
  </p>
</section>
