<section class="page-intro">
  <h1>ஒரு மொழியைத் தேர்ந்தெடுங்கள்</h1>
  <p class="page-intro-tagline">
    முகப்புப் பக்கம் கீழுள்ள ஒவ்வொரு மொழியிலும் மொழிபெயர்க்கப்பட்டுள்ளது. ஆழமான பக்கங்கள் (பயிற்சிகள், கூறு ஆவணங்கள்) தற்போது இன்னும் ஆங்கிலத்தில் மட்டுமே உள்ளன — ஒவ்வொரு மொழிபெயர்க்கப்பட்ட முகப்புப் பக்கத்திலும் அதன் சொந்த மொழியில் உள்ள குறிப்பைப் பாருங்கள்.
  </p>
</section>
