<section class="page-intro">
  <h1>ਭਾਸ਼ਾ ਚੁਣੋ</h1>
  <p class="page-intro-tagline">
    ਮੁੱਖ ਪੰਨਾ ਹੇਠਾਂ ਦਿੱਤੀ ਹਰ ਭਾਸ਼ਾ ਵਿੱਚ ਅਨੁਵਾਦ ਕੀਤਾ ਗਿਆ ਹੈ। ਹੋਰ ਡੂੰਘੇ ਪੰਨੇ (ਟਿਊਟੋਰਿਅਲ, ਕੰਪੋਨੈਂਟ ਦਸਤਾਵੇਜ਼) ਹਾਲ ਦੀ ਘੜੀ ਸਿਰਫ਼ ਅੰਗਰੇਜ਼ੀ ਵਿੱਚ ਹਨ — ਹਰ ਅਨੁਵਾਦ ਕੀਤੇ ਮੁੱਖ ਪੰਨੇ ਉੱਤੇ ਉਸਦੀ ਆਪਣੀ ਭਾਸ਼ਾ ਵਿੱਚ ਨੋਟ ਵੇਖੋ।
  </p>
</section>
