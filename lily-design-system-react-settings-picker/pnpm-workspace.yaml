allowBuilds:
  esbuild: true
  sharp: true
  "@parcel/watcher": true
  unrs-resolver: true
# vite's optional esbuild peer resolves to 0.27.7 (below the
# 0.28.1 GHSA fix) alongside a separately-patched 0.28.2 pulled in
# elsewhere in the tree -- two copies. vite's own peer range
# (^0.27.0 || ^0.28.0) already accepts 0.28.x, so pinning everyone
# to one patched version is safe.
overrides:
  esbuild: "0.28.2"
