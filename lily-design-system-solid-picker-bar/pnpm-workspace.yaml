allowBuilds:
  esbuild: true
  sharp: true
  "@parcel/watcher": true
  unrs-resolver: true
# vite's optional esbuild peer resolves to 0.27.7 (below the
# 0.28.1 GHSA fix) alongside a separately-patched 0.28.2 pulled in
# elsewhere in the tree -- two copies. vite's own peer range
# (^0.27.0 || ^0.28.0) already accepts 0.28.x, so pinning everyone
# to one patched version is safe.
minimumReleaseAgeExclude:
  - "@lilydesignsystem/react-time-zone-picker@0.1.0"
  - "@lilydesignsystem/react-theme-picker@0.4.0"
  - "@solidjs/babel-plugin@2.0.0"
  - "@solidjs/compiler-darwin-arm64@2.0.0"
  - "@solidjs/compiler-darwin-x64@2.0.0"
  - "@solidjs/compiler-linux-arm64-gnu@2.0.0"
  - "@solidjs/compiler-linux-x64-gnu@2.0.0"
  - "@solidjs/compiler-wasm32-wasi@2.0.0"
  - "@solidjs/compiler-win32-x64-msvc@2.0.0"
  - "@solidjs/compiler@2.0.0"
  - "@solidjs/signals@2.0.0"
  - "@solidjs/vite-plugin@3.0.0"
  - "@solidjs/web@2.0.0"
  - solid-js@2.0.0
overrides:
  esbuild: "0.28.2"
  # Until the sibling Solid pickers are on npm (tasks.md P36-T6), install them from this monorepo. package.json keeps
  # the ^0.1.0 ranges the published package needs; drop these lines once they are published.
  "@lilydesignsystem/solid-link-picker": "link:../lily-design-system-solid-link-picker"
  "@lilydesignsystem/solid-locale-picker": "link:../lily-design-system-solid-locale-picker"
  "@lilydesignsystem/solid-search-picker": "link:../lily-design-system-solid-search-picker"
  "@lilydesignsystem/solid-share-picker": "link:../lily-design-system-solid-share-picker"
  "@lilydesignsystem/solid-text-size-picker": "link:../lily-design-system-solid-text-size-picker"
  "@lilydesignsystem/solid-theme-picker": "link:../lily-design-system-solid-theme-picker"
  "@lilydesignsystem/solid-time-zone-picker": "link:../lily-design-system-solid-time-zone-picker"
