<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Lily Design System — Angular examples</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <base href="/" />
    <script>
      // Creates the managed theme <link> before first paint (persisted
      // slug if any, else the default) and sets data-theme; the
      // theme-picker helper adopts it after bootstrap.
      (function () {
        var slug = "united-kingdom-national-health-service-england-for-patients";
        try {
          var stored = localStorage.getItem("lily-theme");
          if (stored && /^[a-z0-9-]+$/.test(stored)) slug = stored;
        } catch (e) {}
        var link = document.createElement("link");
        link.rel = "stylesheet";
        link.setAttribute("data-lily-theme-picker", "theme");
        link.href = "/themes/" + slug + ".css";
        document.head.appendChild(link);
        document.documentElement.setAttribute("data-theme", slug);
      })();
    </script>
  </head>
  <body>
    <lily-app></lily-app>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
