<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>search-picker — basic</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 2rem; max-width: 40rem; }
      lily-search-picker { display: inline-block; }
      .search-picker { position: relative; display: inline-block; }
      .search-picker-button, .search-picker-submit {
        display: inline-flex; align-items: center; justify-content: center;
        font: inherit; cursor: pointer; padding: 0.4rem 0.6rem;
        background: none; border: 1px solid currentColor; border-radius: 0.25rem;
      }
      .search-picker-panel {
        position: absolute; inset-block-start: 100%; inset-inline-start: 0; z-index: 10;
        margin-block-start: 0.25rem; padding: 0.5rem;
        background: #fff; border: 1px solid #d8dde0; border-radius: 0.25rem;
        box-shadow: 0 2px 8px rgb(0 0 0 / 0.12);
      }
      /* Required: the rule above would otherwise defeat [hidden]. */
      .search-picker-panel[hidden] { display: none; }
      .search-picker-form { display: flex; gap: 0.25rem; }
      .search-picker-input { font: inherit; padding: 0.4rem; min-inline-size: 14rem; }
      :focus-visible { outline: 3px solid #ffeb3b; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <h1>search-picker — basic</h1>
    <p>Search for <code>foo</code> and the page navigates to <code>/?foo</code>.</p>

    <lily-search-picker
      label="Search this site"
      input-label="Search terms"
      submit-label="Search"
      placeholder="Search…"
    ></lily-search-picker>

    <script type="module">
      import "/dist/search-picker.js";
    </script>
  </body>
</html>
