<!-- toast.html -->
<!-- Toast component (Alpine.js) -->
<!--
  Description: a brief auto-dismissing notification message
  HTML tag: <div>
  CSS class: toast
  Keyboard: none: a live region
  Accessibility: role="status" with aria-live="polite"; use role="alert" with aria-live="assertive" for an urgent one. The consumer owns the lifecycle
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<div class="toast" role="status" aria-live="polite" aria-label="">
  <!-- Consumer provides content -->
</div>
