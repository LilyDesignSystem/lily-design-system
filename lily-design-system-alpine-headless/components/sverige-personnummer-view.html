<!-- SverigePersonnummerView component (Alpine.js) -->
<!--
  Description: a read-only display of Sweden's Personnummer
  HTML tag: <span>
  CSS class: sverige-personnummer-view
  Keyboard: None (passive element)
  Accessibility: a visible caption names the value, or the screen-reader-span does. A plain span cannot take aria-label
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<span class="sverige-personnummer-view"
  ><span class="screen-reader-span">Personal Identity Number </span></span
>
