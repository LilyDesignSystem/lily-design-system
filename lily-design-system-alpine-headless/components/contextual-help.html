<!-- contextual-help.html -->
<!-- ContextualHelp component (Alpine.js) -->
<!--
  Description: a help button that opens a popover with explanatory content
  HTML tag: <div>
  CSS class: contextual-help
  Keyboard: Tab to the trigger, Enter or Space to open, Escape to close
  Accessibility: aria-haspopup="dialog", aria-expanded and aria-controls on the trigger; the panel is role="dialog"
  Popover API: the panel is popover="auto" and the trigger names it with
    command="toggle-popover" commandfor (and popovertarget), so it opens, and
    closes on Escape and on a click outside, even before Alpine starts
  Text: the trigger's visible text (such as "?" or "؟") and its aria-label are the consumer's
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<div
  class="contextual-help"
  x-data="lilyPopover(false)"
  x-bind="root"
>
  <button
    class="contextual-help-trigger"
    x-bind="trigger"
    aria-label=""
    aria-controls="contextual-help-panel-1"
    command="toggle-popover"
    commandfor="contextual-help-panel-1"
    popovertarget="contextual-help-panel-1"
  >
    <!-- Consumer provides the trigger text, such as "?" -->
  </button>
  <div
    class="contextual-help-panel"
    id="contextual-help-panel-1"
    role="dialog"
    aria-label=""
    popover="auto"
    x-bind="panel"
  >
    <!-- Consumer provides popover content -->
  </div>
</div>
