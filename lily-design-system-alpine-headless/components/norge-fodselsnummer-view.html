<!-- NorgeFodselsnummerView component (Alpine.js) -->
<!--
  Description: a read-only display of Norway's Fødselsnummer
  HTML tag: <span>
  CSS class: norge-fodselsnummer-view
  Keyboard: None (passive element)
  Accessibility: aria-label for accessible name
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<span
  class="norge-fodselsnummer-view"
  aria-label="Norwegian Birth Number"
></span>
