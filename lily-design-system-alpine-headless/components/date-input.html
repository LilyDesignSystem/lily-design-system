<!-- date-input.html -->
<!-- DateInput component (Alpine.js) -->
<!--
  Description: an input for entering a date value <input type="date">
  HTML tag: <input>
  CSS class: date-input
  Keyboard: Tab to focus, standard input keyboard interactions
  Accessibility: Implicit input role, aria-label for accessible name
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<input
  class="date-input"
  type="date"
  aria-label=""
>
