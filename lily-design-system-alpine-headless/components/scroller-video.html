<!-- scroller-video.html -->
<!-- ScrollerVideo component (Alpine.js) -->
<!--
  Description: a video-driven scrollytelling component with frame-by-frame scrubbing
  HTML tag: <div>
  CSS class: scroller-video
  Keyboard: None (passive element)
  Accessibility: role="group" with aria-label; drop both when the content needs no name
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<div
  class="scroller-video"
  role="group"
  aria-label=""
  data-offset="0.5"
>
  <div
    class="scroller-video-background"
    role="img"
    aria-roledescription="scrollable video"
    aria-label=""
  >
    <video
      class="scroller-video-element"
      src=""
      muted
      playsinline
      preload="auto"
    ></video>
  </div>
  <div
    class="scroller-video-foreground scroller-base"
    data-offset="0.5"
  >
    <!-- Consumer provides step children -->
  </div>
</div>
