<!-- badge.html -->
<!-- Badge component (Alpine.js) -->
<!--
  Description: a small label for counts, statuses, or categories
  HTML tag: <span>
  CSS class: badge
  Keyboard: None (passive element)
  Accessibility: role="status", aria-label for accessible name
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<span
  class="badge"
  data-type="default"
  role="status"
  aria-label=""
>
  <!-- Consumer provides text content -->
</span>
