<!-- EmojiCharacterRadioGroup component (Alpine.js) -->
<!--
  Description: a fieldset radio group for selecting an emoji character
  HTML tag: <fieldset>
  CSS class: emoji-character-radio-group
  Keyboard: None (passive element)
  Accessibility: role="radiogroup", aria-label for accessible name
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<fieldset
  class="emoji-character-radio-group"
  role="radiogroup"
  aria-label=""
>
  <!-- Consumer provides content -->
</fieldset>
