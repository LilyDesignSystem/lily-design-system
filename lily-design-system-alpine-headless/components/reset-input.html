<!-- reset-input.html -->
<!-- ResetInput component (Alpine.js) -->
<!--
  Description: a button input that resets a form to default values <input type="reset">
  HTML tag: <input>
  CSS class: reset-input
  Keyboard: Tab to focus, standard input keyboard interactions
  Accessibility: Implicit input role, aria-label for accessible name
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<input
  class="reset-input"
  type="reset"
  aria-label=""
>
