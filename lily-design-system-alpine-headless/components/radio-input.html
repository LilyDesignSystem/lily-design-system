<!-- radio-input.html -->
<!-- RadioInput component (Alpine.js) -->
<!--
  Description: a single radio button input <input type="radio">
  HTML tag: <input>
  CSS class: radio-input
  Keyboard: Tab to focus, standard input keyboard interactions
  Accessibility: Implicit input role, aria-label for accessible name
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<input
  class="radio-input"
  type="radio"
  aria-label=""
>
