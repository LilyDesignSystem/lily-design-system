<!-- gantt-table.html -->
<!-- GanttTable component (Alpine.js) -->
<!--
  Description: a Gantt chart table interactive grid for planning schedule visualization <table>
  HTML tag: <table with role="grid">
  CSS class: gantt-table
  Keyboard: arrows, Home, End, Ctrl+Home, Ctrl+End, PageUp and PageDown move between cells; one tab stop; Enter or F2 goes to the first control in a cell and Escape comes back
  Accessibility: role="grid" with required aria-label; set data-consumer-keys on the root to run your own keys
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<table
  class="gantt-table"
  role="grid"
  aria-label=""
  x-lily-grid
>
  <!-- Consumer provides thead, tbody, tfoot -->
</table>
