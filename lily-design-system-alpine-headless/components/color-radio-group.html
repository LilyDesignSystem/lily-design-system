<!-- ColorRadioGroup component (Alpine.js) -->
<!--
  Description: a fieldset radio group for selecting a color swatch
  HTML tag: <fieldset>
  CSS class: color-radio-group
  Keyboard: None (passive element)
  Accessibility: role="radiogroup", aria-label for accessible name
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<fieldset
  class="color-radio-group"
  role="radiogroup"
  aria-label=""
>
  <!-- Consumer provides content -->
</fieldset>
