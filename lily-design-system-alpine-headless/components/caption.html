<!-- caption.html -->
<!-- Caption component (Alpine.js) -->
<!--
  Description: a caption for a figure element
  HTML tag: <figcaption inside its figure>
  CSS class: caption
  Keyboard: none; not interactive, and any interactive children handle their own keys
  Accessibility: names its parent figure; a table's caption is the table's own <caption>
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<figure>
  <figcaption class="caption">
    <!-- Consumer provides child content -->
  </figcaption>
</figure>
