<!-- iran-kod-e-melli-input.html -->
<!-- IranKodEMelliInput component (Alpine.js) -->
<!--
  Description: an input for entering Iran's National Code (Kod-e Melli)
  HTML tag: <input>
  CSS class: iran-kod-e-melli-input
  Keyboard: Tab to focus, standard input keyboard interactions
  Accessibility: Implicit input role, aria-label for accessible name
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<input
  class="iran-kod-e-melli-input"
  type="text"
  aria-label="National Code (Kod-e Melli)"
  autocomplete="off"
/>
