<!-- mutually-exclusive.html -->
<!-- MutuallyExclusive component (Alpine.js) -->
<!--
  Description: a container ensuring only one option can be selected from a group
  HTML tag: <fieldset>
  CSS class: mutually-exclusive
  Keyboard: none; not interactive, and any interactive children handle their own keys
  Accessibility: aria-label
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<fieldset
  class="mutually-exclusive"
  aria-label=""
>
  <!-- Consumer provides content -->
</fieldset>
