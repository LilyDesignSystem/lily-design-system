<!-- progress-bar.html -->
<!-- ProgressBar component (Alpine.js) -->
<!--
  Description: a horizontal progress indicator
  HTML tag: <div>
  CSS class: progress-bar
  Keyboard: none; not interactive, and any interactive children handle their own keys
  Accessibility: 
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<div
  class="progress-bar"
  role="progressbar"
  aria-valuenow="0"
  aria-valuemin="0"
  aria-valuemax="100"
  aria-label=""
></div>
