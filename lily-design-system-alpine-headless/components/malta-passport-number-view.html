<!-- malta-passport-number-view.html -->
<!-- MaltaPassportNumberView component (Alpine.js) -->
<!--
  Description: a read-only display of Malta's Malta Passport Number
  HTML tag: <span>
  CSS class: malta-passport-number-view
  Keyboard: None (passive element)
  Accessibility: a visible caption names the value, or the screen-reader-span does. A plain span cannot take aria-label
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<span class="malta-passport-number-view"
  ><span class="screen-reader-span">Malta Passport Number </span></span
>
