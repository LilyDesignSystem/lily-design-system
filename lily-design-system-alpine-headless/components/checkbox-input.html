<!-- checkbox-input.html -->
<!-- CheckboxInput component (Alpine.js) -->
<!--
  Description: a checkbox input for toggling a boolean value <input type="checkbox">
  HTML tag: <input>
  CSS class: checkbox-input
  Keyboard: Tab to focus, standard input keyboard interactions
  Accessibility: Implicit input role, aria-label for accessible name
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<input
  class="checkbox-input"
  type="checkbox"
  aria-label=""
>
