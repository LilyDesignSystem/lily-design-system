<!-- ContentsNav component -->
<!--
  Description: a navigation landmark for a list of contents
  HTML tag: <nav>
  CSS class: contents-nav
  Keyboard: None (passive element)
  Accessibility: Implicit navigation role, aria-label for accessible name
  Usage:
    <nav class="contents-nav" aria-label="Example">
      ...
    </nav>
  Scrollspy (optional): mark the link of the section in view with
    aria-current and data-active by calling startScrollspy(nav, { offset,
    root, current, onChange }) from contents-nav-spy.js. The links are your
    own <a href="#id"> elements; see contents-nav-spy.js for the rules.
-->

<nav
  class="contents-nav"
  aria-label=""
>
  <!-- Consumer provides navigation list -->
</nav>
