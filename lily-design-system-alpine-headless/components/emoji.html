<!-- emoji.html -->
<!-- Emoji component (Alpine.js) -->
<!--
  Description: a single emoji character with accessible name
  HTML tag: <span>
  CSS class: emoji
  Keyboard: None (passive element)
  Accessibility: aria-label for accessible name
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<span
  class="emoji"
  aria-label=""
>
  <!-- Consumer provides text content -->
</span>
