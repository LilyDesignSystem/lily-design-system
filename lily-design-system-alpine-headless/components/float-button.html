<!-- float-button.html -->
<!-- FloatButton component (Alpine.js) -->
<!--
  Description: a floating action button anchored to a viewport corner
  HTML tag: <button>
  CSS class: float-button
  Keyboard: Tab to focus, Enter or Space to activate
  Accessibility: native button; aria-label names it; position is data-position plus the contract's structural inline style
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<button class="float-button" type="button" aria-label="" data-position="bottom-right"
        style="position: fixed; bottom: 1rem; right: 1rem;">
  <!-- Consumer provides icon content (SVG, emoji, or glyph) -->
</button>
