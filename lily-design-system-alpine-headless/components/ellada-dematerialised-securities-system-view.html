<!-- ElladaDematerialisedSecuritiesSystemView component (Alpine.js) -->
<!--
  Description: a read-only display of Greece's Dematerialised Securities System (DSS)
  HTML tag: <span>
  CSS class: ellada-dematerialised-securities-system-view
  Keyboard: None (passive element)
  Accessibility: a visible caption names the value, or the screen-reader-span does. A plain span cannot take aria-label
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<span class="ellada-dematerialised-securities-system-view"
  ><span class="screen-reader-span">Dematerialised Securities System </span></span
>
