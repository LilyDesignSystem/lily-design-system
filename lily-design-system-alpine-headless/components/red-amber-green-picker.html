<!-- red-amber-green-picker.html -->
<!-- RedAmberGreenPicker component (Alpine.js) -->
<!--
  Description: a picker for selecting a red/amber/green status
  HTML tag: <select>
  CSS class: red-amber-green-picker
  Keyboard: native select: arrows choose, Enter/Space opens, Escape closes
  Accessibility: native select named by aria-label; x-model keeps the chosen value in data-value
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<select class="red-amber-green-picker" aria-label="" x-data="{ value: 'red' }" x-model="value" :data-value="value">
  <option value="red"><!-- Consumer provides label --></option>
  <option value="amber"><!-- Consumer provides label --></option>
  <option value="green"><!-- Consumer provides label --></option>
</select>
