<!-- gantt-table-td.html -->
<!-- GanttTableTD component (Alpine.js) -->
<!--
  Description: a Gantt chart table interactive grid data cell for planning schedule visualization <td>
  HTML tag: <td wrapped in tabletr>
  CSS class: gantt-table-td
  Keyboard: none; not interactive, and any interactive children handle their own keys
  Accessibility: aria-label for accessible name
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<table>
  <tr>
    <td
      class="gantt-table-td"
      role="gridcell"
      aria-label="Example"
    >
      <!-- Consumer provides child content -->
    </td>
  </tr>
</table>
