<!-- SouthAfricaIdentityNumberView component (Alpine.js) -->
<!--
  Description: a read-only display of South Africa's Identity Number
  HTML tag: <span>
  CSS class: south-africa-identity-number-view
  Keyboard: None (passive element)
  Accessibility: a visible caption names the value, or the screen-reader-span does. A plain span cannot take aria-label
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<span class="south-africa-identity-number-view"
  ><span class="screen-reader-span">South African Identity Number </span></span
>
