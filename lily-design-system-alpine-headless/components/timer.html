<!-- timer.html -->
<!-- Timer component (Alpine.js) -->
<!--
  Description: a countdown or elapsed time display
  HTML tag: <time>
  CSS class: timer
  Keyboard: none
  Accessibility: role="timer" (implicitly aria-live="off": a ticking clock must not chatter); datetime is machine-readable; the consumer owns the countdown
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<time class="timer" role="timer" aria-label="" datetime="">
  <!-- Consumer provides the formatted time -->
</time>
