<!-- MagyarorszagTajSzamInput component (Alpine.js) -->
<!--
  Description: an input for entering Hungary's Tarsadalombiztositasi Azonosito Jel (TAJ)
  HTML tag: <input>
  CSS class: magyarorszag-taj-szam-input
  Keyboard: Tab to focus, standard input keyboard interactions
  Accessibility: Implicit input role, aria-label for accessible name
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<input
  class="magyarorszag-taj-szam-input"
  type="text"
  aria-label="Társadalombiztosítási Azonosító Jel (TAJ)"
  autocomplete="off"
>
