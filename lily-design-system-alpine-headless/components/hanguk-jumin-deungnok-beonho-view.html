<!-- HangukJuminDeungnokBeonhoView component (Alpine.js) -->
<!--
  Description: a read-only display of South Korea's Resident Registration Number
  HTML tag: <span>
  CSS class: hanguk-jumin-deungnok-beonho-view
  Keyboard: None (passive element)
  Accessibility: a visible caption names the value, or the screen-reader-span does. A plain span cannot take aria-label
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<span class="hanguk-jumin-deungnok-beonho-view"
  ><span class="screen-reader-span">Resident Registration Number (주민등록번호) </span></span
>
