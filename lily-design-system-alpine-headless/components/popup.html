<!-- popup.html -->
<!-- Popup component (Alpine.js) -->
<!--
  Description: a temporary overlay that appears above page content
  HTML tag: <div>
  CSS class: popup
  Keyboard: Escape closes and returns focus to the trigger; focus moves in on open
  Accessibility: role="dialog" with aria-label; tabindex -1 so it can take focus; non-modal
  Popover API: the popup is popover="auto" and the trigger names it with
    command="toggle-popover" commandfor (and popovertarget), so it opens, and
    closes on Escape and on a click outside, even before Alpine starts
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<div
  x-data="lilyPopover(false, { focus: true })"
  x-bind="root"
>
  <button
    class="popup-trigger"
    x-bind="trigger"
    aria-controls="popup-1"
    command="toggle-popover"
    commandfor="popup-1"
    popovertarget="popup-1"
  >
    <!-- Consumer provides trigger label -->
  </button>
  <div
    class="popup"
    id="popup-1"
    role="dialog"
    aria-label=""
    tabindex="-1"
    popover="auto"
    x-bind="panel"
  >
    <!-- Consumer provides content -->
    <button
      class="popup-close"
      x-bind="closer"
    >
      <!-- Consumer provides close label -->
    </button>
  </div>
</div>
