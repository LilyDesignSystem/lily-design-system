<!-- popup.html -->
<!-- Popup component (Alpine.js) -->
<!--
  Description: a temporary overlay that appears above page content
  HTML tag: <div>
  CSS class: popup
  Keyboard: Escape closes and returns focus to the trigger; focus moves in on open
  Accessibility: role="dialog" with aria-label; tabindex -1 so it can take focus; non-modal
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<div x-data="lilyOverlay(false)">
  <button class="popup-trigger" x-bind="trigger" aria-controls="popup-1"><!-- Consumer provides trigger label --></button>
  <div class="popup" id="popup-1" role="dialog" aria-label="" tabindex="-1" x-bind="surface">
    <!-- Consumer provides content -->
    <button class="popup-close" x-bind="closer"><!-- Consumer provides close label --></button>
  </div>
</div>
