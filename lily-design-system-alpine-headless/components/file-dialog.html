<!-- file-dialog.html -->
<!-- FileDialog component (Alpine.js) -->
<!--
  Description: a dialog for browsing and selecting files
  HTML tag: <dialog>
  CSS class: file-dialog
  Keyboard: Tab cycles focus inside, Escape closes
  Accessibility: native <dialog> opened with showModal(); aria-label names it; aria-modal="true"
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<div x-data="lilyDialog(false)">
  <button class="file-dialog-trigger" x-bind="trigger"><!-- Consumer provides trigger label --></button>
  <dialog class="file-dialog" aria-label="" x-bind="dialog">
    <!-- Consumer provides dialog content -->
    <button class="file-dialog-close" x-bind="closer"><!-- Consumer provides label --></button>
  </dialog>
</div>
