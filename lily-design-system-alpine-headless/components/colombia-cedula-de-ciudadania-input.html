<!-- ColombiaCedulaDeCiudadaniaInput component (Alpine.js) -->
<!--
  Description: an input for entering Colombia's Cedula de Ciudadania Number
  HTML tag: <input>
  CSS class: colombia-cedula-de-ciudadania-input
  Keyboard: Tab to focus, standard input keyboard interactions
  Accessibility: Implicit input role, aria-label for accessible name
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<input
  class="colombia-cedula-de-ciudadania-input"
  type="text"
  aria-label="Cedula de Ciudadania Number"
  autocomplete="off"
  spellcheck="false"
/>
