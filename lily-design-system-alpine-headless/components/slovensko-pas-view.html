<!-- slovensko-pas-view.html -->
<!-- SlovenskoPasView component (Alpine.js) -->
<!--
  Description: a read-only display of Slovakia's Pas
  HTML tag: <span>
  CSS class: slovensko-pas-view
  Keyboard: None (passive element)
  Accessibility: aria-label for accessible name
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<span
  class="slovensko-pas-view"
  aria-label="Slovak Passport"
></span>
