<!-- romania-cod-numeric-personal-view.html -->
<!-- RomaniaCodNumericPersonalView component (Alpine.js) -->
<!--
  Description: a read-only display of Romania's Cod Numeric Personal (CNP)
  HTML tag: <span>
  CSS class: romania-cod-numeric-personal-view
  Keyboard: None (passive element)
  Accessibility: a visible caption names the value, or the screen-reader-span does. A plain span cannot take aria-label
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<span class="romania-cod-numeric-personal-view"
  ><span class="screen-reader-span">Personal Numerical Code </span></span
>
