<!-- AustraliaIndividualHealthcareIdentifierView component (Alpine.js) -->
<!--
  Description: a read-only display of Australia's Individual Healthcare Identifier (IHI)
  HTML tag: <span>
  CSS class: australia-individual-healthcare-identifier-view
  Keyboard: None (passive element)
  Accessibility: a visible caption names the value, or the screen-reader-span does. A plain span cannot take aria-label
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<span class="australia-individual-healthcare-identifier-view"
  ><span class="screen-reader-span">Individual Healthcare Identifier </span></span
>
