<!-- visible.html -->
<!-- Visible component (Alpine.js) -->
<!--
  Description: an IntersectionObserver wrapper that exposes element visibility state
  HTML tag: <div>
  CSS class: visible
  Keyboard: None (passive element)
  Accessibility: none of its own: a <div> cannot take a name
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<div
  class="visible"
  data-visible="false"
>
  <!-- Consumer provides content -->
</div>
