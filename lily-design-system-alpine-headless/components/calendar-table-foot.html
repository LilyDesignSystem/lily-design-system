<!-- calendar-table-foot.html -->
<!-- CalendarTableFoot component (Alpine.js) -->
<!--
  Description: a calendar table interactive grid tfoot for managing dates, days, etc. <tfoot>
  HTML tag: <tfoot wrapped in table>
  CSS class: calendar-table-foot
  Keyboard: none; not interactive, and any interactive children handle their own keys
  Accessibility: aria-label for accessible name
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<table>
  <tfoot
    class="calendar-table-foot"
    aria-label="Example"
  >
    <!-- Consumer provides child content -->
  </tfoot>
</table>
