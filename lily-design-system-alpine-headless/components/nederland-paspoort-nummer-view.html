<!-- NederlandPaspoortNummerView component (Alpine.js) -->
<!--
  Description: a read-only display of Netherlands's Paspoort Nummer
  HTML tag: <span>
  CSS class: nederland-paspoort-nummer-view
  Keyboard: None (passive element)
  Accessibility: aria-label for accessible name
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<span
  class="nederland-paspoort-nummer-view"
  aria-label="Dutch Passport Number"
></span>
