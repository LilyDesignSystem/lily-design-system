<!-- red-orange-yellow-green-blue-picker.html -->
<!-- RedOrangeYellowGreenBluePicker component (Alpine.js) -->
<!--
  Description: a picker for selecting a five-level color status
  HTML tag: <fieldset>
  CSS class: red-orange-yellow-green-blue-picker
  Keyboard: Tab focuses the selected radio; arrows move between radios; Space selects
  Accessibility: fieldset with role="radiogroup" and aria-label; native radios share a name; x-model keeps the chosen value in data-value
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<fieldset
  class="red-orange-yellow-green-blue-picker"
  role="radiogroup"
  aria-label=""
  x-data="{ value: '' }"
  :data-value="value"
>
  <label class="red-orange-yellow-green-blue-picker-button"
    ><input
      type="radio"
      name="status"
      value="red"
      aria-label="red"
      x-model="value"
    />
    red</label
  >
  <label class="red-orange-yellow-green-blue-picker-button"
    ><input
      type="radio"
      name="status"
      value="orange"
      aria-label="orange"
      x-model="value"
    />
    orange</label
  >
  <label class="red-orange-yellow-green-blue-picker-button"
    ><input
      type="radio"
      name="status"
      value="yellow"
      aria-label="yellow"
      x-model="value"
    />
    yellow</label
  >
  <label class="red-orange-yellow-green-blue-picker-button"
    ><input
      type="radio"
      name="status"
      value="green"
      aria-label="green"
      x-model="value"
    />
    green</label
  >
  <label class="red-orange-yellow-green-blue-picker-button"
    ><input
      type="radio"
      name="status"
      value="blue"
      aria-label="blue"
      x-model="value"
    />
    blue</label
  >
</fieldset>
