<!-- date-range.html -->
<!-- DateRange component (Alpine.js) -->
<!--
  Description: paired start and end date inputs
  HTML tag: <fieldset containing two input type="date">
  CSS class: date-range
  Keyboard: native date-input keys (Tab between the two, arrows within)
  Accessibility: aria-label on the fieldset (group name) and on each input
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<fieldset class="date-range" aria-label="Trip dates">
  <input class="date-input" type="date" aria-label="Departure" />
  <input class="date-input" type="date" aria-label="Return" />
</fieldset>
