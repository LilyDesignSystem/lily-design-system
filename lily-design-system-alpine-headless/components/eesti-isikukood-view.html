<!-- EestiIsikukoodView component (Alpine.js) -->
<!--
  Description: a read-only display of Estonia's Isikukood (IK)
  HTML tag: <span>
  CSS class: eesti-isikukood-view
  Keyboard: None (passive element)
  Accessibility: aria-label for accessible name
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<span
  class="eesti-isikukood-view"
  aria-label="Personal Identification Code"
></span>
