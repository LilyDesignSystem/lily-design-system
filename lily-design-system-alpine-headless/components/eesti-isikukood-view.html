<!-- EestiIsikukoodView component (Alpine.js) -->
<!--
  Description: a read-only display of Estonia's Isikukood (IK)
  HTML tag: <span>
  CSS class: eesti-isikukood-view
  Keyboard: None (passive element)
  Accessibility: a visible caption names the value, or the screen-reader-span does. A plain span cannot take aria-label
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<span class="eesti-isikukood-view"
  ><span class="screen-reader-span">Personal Identification Code </span></span
>
