<!-- slider.html -->
<!-- Slider component (Alpine.js) -->
<!--
  Description: a draggable control for selecting a value along a track
  HTML tag: <div>
  CSS class: slider
  Keyboard: native range: arrows change by a step, Home/End jump, Page Up/Down change by more
  Accessibility: native input type=range named by aria-label; x-model keeps the number in data-value
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<input class="slider" type="range" min="0" max="100" aria-label="" x-data="{ value: 50 }" x-model.number="value" :data-value="value">
