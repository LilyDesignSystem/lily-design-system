<!-- bharat-aadhaar-view.html -->
<!-- BharatAadhaarView component (Alpine.js) -->
<!--
  Description: a read-only display of India's Aadhaar number
  HTML tag: <span>
  CSS class: bharat-aadhaar-view
  Keyboard: None (passive element)
  Accessibility: aria-label for accessible name
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<span
  class="bharat-aadhaar-view"
  aria-label="Aadhaar (आधार)"
></span>
