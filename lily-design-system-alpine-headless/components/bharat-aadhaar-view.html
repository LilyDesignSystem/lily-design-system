<!-- bharat-aadhaar-view.html -->
<!-- BharatAadhaarView component (Alpine.js) -->
<!--
  Description: a read-only display of India's Aadhaar number
  HTML tag: <span>
  CSS class: bharat-aadhaar-view
  Keyboard: None (passive element)
  Accessibility: a visible caption names the value, or the screen-reader-span does. A plain span cannot take aria-label
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<span class="bharat-aadhaar-view"><span class="screen-reader-span">Aadhaar (आधार) </span></span>
