<!-- RossiyaSnilsInput component -->
<!--
  Description: an input for entering Russia's SNILS Individual Insurance Account Number
  HTML tag: <input>
  CSS class: rossiya-snils-input
  Keyboard: Tab to focus, standard input keyboard interactions
  Accessibility: Implicit input role, aria-label for accessible name
  Format: Eleven digits, NNN-NNN-NNN CC, a Modulus-101 check value over the first nine.
  Usage:
    <input class="rossiya-snils-input" type="text" aria-label="СНИЛС (Strakhovoy Nomer Individualnogo Litsevogo Scheta)" autocomplete="off">
-->

<input
  class="rossiya-snils-input"
  type="text"
  aria-label="СНИЛС (Strakhovoy Nomer Individualnogo Litsevogo Scheta)"
  autocomplete="off"
>
