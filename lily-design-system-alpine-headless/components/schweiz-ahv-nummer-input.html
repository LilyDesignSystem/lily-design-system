<!-- SchweizAhvNummerInput component (Alpine.js) -->
<!--
  Description: an input for entering Switzerland's AHV-Nummer / Numero AVS
  HTML tag: <input>
  CSS class: schweiz-ahv-nummer-input
  Keyboard: Tab to focus, standard input keyboard interactions
  Accessibility: Implicit input role, aria-label for accessible name
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<input
  class="schweiz-ahv-nummer-input"
  type="text"
  aria-label="AHV-Nummer / Numéro AVS"
  autocomplete="off"
>
