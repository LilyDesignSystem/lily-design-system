<!-- OsterreichSozialversicherungsnummerInput component (Alpine.js) -->
<!--
  Description: an input for entering Austria's Sozialversicherungsnummer (SVNR)
  HTML tag: <input>
  CSS class: osterreich-sozialversicherungsnummer-input
  Keyboard: Tab to focus, standard input keyboard interactions
  Accessibility: Implicit input role, aria-label for accessible name
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<input
  class="osterreich-sozialversicherungsnummer-input"
  type="text"
  aria-label="Sozialversicherungsnummer (SVNR)"
  autocomplete="off"
>
