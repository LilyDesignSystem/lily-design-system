<!-- error-summary.html -->
<!-- ErrorSummary component (Alpine.js) -->
<!--
  Description: a summary of all validation errors on a form
  HTML tag: <div>
  CSS class: error-summary
  Keyboard: None (passive element)
  Accessibility: aria-label for accessible name
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<div
  class="error-summary"
  role="alert"
  tabindex="-1"
  aria-labelledby="error-summary-title"
>
  <h2 id="error-summary-title"><!-- Consumer provides the title --></h2>
  <!-- Consumer provides the error list -->
</div>
