<!-- BrasilCartaoNacionalDeSaudeView component (Alpine.js) -->
<!--
  Description: a read-only display of Brazil's Cartao Nacional de Saude (CNS)
  HTML tag: <span>
  CSS class: brasil-cartao-nacional-de-saude-view
  Keyboard: None (passive element)
  Accessibility: a visible caption names the value, or the screen-reader-span does. A plain span cannot take aria-label
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<span class="brasil-cartao-nacional-de-saude-view"
  ><span class="screen-reader-span">Cartão Nacional de Saúde (CNS) </span></span
>
