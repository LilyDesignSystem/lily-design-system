<!-- BrasilCartaoNacionalDeSaudeView component (Alpine.js) -->
<!--
  Description: a read-only display of Brazil's Cartao Nacional de Saude (CNS)
  HTML tag: <span>
  CSS class: brasil-cartao-nacional-de-saude-view
  Keyboard: None (passive element)
  Accessibility: aria-label for accessible name
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<span
  class="brasil-cartao-nacional-de-saude-view"
  aria-label="Cartão Nacional de Saúde (CNS)"
></span>
