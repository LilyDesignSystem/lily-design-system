<!-- TuaisceartEireannHealthAndCareNumberInput component (Alpine.js) -->
<!--
  Description: an input for entering Tuaisceart Eireann Health and Care (H&C) Number unique national healthcare identifier
  HTML tag: <input>
  CSS class: tuaisceart-eireann-health-and-care-number-input
  Keyboard: Standard text input
  Accessibility: aria-label, inputmode="numeric", pattern="[0-9]{3} [0-9]{3} [0-9]{4}", autocomplete="off"
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<input
  class="tuaisceart-eireann-health-and-care-number-input"
  type="text"
  aria-label=""
  inputmode="numeric"
  pattern="[0-9]{3} [0-9]{3} [0-9]{4}"
  autocomplete="off"
>
