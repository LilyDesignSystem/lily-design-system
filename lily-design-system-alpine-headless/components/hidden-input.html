<!-- hidden-input.html -->
<!-- HiddenInput component (Alpine.js) -->
<!--
  Description: a hidden input for including data in form submission <input type="hidden">
  HTML tag: <input>
  CSS class: hidden-input
  Keyboard: native <input> behaviour only; no script is shipped
  Accessibility: none; a hidden input is not perceivable, so it takes no label. The consumer sets name and value.
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<input
  class="hidden-input"
  type="hidden"
  name=""
  value=""
/>
