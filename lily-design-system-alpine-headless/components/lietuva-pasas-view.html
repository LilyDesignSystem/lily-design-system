<!-- LietuvaPasasView component (Alpine.js) -->
<!--
  Description: a read-only display of Lithuania's Pasas
  HTML tag: <span>
  CSS class: lietuva-pasas-view
  Keyboard: None (passive element)
  Accessibility: a visible caption names the value, or the screen-reader-span does. A plain span cannot take aria-label
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<span class="lietuva-pasas-view"><span class="screen-reader-span">Lithuanian Passport </span></span>
