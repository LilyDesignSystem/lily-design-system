<!-- code-block.html -->
<!-- CodeBlock component (Alpine.js) -->
<!--
  Description: a block of formatted code with optional line numbers and line highlighting
  HTML tag: <pre>
  CSS class: code-block
  Keyboard: None (passive element)
  Accessibility: role="region" and aria-label when labelled
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<pre
  class="code-block"
  role="region"
  aria-label="Example"
>
<code><!-- Consumer provides code --></code>
</pre>
