<!-- calendar-day-table.html -->
<!-- CalendarDayTable component (Alpine.js) -->
<!--
  Description: a calendar grid showing the time slots of one day
  HTML tag: <table role="grid">
  CSS class: calendar-day-table
  Keyboard: arrows, Home, End, Ctrl+Home, Ctrl+End, PageUp and PageDown move between cells; one tab stop; Enter or F2 goes to the first control in a cell and Escape comes back
  Accessibility: role="grid" with required aria-label; set data-consumer-keys on the root to run your own keys
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<table
  class="calendar-day-table"
  role="grid"
  aria-label="Monday 6 January 2025"
  data-view="day"
  x-lily-grid
>
  <caption>
    Visible caption (optional)
  </caption>
  <!-- Consumer provides thead, tbody, tfoot: reuse the calendar-table-* sub-elements
       (calendar-table-head, calendar-table-body, calendar-table-foot, calendar-table-row,
       calendar-table-th, calendar-table-td). There are no calendar-day-table-* sub-elements. -->
  <tbody class="calendar-table-body">
    <tr class="calendar-table-row">
      <td class="calendar-table-td">1</td>
    </tr>
  </tbody>
</table>
