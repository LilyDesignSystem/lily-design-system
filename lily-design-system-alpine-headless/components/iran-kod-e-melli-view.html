<!-- iran-kod-e-melli-view.html -->
<!-- IranKodEMelliView component (Alpine.js) -->
<!--
  Description: a read-only display of Iran's National Code (Kod-e Melli)
  HTML tag: <span>
  CSS class: iran-kod-e-melli-view
  Keyboard: None (passive element)
  Accessibility: a visible caption names the value, or the screen-reader-span does. A plain span cannot take aria-label
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<span class="iran-kod-e-melli-view"
  ><span class="screen-reader-span">National Code (Kod-e Melli) </span></span
>
