<!-- nihon-kojin-bango-input.html -->
<!-- NihonKojinBangoInput component (Alpine.js) -->
<!--
  Description: an input for entering Japan's Individual Number (My Number)
  HTML tag: <input>
  CSS class: nihon-kojin-bango-input
  Keyboard: Tab to focus, standard input keyboard interactions
  Accessibility: Implicit input role, aria-label for accessible name
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<input
  class="nihon-kojin-bango-input"
  type="text"
  aria-label="Individual Number / My Number (マイナンバー)"
  autocomplete="off"
>
