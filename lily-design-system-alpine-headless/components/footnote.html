<!-- footnote.html -->
<!-- Footnote component (Alpine.js) -->
<!--
  Description: a footnote reference and content element
  HTML tag: <span>
  CSS class: footnote
  Keyboard: None (passive element)
  Accessibility: role="note" + aria-label; id used for in-page linking
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<span
  class="footnote"
  id=""
  role="note"
>
  <!-- Consumer provides footnote content -->
</span>
