<!-- PolskaPeselView component (Alpine.js) -->
<!--
  Description: a read-only display of Poland's PESEL
  HTML tag: <span>
  CSS class: polska-pesel-view
  Keyboard: None (passive element)
  Accessibility: aria-label for accessible name
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<span
  class="polska-pesel-view"
  aria-label="PESEL"
></span>
