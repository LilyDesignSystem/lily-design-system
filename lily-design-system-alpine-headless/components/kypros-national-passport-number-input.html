<!-- kypros-national-passport-number-input.html -->
<!-- KyprosNationalPassportNumberInput component (Alpine.js) -->
<!--
  Description: an input for entering Kypros's National Passport Number
  HTML tag: <input>
  CSS class: kypros-national-passport-number-input
  Keyboard: Tab to focus, standard input keyboard interactions
  Accessibility: Implicit input role, aria-label for accessible name
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<input
  class="kypros-national-passport-number-input"
  type="text"
  aria-label="National Passport Number"
  autocomplete="off"
>
