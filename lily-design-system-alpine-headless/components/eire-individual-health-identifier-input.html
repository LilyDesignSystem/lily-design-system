<!-- eire-individual-health-identifier-input.html -->
<!-- EireIndividualHealthIdentifierInput component (Alpine.js) -->
<!--
  Description: an input for entering Eire Individual Health Identifier (IHI) unique national healthcare identifier
  HTML tag: <input>
  CSS class: eire-individual-health-identifier-input
  Keyboard: Standard text input
  Accessibility: aria-label, inputmode="numeric", pattern="[0-9]{10}", autocomplete="off"
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<input
  class="eire-individual-health-identifier-input"
  type="text"
  aria-label=""
  inputmode="numeric"
  pattern="[0-9]{10}"
  autocomplete="off"
>
