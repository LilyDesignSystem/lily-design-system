<!-- review-date.html -->
<!-- ReviewDate component (Alpine.js) -->
<!--
  Description: a display of a content review date
  HTML tag: <time>
  CSS class: review-date
  Keyboard: None (passive element)
  Accessibility: aria-label gives context; datetime is the ISO 8601 machine-readable date
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<time
  class="review-date"
  datetime="2026-10-06"
  ><span class="screen-reader-span">Last reviewed </span>6 October 2026</time
>
