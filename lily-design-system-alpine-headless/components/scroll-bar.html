<!-- scroll-bar.html -->
<!-- ScrollBar component (Alpine.js) -->
<!--
  Description: a custom scrollbar element
  HTML tag: <div>
  CSS class: scroll-bar
  Keyboard: Up/Left lower and Down/Right raise by one step, Page Up/Down move ten steps, Home and End jump to the bounds
  Accessibility: role="scrollbar" with aria-label, aria-orientation, aria-controls (the scrolled element), aria-valuenow/min/max; tabindex 0
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<div
  class="scroll-bar"
  aria-label=""
  aria-orientation="vertical"
  x-data="lilyScrollBar(50, 0, 100, 1, 10)"
  x-bind="bar"
>
  <!-- Consumer provides the thumb; it scrolls its content on lily:change -->
</div>
