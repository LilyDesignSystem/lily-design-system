<!-- kypros-national-passport-number-view.html -->
<!-- KyprosNationalPassportNumberView component (Alpine.js) -->
<!--
  Description: a read-only display of Kypros's National Passport Number
  HTML tag: <span>
  CSS class: kypros-national-passport-number-view
  Keyboard: None (passive element)
  Accessibility: aria-label for accessible name
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<span
  class="kypros-national-passport-number-view"
  aria-label="National Passport Number"
></span>
