<!-- sheet.html -->
<!-- Sheet component (Alpine.js) -->
<!--
  Description: a panel that slides in from a screen edge as an overlay
  HTML tag: <dialog>
  CSS class: sheet
  Keyboard: focus moves in on open; Tab stays inside (showModal()); Escape or the native cancel event closes and returns focus to the trigger
  Accessibility: native <dialog> opened with showModal() (open-attribute fallback where it is missing); aria-label names it; aria-modal="true" (true: the page behind is inert); tabindex -1 so it can take focus; data-side is for consumer CSS
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<div x-data="lilyModalSurface(false)">
  <button
    class="sheet-trigger"
    x-bind="trigger"
    aria-controls="sheet-1"
  >
    <!-- Consumer provides trigger label -->
  </button>
  <dialog
    class="sheet"
    id="sheet-1"
    aria-label=""
    tabindex="-1"
    data-side="bottom"
    x-bind="surface"
  >
    <!-- Consumer provides content -->
    <button
      class="sheet-close"
      x-bind="closer"
    >
      <!-- Consumer provides close label -->
    </button>
  </dialog>
</div>
