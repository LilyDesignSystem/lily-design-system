<!-- sheet.html -->
<!-- Sheet component (Alpine.js) -->
<!--
  Description: a panel that slides in from a screen edge as an overlay
  HTML tag: <div>
  CSS class: sheet
  Keyboard: Escape closes and returns focus to the trigger; focus moves in on open
  Accessibility: role="dialog" with aria-label, aria-modal="true"; tabindex -1 so it can take focus; data-side is for consumer CSS
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<div x-data="lilyOverlay(false)">
  <button class="sheet-trigger" x-bind="trigger" aria-controls="sheet-1"><!-- Consumer provides trigger label --></button>
  <div class="sheet" id="sheet-1" role="dialog" aria-modal="true" aria-label="" tabindex="-1" data-side="bottom" x-bind="surface">
    <!-- Consumer provides content -->
    <button class="sheet-close" x-bind="closer"><!-- Consumer provides close label --></button>
  </div>
</div>
