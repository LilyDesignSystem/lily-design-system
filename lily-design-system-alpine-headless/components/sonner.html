<!-- Sonner component (Alpine.js) -->
<!--
  Description: a toast notification manager
  HTML tag: <div>
  CSS class: sonner
  Keyboard: none: a live region
  Accessibility: role="region" with aria-label and aria-live="polite"; the consumer provides the toasts and owns their lifecycle
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<div class="sonner" role="region" aria-live="polite" aria-label="">
  <!-- Consumer provides the toast elements -->
</div>
