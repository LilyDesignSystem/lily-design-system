<!-- SuperBanner component (Alpine.js) -->
<!--
  Description: a super-banner communicates a high-priority state that affects an entire app, experience, process, or system
  HTML tag: <div>
  CSS class: super-banner
  Keyboard: None (passive element)
  Accessibility: role="alert", aria-label for accessible name
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<div
  class="super-banner"
  role="alert"
  aria-label=""
  aria-live="assertive"
>
  <!-- Consumer provides content -->
</div>
