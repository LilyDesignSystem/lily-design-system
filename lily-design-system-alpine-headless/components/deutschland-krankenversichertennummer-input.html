<!-- DeutschlandKrankenversichertennummerInput component (Alpine.js) -->
<!--
  Description: an input for entering Germany's Krankenversichertennummer (KVNR)
  HTML tag: <input>
  CSS class: deutschland-krankenversichertennummer-input
  Keyboard: Tab to focus, standard input keyboard interactions
  Accessibility: Implicit input role, aria-label for accessible name
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<input
  class="deutschland-krankenversichertennummer-input"
  type="text"
  aria-label="Health Insurance Number"
  autocomplete="off"
>
