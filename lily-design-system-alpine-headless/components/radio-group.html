<!-- radio-group.html -->
<!-- RadioGroup component (Alpine.js) -->
<!--
  Description: a group of radio buttons for selecting one option
  HTML tag: <fieldset>
  CSS class: radio-group
  Keyboard: None (passive element)
  Accessibility: role="radiogroup", aria-label for accessible name
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<fieldset
  class="radio-group"
  role="radiogroup"
  aria-label=""
>
  <!-- Consumer provides content -->
</fieldset>
