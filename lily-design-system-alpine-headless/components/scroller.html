<!-- scroller.html -->
<!-- Scroller component (Alpine.js) -->
<!--
  Description: a scrollytelling container with step-based foreground and background composition
  HTML tag: <div>
  CSS class: scroller
  Keyboard: None (passive element)
  Accessibility: role="group" with aria-label; drop both when the content needs no name
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<div
  class="scroller"
  role="group"
  aria-label=""
  data-offset="0.5"
>
  <div
    class="scroller-background"
    aria-live="polite"
  >
    <!-- Consumer provides sticky background -->
  </div>
  <div
    class="scroller-foreground scroller-base"
    data-offset="0.5"
  >
    <!-- Consumer provides step children -->
  </div>
</div>
