<!-- HrvatskaOsobniIdentifikacijskiBrojView component (Alpine.js) -->

  HTML tag: <span>
  CSS class: hrvatska-osobni-identifikacijski-broj-view
  Keyboard: None (passive element)

  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

  ><span class="screen-reader-span">Personal Identification Number </span></span
