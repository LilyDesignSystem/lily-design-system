<!-- HrvatskaOsobniIdentifikacijskiBrojView component (Alpine.js) -->
<!--
  Description: a read-only display of Croatia's Osobni identifikacijski broj (OIB)
  HTML tag: <span>
  CSS class: hrvatska-osobni-identifikacijski-broj-view
  Keyboard: None (passive element)
  Accessibility: aria-label for accessible name
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<span
  class="hrvatska-osobni-identifikacijski-broj-view"
  aria-label="Personal Identification Number"
></span>
