<!-- CeskoCestovniPasView component (Alpine.js) -->
<!--
  Description: a read-only display of Czech Republic's Cestovní pas
  HTML tag: <span>
  CSS class: cesko-cestovni-pas-view
  Keyboard: None (passive element)
  Accessibility: a visible caption names the value, or the screen-reader-span does. A plain span cannot take aria-label
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<span class="cesko-cestovni-pas-view"><span class="screen-reader-span">Czech Passport </span></span>
