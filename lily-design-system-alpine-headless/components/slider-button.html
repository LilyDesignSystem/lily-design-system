<!-- slider-button.html -->
<!-- SliderButton component (Alpine.js) -->
<!--
  Description: a button with a slider that the user needs to slide to confirm
  HTML tag: <button>
  CSS class: slider-button
  Keyboard: Tab to focus, Enter/Space to activate
  Accessibility: role="slider", aria-label for accessible name
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<button
  class="slider-button"
  role="slider"
  aria-label=""
  type="button"
  aria-valuemin="0"
  aria-valuemax="100"
  aria-valuenow="0"
>
  <!-- Consumer provides content -->
</button>
