<!-- AccordionList component (Alpine.js) -->
<!--
  Description: an accordion ordered list of list item components
  HTML tag: <div  (not ol, because details is not valid inside ol/ul)>
  CSS class: accordion-list
  Keyboard: None (passive element)
  Accessibility: role="group" + aria-label
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<div class="accordion-list" role="group" aria-label="">
    <!-- Consumer provides accordion list items -->
</div>
