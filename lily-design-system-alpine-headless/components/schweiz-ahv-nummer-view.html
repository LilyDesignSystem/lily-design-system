<!-- SchweizAhvNummerView component (Alpine.js) -->
<!--
  Description: a read-only display of Switzerland's AHV-Nummer / Numero AVS
  HTML tag: <span>
  CSS class: schweiz-ahv-nummer-view
  Keyboard: None (passive element)
  Accessibility: aria-label for accessible name
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<span
  class="schweiz-ahv-nummer-view"
  aria-label="AHV-Nummer / Numéro AVS"
></span>
