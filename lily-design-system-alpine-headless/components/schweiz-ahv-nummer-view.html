<!-- schweiz-ahv-nummer-view.html -->
<!-- SchweizAhvNummerView component (Alpine.js) -->
<!--
  Description: a read-only display of Switzerland's AHV-Nummer / Numero AVS
  HTML tag: <span>
  CSS class: schweiz-ahv-nummer-view
  Keyboard: None (passive element)
  Accessibility: a visible caption names the value, or the screen-reader-span does. A plain span cannot take aria-label
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<span class="schweiz-ahv-nummer-view"
  ><span class="screen-reader-span">AHV-Nummer / Numéro AVS </span></span
>
