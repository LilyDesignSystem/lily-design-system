<!-- bharat-aadhaar-input.html -->
<!-- BharatAadhaarInput component (Alpine.js) -->
<!--
  Description: an input for entering India's Aadhaar number
  HTML tag: <input>
  CSS class: bharat-aadhaar-input
  Keyboard: Tab to focus, standard input keyboard interactions
  Accessibility: Implicit input role, aria-label for accessible name
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<input
  class="bharat-aadhaar-input"
  type="text"
  aria-label="Aadhaar (आधार)"
  autocomplete="off"
>
