<!-- EcuadorCedulaDeIdentidadView component (Alpine.js) -->
<!--
  Description: a read-only display of Ecuador's Cedula de Identidad Number
  HTML tag: <span>
  CSS class: ecuador-cedula-de-identidad-view
  Keyboard: None (passive element)
  Accessibility: aria-label for accessible name
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<span
  class="ecuador-cedula-de-identidad-view"
  aria-label="Cedula de Identidad Number"
></span>
