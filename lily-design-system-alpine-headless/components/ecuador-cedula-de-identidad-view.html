<!-- EcuadorCedulaDeIdentidadView component (Alpine.js) -->
<!--
  Description: a read-only display of Ecuador's Cedula de Identidad Number
  HTML tag: <span>
  CSS class: ecuador-cedula-de-identidad-view
  Keyboard: None (passive element)
  Accessibility: a visible caption names the value, or the screen-reader-span does. A plain span cannot take aria-label
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<span class="ecuador-cedula-de-identidad-view"
  ><span class="screen-reader-span">Cedula de Identidad Number </span></span
>
