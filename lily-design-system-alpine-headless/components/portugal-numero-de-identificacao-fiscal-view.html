<!-- PortugalNumeroDeIdentificacaoFiscalView component (Alpine.js) -->
<!--
  Description: a read-only display of Portugal's Número de Identificação Fiscal (NIF)
  HTML tag: <span>
  CSS class: portugal-numero-de-identificacao-fiscal-view
  Keyboard: None (passive element)
  Accessibility: a visible caption names the value, or the screen-reader-span does. A plain span cannot take aria-label
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<span class="portugal-numero-de-identificacao-fiscal-view"
  ><span class="screen-reader-span">Tax Identification Number </span></span
>
