<!-- editable.html -->
<!-- Editable component (Alpine.js) -->
<!--
  Description: an inline-editable text element that toggles between view and edit modes
  HTML tag: <div>
  CSS class: editable
  Keyboard: Enter, Space (the button's own keys) or a click edits; Enter confirms; Escape cancels
  Accessibility: the display is a native button named "value, label", disabled when the editable is; the field is named by the label
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<div
  class="editable"
  x-data="lilyEditable('', false, '')"
>
  <button
    class="editable-button"
    x-bind="display"
  ></button>
  <input
    class="editable-input"
    x-bind="input"
    hidden
  />
</div>
