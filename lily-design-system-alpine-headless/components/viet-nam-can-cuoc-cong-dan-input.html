<!-- VietNamCanCuocCongDanInput component (Alpine.js) -->
<!--
  Description: an input for entering Viet Nam's Citizen Identification Number (CCCD)
  HTML tag: <input>
  CSS class: viet-nam-can-cuoc-cong-dan-input
  Keyboard: Tab to focus, standard input keyboard interactions
  Accessibility: Implicit input role, aria-label for accessible name
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<input
  class="viet-nam-can-cuoc-cong-dan-input"
  type="text"
  aria-label="Citizen Identification Number (CCCD)"
  autocomplete="off"
  spellcheck="false"
/>
