<!-- CanadaSocialInsuranceNumberView component (Alpine.js) -->
<!--
  Description: a read-only display of Canada's Social Insurance Number (SIN)
  HTML tag: <span>
  CSS class: canada-social-insurance-number-view
  Keyboard: None (passive element)
  Accessibility: a visible caption names the value, or the screen-reader-span does. A plain span cannot take aria-label
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<span class="canada-social-insurance-number-view"
  ><span class="screen-reader-span">Social Insurance Number (SIN) </span></span
>
