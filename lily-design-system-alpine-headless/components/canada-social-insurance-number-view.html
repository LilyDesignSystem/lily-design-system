<!-- CanadaSocialInsuranceNumberView component (Alpine.js) -->
<!--
  Description: a read-only display of Canada's Social Insurance Number (SIN)
  HTML tag: <span>
  CSS class: canada-social-insurance-number-view
  Keyboard: None (passive element)
  Accessibility: aria-label for accessible name
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<span
  class="canada-social-insurance-number-view"
  aria-label="Social Insurance Number (SIN)"
></span>
