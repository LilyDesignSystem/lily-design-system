<!-- ToolCallOutput component (Alpine.js) -->

  Description: the output or result returned by a tool in a tool call
  HTML tag: <div>
  CSS class: tool-call-output
  Keyboard: none; not interactive, and any interactive children handle their own keys

  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

  class="tool-call-output"
  role="group"
  aria-label="Arguments"
>
  {"query": "weather"}
</div>
