<!-- information-callout.html -->
<!-- InformationCallout component (Alpine.js) -->
<!--
  Description: a callout box highlighting informational content
  HTML tag: <aside>
  CSS class: information-callout
  Keyboard: None (passive element)
  Accessibility: aria-label for accessible name
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<aside
  class="information-callout"
  role="note"
  aria-label=""
>
  <!-- Consumer provides content -->
</aside>
