<!-- LiechtensteinPassportNumberView component (Alpine.js) -->
<!--
  Description: a read-only display of Liechtenstein's Liechtenstein Passport Number
  HTML tag: <span>
  CSS class: liechtenstein-passport-number-view
  Keyboard: None (passive element)
  Accessibility: a visible caption names the value, or the screen-reader-span does. A plain span cannot take aria-label
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<span class="liechtenstein-passport-number-view"
  ><span class="screen-reader-span">Liechtenstein Passport Number </span></span
>
