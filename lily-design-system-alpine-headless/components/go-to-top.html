<!-- go-to-top.html -->
<!-- GoToTop component (Alpine.js) -->
<!--
  Description: a link that returns users to the top of a long page
  HTML tag: <a>
  CSS class: go-to-top
  Keyboard: native <a> behaviour only (Enter follows the link); no script is shipped
  Accessibility: aria-label
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<a
  class="go-to-top"
  aria-label=""
>
  <!-- Consumer provides content -->
</a>
