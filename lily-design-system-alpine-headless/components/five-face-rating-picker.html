<!-- five-face-rating-picker.html -->
<!-- FiveFaceRatingPicker component (Alpine.js) -->
<!--
  Description: a picker for selecting a 1-5 satisfaction rating using face labels
  HTML tag: <fieldset>
  CSS class: five-face-rating-picker
  Keyboard: Tab focuses the selected radio; arrows move between radios; Space selects
  Accessibility: fieldset with role="radiogroup" and aria-label; native radios share a name; x-model keeps the chosen value in data-value
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<fieldset class="five-face-rating-picker" role="radiogroup" aria-label="" x-data="{ value: '' }" :data-value="value">
  <label class="five-face-rating-picker-button"><input type="radio" name="satisfaction" value="1" aria-label="1" x-model="value"> 1</label>
  <label class="five-face-rating-picker-button"><input type="radio" name="satisfaction" value="2" aria-label="2" x-model="value"> 2</label>
  <label class="five-face-rating-picker-button"><input type="radio" name="satisfaction" value="3" aria-label="3" x-model="value"> 3</label>
  <label class="five-face-rating-picker-button"><input type="radio" name="satisfaction" value="4" aria-label="4" x-model="value"> 4</label>
  <label class="five-face-rating-picker-button"><input type="radio" name="satisfaction" value="5" aria-label="5" x-model="value"> 5</label>
</fieldset>
