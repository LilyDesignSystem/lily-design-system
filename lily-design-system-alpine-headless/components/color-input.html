<!-- color-input.html -->
<!-- ColorInput component (Alpine.js) -->
<!--
  Description: an input for selecting a color value <input type="color">
  HTML tag: <input>
  CSS class: color-input
  Keyboard: Tab to focus, standard input keyboard interactions
  Accessibility: Implicit input role, aria-label for accessible name
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<input
  class="color-input"
  type="color"
  aria-label=""
>
