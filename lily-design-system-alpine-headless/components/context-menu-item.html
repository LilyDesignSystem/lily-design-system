<!-- ContextMenuItem component (Alpine.js) -->
<!--
  Description: one item in a context menu
  HTML tag: <div>
  CSS class: context-menu-item
  Keyboard: None (passive element)
  Accessibility: role="menuitem", aria-label for accessible name
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<div
  class="context-menu-item"
  role="menuitem"
  aria-label=""
>
  <!-- Consumer provides content -->
</div>
