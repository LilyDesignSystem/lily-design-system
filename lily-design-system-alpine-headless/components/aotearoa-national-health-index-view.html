<!-- aotearoa-national-health-index-view.html -->
<!-- AotearoaNationalHealthIndexView component (Alpine.js) -->
<!--
  Description: a read-only display of New Zealand's National Health Index (NHI) Number
  HTML tag: <span>
  CSS class: aotearoa-national-health-index-view
  Keyboard: None (passive element)
  Accessibility: a visible caption names the value, or the screen-reader-span does. A plain span cannot take aria-label
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<span class="aotearoa-national-health-index-view"
  ><span class="screen-reader-span">National Health Index (NHI) Number </span></span
>
