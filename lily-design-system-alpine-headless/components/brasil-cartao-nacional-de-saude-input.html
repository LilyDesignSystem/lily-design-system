<!-- BrasilCartaoNacionalDeSaudeInput component (Alpine.js) -->
<!--
  Description: an input for entering Brazil's Cartao Nacional de Saude (CNS)
  HTML tag: <input>
  CSS class: brasil-cartao-nacional-de-saude-input
  Keyboard: Tab to focus, standard input keyboard interactions
  Accessibility: Implicit input role, aria-label for accessible name
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<input
  class="brasil-cartao-nacional-de-saude-input"
  type="text"
  aria-label="Cartão Nacional de Saúde (CNS)"
  autocomplete="off"
>
