<!-- Label component (Alpine.js) -->
<!--
  Description: a label associated with a form input
  HTML tag: <label>
  CSS class: label
  Keyboard: 
  Accessibility: aria-label for accessible name
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<label
  class="label"
  aria-label="Example"
>
  <!-- Consumer provides content -->
</label>
