<!-- hong-kong-identity-card-view.html -->
<!-- HongKongIdentityCardView component (Alpine.js) -->
<!--
  Description: a read-only display of Hong Kong's Identity Card Number
  HTML tag: <span>
  CSS class: hong-kong-identity-card-view
  Keyboard: None (passive element)
  Accessibility: aria-label for accessible name
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<span
  class="hong-kong-identity-card-view"
  aria-label="Hong Kong Identity Card Number"
></span>
