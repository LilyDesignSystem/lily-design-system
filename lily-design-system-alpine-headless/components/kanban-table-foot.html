<!-- KanbanTableFoot component (Alpine.js) -->
<!--
  Description: a kanban board table interactive grid tfoot for organizing items by status <tfoot>
  HTML tag: <tfoot wrapped in table>
  CSS class: kanban-table-foot
  Keyboard: none; not interactive, and any interactive children handle their own keys
  Accessibility: aria-label for accessible name
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<table>
  <tfoot
    class="kanban-table-foot"
    aria-label="Example"
  >
    <!-- Consumer provides child content -->
  </tfoot>
</table>
