<!-- range-fieldset.html -->
<!-- RangeFieldset component (Alpine.js) -->
<!--
  Description: a fieldset of two range inputs for a minimum and a maximum that cannot cross
  HTML tag: <fieldset>
  CSS class: range-fieldset
  Keyboard: native range keys on each thumb (arrows, Home, End, Page Up, Page Down); Tab moves from the lower to the upper; a thumb stops at the other
  Accessibility: the legend names the group; aria-label names each thumb; the native range inputs carry the slider role. Both share min, max and step; each value is its own form field and a native form reset puts both back (tasks.md P34-T1)
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<fieldset
  class="range-fieldset"
  x-data
>
  <legend class="range-fieldset-legend"></legend>
  <input
    class="range-fieldset-minimum"
    type="range"
    aria-label=""
    min="0"
    max="100"
    step="1"
    value="20"
    x-ref="minimum"
    @input="if (+$el.value > +$refs.maximum.value) $el.value = $refs.maximum.value"
  />
  <input
    class="range-fieldset-maximum"
    type="range"
    aria-label=""
    min="0"
    max="100"
    step="1"
    value="80"
    x-ref="maximum"
    @input="if (+$el.value < +$refs.minimum.value) $el.value = $refs.minimum.value"
  />
</fieldset>
