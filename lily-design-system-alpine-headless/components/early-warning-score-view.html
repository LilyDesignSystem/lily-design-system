<!-- early-warning-score-view.html -->
<!-- EarlyWarningScoreView component (Alpine.js) -->
<!--
  Description: a read-only display of an early warning score, with its band and escalation text
  HTML tag: <span>
  CSS class: early-warning-score-view
  Keyboard: 
  Accessibility: 
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<span
  class="early-warning-score-view"
  data-band="high"
  ><span class="early-warning-score-view-system">NEWS2</span>
  <span class="early-warning-score-view-score">7</span>
  <span class="early-warning-score-view-band">High</span>
  <span class="early-warning-score-view-escalation">Urgent response</span></span
>
