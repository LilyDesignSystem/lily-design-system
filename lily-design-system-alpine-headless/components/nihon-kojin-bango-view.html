<!-- nihon-kojin-bango-view.html -->
<!-- NihonKojinBangoView component (Alpine.js) -->
<!--
  Description: a read-only display of Japan's Individual Number (My Number)
  HTML tag: <span>
  CSS class: nihon-kojin-bango-view
  Keyboard: None (passive element)
  Accessibility: aria-label for accessible name
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<span
  class="nihon-kojin-bango-view"
  aria-label="Individual Number / My Number (マイナンバー)"
></span>
