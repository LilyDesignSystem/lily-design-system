<!-- nihon-kojin-bango-view.html -->
<!-- NihonKojinBangoView component (Alpine.js) -->
<!--
  Description: a read-only display of Japan's Individual Number (My Number)
  HTML tag: <span>
  CSS class: nihon-kojin-bango-view
  Keyboard: None (passive element)
  Accessibility: a visible caption names the value, or the screen-reader-span does. A plain span cannot take aria-label
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<span class="nihon-kojin-bango-view"
  ><span class="screen-reader-span">Individual Number / My Number (マイナンバー) </span></span
>
