<!-- UkrayinaReyestratsiyniyNomerOblikovoyiKartkyPlatnykaPodatkivInput component (Alpine.js) -->
<!--
  Description: an input for entering Ukraine's Taxpayer Registration Card Number (RNOKPP)
  HTML tag: <input>
  CSS class: ukrayina-reyestratsiyniy-nomer-oblikovoyi-kartky-platnyka-podatkiv-input
  Keyboard: Tab to focus, standard input keyboard interactions
  Accessibility: Implicit input role, aria-label for accessible name
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<input
  class="ukrayina-reyestratsiyniy-nomer-oblikovoyi-kartky-platnyka-podatkiv-input"
  type="text"
  aria-label="Реєстраційний номер облікової картки платника податків (РНОКПП)"
  autocomplete="off"
>
