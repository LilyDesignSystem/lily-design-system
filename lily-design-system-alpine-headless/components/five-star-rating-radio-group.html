<!-- FiveStarRatingRadioGroup component (Alpine.js) -->
<!--
  Description: a fieldset radio group for selecting a 1-5 star rating
  HTML tag: <fieldset>
  CSS class: five-star-rating-radio-group
  Keyboard: None (passive element)
  Accessibility: role="radiogroup", aria-label for accessible name

-->

<fieldset
  class="five-star-rating-radio-group"
  role="radiogroup"
  aria-label=""
>
  <!-- Consumer provides content -->
