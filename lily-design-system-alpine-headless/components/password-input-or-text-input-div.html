<!-- password-input-or-text-input-div.html -->
<!-- PasswordInputOrTextInputDiv component (Alpine.js) -->
<!--
  Description: an input for entering a password <input type="password"> or text <input type="text"> with show/hide toggle
  HTML tag: <div>
  CSS class: password-input-or-text-input-div
  Keyboard: Enter or Space on the toggle button shows or hides the password
  Accessibility: the toggle is a button with aria-pressed; aria-label names the input and the button; autocomplete=current-password
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<div class="password-input-or-text-input-div" x-data="lilyPasswordToggle()">
  <input class="password-input-or-text-input-div-input" type="password" aria-label="" x-bind="input">
  <button class="password-input-or-text-input-div-toggle" aria-label="" x-bind="toggle"><!-- Consumer provides toggle icon or text --></button>
</div>
