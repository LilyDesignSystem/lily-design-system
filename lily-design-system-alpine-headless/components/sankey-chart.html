<!-- sankey-chart.html -->
<!-- SankeyChart component (Alpine.js) -->
<!--
  Description: a flow chart where link width encodes the quantity moving between nodes
  HTML tag: <figure containing div class="sankey-chart-graphic" role="img">
  CSS class: sankey-chart
  Keyboard: None on the graphic; the data table follows native table behaviour
  Accessibility: the graphic wrapper carries role="img" and the required
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<figure class="sankey-chart">
  <!-- role="img" lives on the graphic wrapper, never on the figure: it makes
       its descendants presentational, so a data table inside it would be
       invisible to assistive technology. -->
  <div class="sankey-chart-graphic" role="img" aria-label="Example" aria-describedby="sankey-chart-desc">
    <!-- Consumer provides the inline svg; no drawing happens in this component. -->
    <svg data-testid="art" viewBox="0 0 10 10"><circle r="4" cx="5" cy="5"></circle></svg>
  </div>
  <!-- Optional accessible table alternative: a SIBLING of the graphic, outside role="img". -->
  <div class="sankey-chart-data-table">
    <table>
      <caption>Values</caption>
      <tbody><tr><th scope="row">A</th><td>1</td></tr></tbody>
    </table>
  </div>
</figure>
<!-- Optional short text description referenced by aria-describedby on the graphic -->
<p id="sankey-chart-desc">Example description</p>
