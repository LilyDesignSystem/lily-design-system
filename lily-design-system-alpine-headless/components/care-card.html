<!-- CareCard component (Alpine.js) -->
<!--
  Description: a medical care instruction card with urgency levels
  HTML tag: <div>
  CSS class: care-card
  Keyboard: None (passive element)
  Accessibility: role="region", aria-label for accessible name
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<div
  class="care-card"
  data-type="non-urgent"
  role="region"
  aria-label=""
>
  <!-- Consumer provides content -->
</div>
