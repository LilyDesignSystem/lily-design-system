<!-- EspanaTarjetaSanitariaIndividualView component (Alpine.js) -->
<!--
  Description: a read-only display of an España Tarjeta Sanitaria Individual (TSI) unique national healthcare identifier
  HTML tag: <span>
  CSS class: espana-tarjeta-sanitaria-individual-view
  Keyboard: None (passive element)
  Accessibility: aria-label for accessible name
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<span
  class="espana-tarjeta-sanitaria-individual-view"
  aria-label="TSI"
></span>
