<!-- EcuadorCedulaDeIdentidadInput component (Alpine.js) -->
<!--
  Description: an input for entering Ecuador's Cedula de Identidad Number
  HTML tag: <input>
  CSS class: ecuador-cedula-de-identidad-input
  Keyboard: Tab to focus, standard input keyboard interactions
  Accessibility: Implicit input role, aria-label for accessible name
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<input
  class="ecuador-cedula-de-identidad-input"
  type="text"
  aria-label="Cedula de Identidad Number"
  autocomplete="off"
/>
