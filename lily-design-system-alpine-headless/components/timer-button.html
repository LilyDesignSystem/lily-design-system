<!-- timer-button.html -->
<!-- TimerButton component (Alpine.js) -->
<!--
  Description: a button with a timer that will automatically click after a given amount of time
  HTML tag: <button>
  CSS class: timer-button
  Keyboard: Tab to focus, Enter/Space to activate
  Accessibility: aria-label for accessible name
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<button
  class="timer-button"
  aria-label=""
  type="button"
  data-remaining-seconds=""
>
  <!-- Consumer provides content -->
</button>
