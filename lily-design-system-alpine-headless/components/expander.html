<!-- expander.html -->
<!-- Expander component (Alpine.js) -->
<!--
  Description: a control that expands to reveal more content
  HTML tag: <div>
  CSS class: expander
  Keyboard: Tab to the trigger, Enter or Space to expand and collapse
  Accessibility: aria-expanded on the [data-trigger]; the [data-content] is hidden while collapsed
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<div class="expander" x-data="lilyCollapsible(false)" x-bind="root" role="group" aria-label="">
  <button data-trigger x-bind="trigger" aria-controls="expander-content-1"><!-- Consumer provides trigger label --></button>
  <div data-content id="expander-content-1" x-bind="content"><!-- Consumer provides content --></div>
</div>
