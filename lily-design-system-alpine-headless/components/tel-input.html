<!-- tel-input.html -->
<!-- TelInput component (Alpine.js) -->
<!--
  Description: an input for entering a telephone number <input type="tel">
  HTML tag: <input>
  CSS class: tel-input
  Keyboard: Tab to focus, standard input keyboard interactions
  Accessibility: Implicit input role, aria-label for accessible name
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<input
  class="tel-input"
  type="tel"
  aria-label=""
>
