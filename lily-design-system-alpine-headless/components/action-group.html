<!-- action-group.html -->
<!-- ActionGroup component (Alpine.js) -->
<!--
  Description: a group of action buttons that can collapse to an overflow menu when space is constrained
  HTML tag: <div>
  CSS class: action-group
  Keyboard: ArrowLeft/ArrowRight move between the actions (wrapping), Home/End jump; one tab stop; the overflow trigger behaves as a dropdown-menu trigger
  Accessibility: role="group" with aria-label; overflow trigger: aria-haspopup="menu", aria-expanded, aria-controls
  Popover API: the overflow menu is popover="auto" and the trigger names it with
    command="toggle-popover" commandfor (and popovertarget), so it opens, and
    closes on Escape and on a click outside, even before Alpine starts
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<div
  class="action-group"
  role="group"
  aria-label=""
  x-data="lilyDropdownMenu(false)"
  x-bind="root"
  x-lily-toolbar
>
  <button type="button"><!-- Consumer provides a visible action --></button>
  <button
    class="action-group-overflow-trigger"
    x-bind="trigger"
    aria-label=""
    aria-controls="action-group-overflow-1"
    command="toggle-popover"
    commandfor="action-group-overflow-1"
    popovertarget="action-group-overflow-1"
  >
    …
  </button>
  <div
    class="action-group-overflow-menu"
    id="action-group-overflow-1"
    aria-label=""
    popover="auto"
    x-bind="menu"
  >
    <button
      class="action-group-overflow-item"
      x-bind="item"
    >
      <!-- Consumer provides label -->
    </button>
    <button
      class="action-group-overflow-item"
      x-bind="item"
    >
      <!-- Consumer provides label -->
    </button>
  </div>
</div>
