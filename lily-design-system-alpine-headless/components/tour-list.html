<!-- tour-list.html -->
<!-- TourList component (Alpine.js) -->
<!--
  Description: an ordered list of tour guide steps
  HTML tag: <ol>
  CSS class: tour-list
  Keyboard: Escape closes the tour (sets active to false)
  Accessibility: an <ol> (a list, not a dialog) with aria-label; tabindex -1 so it can take focus; hidden while inactive
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<ol
  class="tour-list"
  aria-label=""
  x-data="lilyTourList(true)"
  x-bind="list"
>
  <!-- Consumer provides tour-list-item steps; it hears lily:close -->
</ol>
