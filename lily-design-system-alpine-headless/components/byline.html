<!-- byline.html -->
<!-- Byline component (Alpine.js) -->
<!--
  Description: an author attribution with publish and update timestamps
  HTML tag: <div>
  CSS class: byline
  Keyboard: None (passive element)
  Accessibility: none of its own; meaning comes from the content
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<div class="byline">
  <span class="byline-authors">
    <!-- Consumer provides authors -->
  </span>
  <span class="byline-published">
    <!-- Consumer provides <time datetime="..."> -->
  </span>
</div>
