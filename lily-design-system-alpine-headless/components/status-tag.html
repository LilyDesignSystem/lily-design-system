<!-- status-tag.html -->
<!-- StatusTag component (Alpine.js) -->
<!--
  Description: a tag showing the current status of a task
  HTML tag: <span>
  CSS class: status-tag
  Keyboard: none; not interactive, and any interactive children handle their own keys
  Accessibility: static, not a live region; hidden text in a screen-reader-span, because a span cannot take a name
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<span
  class="status-tag"
  data-type="default"
>
  <!-- Consumer provides content -->
</span>
