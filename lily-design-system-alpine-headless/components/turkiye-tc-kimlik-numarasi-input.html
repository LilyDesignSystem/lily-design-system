<!-- TurkiyeTcKimlikNumarasiInput component (Alpine.js) -->
<!--
  Description: an input for entering Turkey's T.C. Kimlik Numarasi
  HTML tag: <input>
  CSS class: turkiye-tc-kimlik-numarasi-input
  Keyboard: Tab to focus, standard input keyboard interactions
  Accessibility: Implicit input role, aria-label for accessible name
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<input
  class="turkiye-tc-kimlik-numarasi-input"
  type="text"
  aria-label="T.C. Kimlik Numarası"
  autocomplete="off"
>
