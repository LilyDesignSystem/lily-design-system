<!-- content-block.html -->
<!-- ContentBlock component (Alpine.js) -->
<!--
  Description: a content width constraint container with named column widths
  HTML tag: <div>
  CSS class: content-block
  Keyboard: None (passive element)
  Accessibility: none of its own; meaning comes from the content
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<div
  class="content-block"
  data-width="normal"
>
  <!-- Consumer provides content -->
</div>
