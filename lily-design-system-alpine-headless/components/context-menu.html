<!-- context-menu.html -->
<!-- ContextMenu component (Alpine.js) -->
<!--
  Description: a menu that appears on right-click or long-press
  HTML tag: <div>
  CSS class: context-menu
  Keyboard: Right click, ContextMenu key or Shift+F10 opens; arrows move; Escape closes
  Accessibility: role="menu" with aria-label; items: role="menuitem"; position is exposed as --context-menu-x / --context-menu-y
  Popover API: the menu is popover="auto"; opening shows it with showPopover(),
    in the top layer, and the browser closes it on Escape and on a click outside
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<div x-data="lilyContextMenu()">
  <div
    class="context-menu-target"
    tabindex="0"
    x-bind="target"
  >
    <!-- Consumer provides the region that owns the menu -->
  </div>
  <div
    class="context-menu"
    aria-label=""
    popover="auto"
    x-bind="menu"
  >
    <button
      class="context-menu-item"
      x-bind="item"
    >
      <!-- Consumer provides label -->
    </button>
    <button
      class="context-menu-item"
      x-bind="item"
    >
      <!-- Consumer provides label -->
    </button>
  </div>
</div>
