<!-- figure.html -->
<!-- Figure component (Alpine.js) -->
<!--
  Description: a self-contained figure with optional caption
  HTML tag: <figure>
  CSS class: figure
  Keyboard: None (passive element)
  Accessibility: aria-label for accessible name
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<figure
  class="figure"
  aria-label=""
>
  <!-- Consumer provides figure content and optional caption -->
</figure>
