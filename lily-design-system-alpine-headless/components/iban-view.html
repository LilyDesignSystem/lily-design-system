<!-- iban-view.html -->
<!-- IbanView component (Alpine.js) -->
<!--
  Description: a read-only display of an International Bank Account Number (IBAN)
  HTML tag: <span>
  CSS class: iban-view
  Keyboard: None (passive element)
  Accessibility: aria-label for accessible name
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<span
  class="iban-view"
  aria-label="IBAN"
></span>
