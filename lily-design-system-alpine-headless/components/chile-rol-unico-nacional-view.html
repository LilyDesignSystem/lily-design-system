<!-- ChileRolUnicoNacionalView component (Alpine.js) -->
<!--
  Description: a read-only display of Chile's Rol Unico Nacional (RUN)
  HTML tag: <span>
  CSS class: chile-rol-unico-nacional-view
  Keyboard: None (passive element)
  Accessibility: a visible caption names the value, or the screen-reader-span does. A plain span cannot take aria-label
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<span class="chile-rol-unico-nacional-view"
  ><span class="screen-reader-span">Rol Único Nacional (RUN) </span></span
>
