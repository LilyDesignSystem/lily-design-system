<!-- AvatarImage component (Alpine.js) -->
<!--
  Description: an avatar indicator inside image such as a user photo
  HTML tag: <img>
  CSS class: avatar-image
  Keyboard: None (passive element)
  Accessibility: none of its own
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<img
  class="avatar-image"
  src=""
  alt=""
  aria-hidden="true"
/>
