<!-- picture.html -->
<!-- Picture component (Alpine.js) -->
<!--
  Description: a responsive image wrapper that lets the browser choose among several sources, using the native picture element
  HTML tag: <picture>
  CSS class: picture
  Keyboard: 
  Accessibility: 
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<picture class="picture">
  <source
    srcset="wide.webp"
    media="(min-width: 800px)"
    type="image/webp"
  />
  <img
    src="small.jpg"
    alt="A lily in bloom"
    width="320"
    height="200"
  />
</picture>
