<!-- notification.html -->
<!-- Notification component (Alpine.js) -->
<!--
  Description: a brief message about an event or update
  HTML tag: <div>
  CSS class: notification
  Keyboard: None (passive element)
  Accessibility: role="status" with aria-live="polite" by default; role="alert" with assertive only when urgent
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<div
  class="notification"
  aria-live="polite"
  role="status"
  aria-label=""
>
  <!-- Consumer provides content -->
</div>
