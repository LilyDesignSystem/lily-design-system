<!-- mentions-input.html -->
<!-- MentionsInput component (Alpine.js) -->
<!--
  Description: a text input with at-mention autocomplete suggestions
  HTML tag: <div>
  CSS class: mentions-input
  Keyboard: type the trigger character to open; ArrowDown/ArrowUp move; Enter inserts; Escape closes
  Accessibility: the input is role="combobox" with aria-haspopup="listbox", aria-expanded, aria-autocomplete="list", aria-activedescendant; suggestions are a role="listbox" of role="option"
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<div class="mentions-input" data-trigger-char="@" x-data="lilyMentions('@')">
  <input class="mentions-input-control" type="text" aria-label="" aria-haspopup="listbox" aria-expanded="false" aria-autocomplete="list" aria-controls="mentions-input-suggestions-1" x-bind="input">
  <div class="mentions-input-suggestions" id="mentions-input-suggestions-1" role="listbox" aria-label="" hidden x-bind="panel">
    <div class="mentions-input-option" x-bind="option('mentions-input-option-1')"><!-- Consumer provides suggestion --></div>
    <div class="mentions-input-option" x-bind="option('mentions-input-option-2')"><!-- Consumer provides suggestion --></div>
    <div class="mentions-input-option" x-bind="option('mentions-input-option-3')"><!-- Consumer provides suggestion --></div>
  </div>
</div>
