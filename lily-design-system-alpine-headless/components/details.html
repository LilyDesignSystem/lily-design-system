<!-- details.html -->
<!-- Details component (Alpine.js) -->
<!--
  Description: a disclosure widget that shows and hides content
  HTML tag: <details>
  CSS class: details
  Keyboard: Tab to the summary, Enter or Space to open and close
  Accessibility: native disclosure semantics; no ARIA added
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<details class="details">
  <summary class="details-summary"><!-- Consumer provides summary --></summary>
  <!-- Consumer provides content -->
</details>
