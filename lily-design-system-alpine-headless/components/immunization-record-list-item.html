<!-- immunization-record-list-item.html -->
<!-- ImmunizationRecordListItem component (Alpine.js) -->
<!--
  Description: one immunization in an immunization record list, with vaccine, date, dose and status
  HTML tag: <li>
  CSS class: immunization-record-list-item
  Keyboard: 
  Accessibility: 
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<ul
  class="immunization-record-list"
  data-status="known"
  aria-label="Immunizations"
>
  <li
    class="immunization-record-list-item"
    data-status="completed"
  >
    <span class="immunization-record-list-item-vaccine">MMR vaccine</span>
    <time
      class="immunization-record-list-item-occurrence"
      datetime="2025-09-12"
      >12 Sep 2025</time
    >
    <span class="immunization-record-list-item-dose-number">Dose 2 of 2</span>
    <span class="immunization-record-list-item-status">Given</span>
    <span class="immunization-record-list-item-lot-number">AB1234</span>
  </li>
</ul>
