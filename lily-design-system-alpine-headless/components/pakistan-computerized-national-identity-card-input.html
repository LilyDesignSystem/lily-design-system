<!-- PakistanComputerizedNationalIdentityCardInput component (Alpine.js) -->
<!--
  Description: an input for entering Pakistan's Computerized National Identity Card Number (CNIC)
  HTML tag: <input>
  CSS class: pakistan-computerized-national-identity-card-input
  Keyboard: Tab to focus, standard input keyboard interactions
  Accessibility: Implicit input role, aria-label for accessible name
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<input
  class="pakistan-computerized-national-identity-card-input"
  type="text"
  aria-label="Computerized National Identity Card Number (CNIC)"
  autocomplete="off"
/>
