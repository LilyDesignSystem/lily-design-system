<!-- character-counter.html -->
<!-- CharacterCounter component (Alpine.js) -->
<!--
  Description: a counter showing remaining or used characters in a text field
  HTML tag: <span>
  CSS class: character-counter
  Keyboard: None (passive element)
  Accessibility: role="status" with aria-live="polite"; aria-label names what is counted; data-count, data-max, data-remaining, data-over-limit
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<input id="character-counter-field-1" type="text" aria-label="">
<span class="character-counter" aria-label="" x-data="lilyCharacterCounter(20, 'character-counter-field-1')" x-bind="counter"></span>
