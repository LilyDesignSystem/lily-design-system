<!-- character-counter.html -->
<!-- CharacterCounter component (Alpine.js) -->
<!--
  Description: a counter showing remaining or used characters in a text field
  HTML tag: <span>
  CSS class: character-counter
  Keyboard: None (passive element)
  Accessibility: the visible count is aria-hidden; a visually hidden role="status" (named by aria-label) takes it once typing pauses (announceDelay, default 1000 ms), so a run of keystrokes is announced once; data-count, data-max, data-remaining, data-over-limit on the root
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<input
  id="character-counter-field-1"
  type="text"
  aria-label=""
/>
<span
  class="character-counter"
  x-data="lilyCharacterCounter(20, 'character-counter-field-1')"
  x-bind="counter"
  ><span
    class="character-counter-text"
    x-bind="counterShown"
  ></span
  ><span
    class="character-counter-status screen-reader-span"
    aria-label=""
    x-bind="counterStatus"
  ></span
></span>
