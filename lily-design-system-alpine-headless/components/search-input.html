<!-- search-input.html -->
<!-- SearchInput component (Alpine.js) -->
<!--
  Description: an input for entering a search query <input type="search">
  HTML tag: <input>
  CSS class: search-input
  Keyboard: Tab to focus, standard input keyboard interactions
  Accessibility: the search input's implicit searchbox role, aria-label for accessible name
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<input
  class="search-input"
  type="search"
  aria-label=""
/>
