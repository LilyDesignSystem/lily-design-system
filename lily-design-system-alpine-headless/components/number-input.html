<!-- number-input.html -->
<!-- NumberInput component (Alpine.js) -->
<!--
  Description: an input for entering a numeric value with validation <input type="number">
  HTML tag: <input>
  CSS class: number-input
  Keyboard: Tab to focus, standard input keyboard interactions
  Accessibility: Implicit input role, aria-label for accessible name
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<input
  class="number-input"
  type="number"
  aria-label=""
>
