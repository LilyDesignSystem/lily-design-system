<!-- avatar-text.html -->
<!-- AvatarText component (Alpine.js) -->
<!--
  Description: an avatar indicator inner text such as a user name
  HTML tag: <span>
  CSS class: avatar-text
  Keyboard: None (passive element)
  Accessibility: none of its own; meaning comes from the content
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<span
  class="avatar-text"
  aria-hidden="true"
>
  <!-- Consumer provides content -->
</span>
