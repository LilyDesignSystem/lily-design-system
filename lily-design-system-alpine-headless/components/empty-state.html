<!-- empty-state.html -->
<!-- EmptyState component (Alpine.js) -->
<!--
  Description: a placeholder shown when a list, table, or view has nothing to display yet, with room for guidance and an action
  HTML tag: <div>
  CSS class: empty-state
  Keyboard: None (passive element); any action is a consumer-supplied button/link
  Accessibility: when a label is given, role="group" and aria-label name the region; without
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<div
  class="empty-state"
  role="group"
  aria-label="No results"
>
  <h2>Nothing here yet</h2>
  <p>Try a different search.</p>
  <button type="button">Clear filters</button>
</div>
