  Description: a kanban board table interactive grid tbody for organizing items by status <tbody>
  HTML tag: <tbody wrapped in table>
  CSS class: kanban-table-body
  Keyboard: none; not interactive, and any interactive children handle their own keys
  Accessibility: aria-label for accessible name

-->

  <tbody
    class="kanban-table-body"
    aria-label="Example"
  >
    <!-- Consumer provides child content -->
  </tbody>
