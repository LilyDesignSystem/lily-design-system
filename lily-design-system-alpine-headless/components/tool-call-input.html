<!-- ToolCallInput component (Alpine.js) -->
<!--
  Description: the input or arguments passed to a tool in a tool call
  HTML tag: <div>
  CSS class: tool-call-input
  Keyboard: none; not interactive, and any interactive children handle their own keys
  Accessibility: 
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<div
  class="tool-call-input"
  role="group"
  aria-label="Arguments"
>
  {"query": "weather"}
</div>
