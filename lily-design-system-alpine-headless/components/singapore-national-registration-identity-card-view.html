<!-- SingaporeNationalRegistrationIdentityCardView component (Alpine.js) -->
<!--
  Description: a read-only display of Singapore's National Registration Identity Card number (NRIC/FIN)
  HTML tag: <span>
  CSS class: singapore-national-registration-identity-card-view
  Keyboard: None (passive element)
  Accessibility: a visible caption names the value, or the screen-reader-span does. A plain span cannot take aria-label
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<span class="singapore-national-registration-identity-card-view"
  ><span class="screen-reader-span"
    >National Registration Identity Card Number / Foreign Identification Number (NRIC/FIN)
  </span></span
>
