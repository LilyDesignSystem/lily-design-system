<!-- EspanaCodigoDeIdentificacionFiscalView component (Alpine.js) -->
<!--
  Description: a read-only display of Spain's Código de Identificación Fiscal (CIF)
  HTML tag: <span>
  CSS class: espana-codigo-de-identificacion-fiscal-view
  Keyboard: None (passive element)
  Accessibility: a visible caption names the value, or the screen-reader-span does. A plain span cannot take aria-label
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<span class="espana-codigo-de-identificacion-fiscal-view"
  ><span class="screen-reader-span">Tax Identification Code </span></span
>
