<!-- NigeriaNationalIdentificationNumberInput component (Alpine.js) -->
<!--
  Description: an input for entering Nigeria's National Identification Number (NIN)
  HTML tag: <input>
  CSS class: nigeria-national-identification-number-input
  Keyboard: Tab to focus, standard input keyboard interactions
  Accessibility: Implicit input role, aria-label for accessible name
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<input
  class="nigeria-national-identification-number-input"
  type="text"
  aria-label="National Identification Number (NIN)"
  autocomplete="off"
/>
