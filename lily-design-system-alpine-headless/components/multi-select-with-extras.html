<!-- multi-select-with-extras.html -->
<!-- MultiSelectWithExtras component (Alpine.js) -->
<!--
  Description: a multiple-choice select with additional features like search, groups, or selected-value chips
  HTML tag: <div wrapping select multiple>
  CSS class: multi-select-with-extras
  Keyboard: native only (on the inner select)
  Accessibility: aria-label is on the inner <select>, not the wrapper div
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<div class="multi-select-with-extras">
  <span class="multi-select-with-extras-before">Choose toppings</span>
  <select multiple aria-label="Toppings" size="4">
    <option value="cheese">Cheese</option>
    <option value="olives">Olives</option>
    <option value="peppers">Peppers</option>
    <option value="mushrooms">Mushrooms</option>
  </select>
  <span class="multi-select-with-extras-after">Hold Ctrl or Cmd to select several</span>
</div>
