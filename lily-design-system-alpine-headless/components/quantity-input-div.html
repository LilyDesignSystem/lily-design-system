<!-- quantity-input-div.html -->
<!-- QuantityInputDiv component (Alpine.js) -->
<!--
  Description: a quantity entered as a number and a unit, each unit with its own limits
  HTML tag: <div role="group">
  CSS class: quantity-input-div
  Keyboard: Tab moves between the number and the unit; each is a native control
  Accessibility: 
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<div
  class="quantity-input-div"
  role="group"
  aria-label="Weight"
>
  <label for="weight-magnitude">Amount</label>
  <input
    class="quantity-input-div-magnitude"
    id="weight-magnitude"
    name="weight-magnitude"
    type="number"
    inputmode="decimal"
    min="0"
    max="300"
    step="0.1"
  />
  <label for="weight-unit">Unit</label>
  <select
    class="quantity-input-div-unit"
    id="weight-unit"
    name="weight-unit"
  >
    <option
      value="kg"
      data-min="0"
      data-max="300"
      data-step="0.1"
      selected
    >
      kilograms
    </option>
    <option
      value="[lb_av]"
      data-min="0"
      data-max="660"
      data-step="0.1"
    >
      pounds
    </option>
  </select>
</div>
