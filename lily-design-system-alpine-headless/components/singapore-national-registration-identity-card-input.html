<!-- SingaporeNationalRegistrationIdentityCardInput component (Alpine.js) -->
<!--
  Description: an input for entering Singapore's National Registration Identity Card number (NRIC/FIN)
  HTML tag: <input>
  CSS class: singapore-national-registration-identity-card-input
  Keyboard: Tab to focus, standard input keyboard interactions
  Accessibility: Implicit input role, aria-label for accessible name
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<input
  class="singapore-national-registration-identity-card-input"
  type="text"
  aria-label="National Registration Identity Card Number / Foreign Identification Number (NRIC/FIN)"
  autocomplete="off"
>
