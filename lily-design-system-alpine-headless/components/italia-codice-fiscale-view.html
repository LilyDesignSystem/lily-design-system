<!-- italia-codice-fiscale-view.html -->
<!-- ItaliaCodiceFiscaleView component (Alpine.js) -->
<!--
  Description: a read-only display of Italy's Codice fiscale (CF)
  HTML tag: <span>
  CSS class: italia-codice-fiscale-view
  Keyboard: None (passive element)
  Accessibility: a visible caption names the value, or the screen-reader-span does. A plain span cannot take aria-label
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<span class="italia-codice-fiscale-view"
  ><span class="screen-reader-span">Italian Fiscal Code </span></span
>
