<!-- do-list-item.html -->
<!-- DoListItem component (Alpine.js) -->
<!--
  Description: an encouraged-practice item in a do-list guideline list
  HTML tag: <li wrapped in ol>
  CSS class: do-list-item
  Keyboard: none; not interactive, and any interactive children handle their own keys
  Accessibility: aria-label for accessible name
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<ol>
  <li
    class="do-list-item"
    data-recommendation="do"
    aria-label="Example"
  >
    <!-- Consumer provides child content -->
  </li>
</ol>
