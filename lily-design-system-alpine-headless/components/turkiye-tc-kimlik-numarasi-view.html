<!-- TurkiyeTcKimlikNumarasiView component (Alpine.js) -->
<!--
  Description: a read-only display of Turkey's T.C. Kimlik Numarasi
  HTML tag: <span>
  CSS class: turkiye-tc-kimlik-numarasi-view
  Keyboard: None (passive element)
  Accessibility: a visible caption names the value, or the screen-reader-span does. A plain span cannot take aria-label
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<span class="turkiye-tc-kimlik-numarasi-view"
  ><span class="screen-reader-span">T.C. Kimlik Numarası </span></span
>
