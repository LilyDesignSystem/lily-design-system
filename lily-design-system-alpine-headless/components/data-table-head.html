<!-- data-table-head.html -->
<!-- DataTableHead component (Alpine.js) -->
<!--
  Description: a data table interactive grid thead for displaying and sorting tabular data <thead>
  HTML tag: <thead wrapped in table>
  CSS class: data-table-head
  Keyboard: none; not interactive, and any interactive children handle their own keys
  Accessibility: aria-label for accessible name
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<table>
  <thead
    class="data-table-head"
    aria-label="Example"
  >
    <!-- Consumer provides child content -->
  </thead>
</table>
