<!-- masonry.html -->
<!-- Masonry component (Alpine.js) -->
<!--
  Description: a masonry layout container for variable-height items
  HTML tag: <div>
  CSS class: masonry
  Keyboard: None (passive layout container)
  Accessibility: None — purely structural layout container
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<div
  class="masonry"
  data-columns="3"
  style="column-count: 3; column-gap: 1rem;"
>
  <!-- Consumer provides masonry items; each item should have break-inside: avoid -->
</div>
