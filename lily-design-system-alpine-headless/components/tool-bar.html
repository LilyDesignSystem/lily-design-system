<!-- tool-bar.html -->
<!-- ToolBar component (Alpine.js) -->
<!--
  Description: a horizontal bar of tool actions
  HTML tag: <div>
  CSS class: tool-bar
  Keyboard: ArrowRight/ArrowLeft move focus among the enabled buttons and wrap (swapped in right-to-left; ArrowDown/ArrowUp with aria-orientation="vertical"), Home/End jump; one tab stop, which follows focus
  Accessibility: role="toolbar" with aria-label
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<div
  class="tool-bar"
  aria-label=""
  x-data="lilyToolBar()"
  x-bind="bar"
>
  <!-- Consumer provides tool-bar-button buttons -->
</div>
