<!-- progress.html -->
<!-- Progress component (Alpine.js) -->
<!--
  Description: a horizontal progress bar showing completion
  HTML tag: <progress>
  CSS class: progress
  Keyboard: None (passive element)
  Accessibility: aria-label for accessible name
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<progress
  class="progress"
  aria-label=""
  max="100"
  value="0"
>
  <!-- Consumer provides fallback text -->
</progress>
