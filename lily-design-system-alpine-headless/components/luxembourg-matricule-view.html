<!-- LuxembourgMatriculeView component (Alpine.js) -->
<!--
  Description: a read-only display of Luxembourg's Numero d'Identification Nationale (Matricule)
  HTML tag: <span>
  CSS class: luxembourg-matricule-view
  Keyboard: None (passive element)
  Accessibility: aria-label for accessible name
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<span
  class="luxembourg-matricule-view"
  aria-label="Numéro d'Identification Nationale (Matricule)"
></span>
