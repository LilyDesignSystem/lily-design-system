<!-- emoji-character-picker.html -->
<!-- EmojiCharacterPicker component (Alpine.js) -->
<!--
  Description: a picker for browsing and selecting emoji characters
  HTML tag: <div>
  CSS class: emoji-character-picker
  Keyboard: None (passive element)
  Accessibility: role="group" with aria-label naming the emoji picker
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<div
  class="emoji-character-picker"
  role="group"
  aria-label=""
>
  <!-- Consumer provides the emoji buttons, one per character, and any category filtering -->
</div>
