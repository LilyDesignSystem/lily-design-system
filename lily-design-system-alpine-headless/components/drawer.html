<!-- drawer.html -->
<!-- Drawer component (Alpine.js) -->
<!--
  Description: a panel that slides in from the edge of the screen
  HTML tag: <div>
  CSS class: drawer
  Keyboard: Escape closes and returns focus to the trigger; focus moves in on open
  Accessibility: role="dialog" with aria-label, aria-modal="true"; tabindex -1 so it can take focus; data-side is for consumer CSS
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<div x-data="lilyOverlay(false)">
  <button class="drawer-trigger" x-bind="trigger" aria-controls="drawer-1"><!-- Consumer provides trigger label --></button>
  <div class="drawer" id="drawer-1" role="dialog" aria-modal="true" aria-label="" tabindex="-1" data-side="right" x-bind="surface">
    <!-- Consumer provides content -->
    <button class="drawer-close" x-bind="closer"><!-- Consumer provides close label --></button>
  </div>
</div>
