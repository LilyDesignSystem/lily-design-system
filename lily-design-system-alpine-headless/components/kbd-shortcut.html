<!-- kbd-shortcut.html -->
<!-- KbdShortcut component (Alpine.js) -->
<!--
  Description: a keyboard shortcut made of one or more key caps, for example Ctrl plus K
  HTML tag: <kbd containing one kbd class="kbd-shortcut-key" per key>
  CSS class: kbd-shortcut
  Keyboard: None (passive element)
  Accessibility: separators are aria-hidden so they are not read; an optional aria-label on the
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<kbd class="kbd-shortcut" aria-label="Control K"><kbd class="kbd-shortcut-key">Ctrl</kbd><span class="kbd-shortcut-separator" aria-hidden="true">+</span><kbd class="kbd-shortcut-key">K</kbd></kbd>
