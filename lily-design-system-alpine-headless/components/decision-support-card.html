<!-- decision-support-card.html -->
<!-- DecisionSupportCard component (Alpine.js) -->
<!--
  Description: a clinical decision support card with a summary, urgency indicator, source, suggestions and override reasons
  HTML tag: <div>
  CSS class: decision-support-card
  Keyboard: Tab through the source link, suggestions, links, the reason select and the dismiss button; Enter or Space
  Accessibility: 
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<div
  class="decision-support-card"
  role="group"
  aria-label="Penicillin allergy recorded"
  data-indicator="critical"
>
  <p class="decision-support-card-header">
    <span class="decision-support-card-indicator">Critical</span>
    <span class="decision-support-card-summary">Penicillin allergy recorded</span>
  </p>
  <div class="decision-support-card-detail"><p>Amoxicillin is a penicillin.</p></div>
  <p class="decision-support-card-source"><a href="#formulary">Local formulary</a></p>
  <div class="decision-support-card-suggestions">
    <button
      type="button"
      class="decision-support-card-suggestion"
      data-recommended="true"
    >
      Cancel amoxicillin
    </button>
  </div>
  <form class="decision-support-card-override">
    <label class="decision-support-card-override-label"
      >Reason for dismissing
      <select
        class="decision-support-card-override-reason"
        name="overrideReason"
        required
      >
        <option value="">Choose a reason</option>
        <option value="error">Allergy recorded in error</option>
      </select></label
    >
    <button
      type="submit"
      class="decision-support-card-dismiss"
    >
      Dismiss
    </button>
  </form>
</div>
