<!-- resizable.html -->
<!-- Resizable component (Alpine.js) -->
<!--
  Description: a container that the user can resize by dragging
  HTML tag: <div>
  CSS class: resizable
  Keyboard: None (passive element)
  Accessibility: role="region" with aria-label; tabindex 0; data-resize says which way the consumer's CSS lets it resize
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<div class="resizable" role="region" tabindex="0" aria-label="" data-resize="both">
  <!-- Consumer provides content -->
</div>
