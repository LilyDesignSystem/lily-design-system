<!-- OsterreichSozialversicherungsnummerView component (Alpine.js) -->
<!--
  Description: a read-only display of Austria's Sozialversicherungsnummer (SVNR)
  HTML tag: <span>
  CSS class: osterreich-sozialversicherungsnummer-view
  Keyboard: None (passive element)
  Accessibility: a visible caption names the value, or the screen-reader-span does. A plain span cannot take aria-label
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<span class="osterreich-sozialversicherungsnummer-view"
  ><span class="screen-reader-span">Sozialversicherungsnummer (SVNR) </span></span
>
