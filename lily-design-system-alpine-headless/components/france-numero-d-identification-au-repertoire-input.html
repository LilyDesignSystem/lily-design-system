<!-- FranceNumeroDIdentificationAuRepertoireInput component (Alpine.js) -->
<!--
  Description: an input for entering a France numéro d'identification au répertoire (NIR) unique national healthcare identifier
  HTML tag: <input>
  CSS class: france-numero-d-identification-au-repertoire-input
  Keyboard: Tab to focus, standard input keyboard interactions
  Accessibility: Implicit input role, aria-label for accessible name
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<input
  class="france-numero-d-identification-au-repertoire-input"
  type="text"
  aria-label=""
  inputmode="numeric"
  pattern="[0-9]{1} [0-9]{2} [0-9]{2} [0-9]{2} [0-9]{3} [0-9]{3} [0-9]{2}"
  autocomplete="off"
>
