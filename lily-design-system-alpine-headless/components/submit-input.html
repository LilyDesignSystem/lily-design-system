<!-- submit-input.html -->
<!-- SubmitInput component (Alpine.js) -->
<!--
  Description: a button input that submits a form <input type="submit">
  HTML tag: <input>
  CSS class: submit-input
  Keyboard: Tab to focus, standard input keyboard interactions
  Accessibility: Implicit input role, aria-label for accessible name
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<input
  class="submit-input"
  type="submit"
  aria-label=""
>
