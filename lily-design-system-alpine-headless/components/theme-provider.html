<!-- theme-provider.html -->
<!-- ThemeProvider component (Alpine.js) -->
<!--
  Description: a container that applies CSS custom properties from a theme object to its children
  HTML tag: <div>
  CSS class: theme-provider
  Keyboard: None (passive element)
  Accessibility: none of its own: a <div> cannot take a name
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<div
  class="theme-provider"
  data-theme="light"
  style="display: contents"
>
  <!-- Consumer provides content -->
</div>
