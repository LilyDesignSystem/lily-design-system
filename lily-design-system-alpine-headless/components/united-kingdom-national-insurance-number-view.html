<!-- UnitedKingdomNationalInsuranceNumberView component (Alpine.js) -->
<!--
  Description: a read-only display of United Kingdom's National Insurance Number (NINO)
  HTML tag: <span>
  CSS class: united-kingdom-national-insurance-number-view
  Keyboard: None (passive element)
  Accessibility: a visible caption names the value, or the screen-reader-span does. A plain span cannot take aria-label
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<span class="united-kingdom-national-insurance-number-view"
  ><span class="screen-reader-span">National Insurance Number </span></span
>
