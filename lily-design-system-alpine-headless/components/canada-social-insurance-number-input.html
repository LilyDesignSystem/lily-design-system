<!-- CanadaSocialInsuranceNumberInput component (Alpine.js) -->
<!--
  Description: an input for entering Canada's Social Insurance Number (SIN)
  HTML tag: <input>
  CSS class: canada-social-insurance-number-input
  Keyboard: Tab to focus, standard input keyboard interactions
  Accessibility: Implicit input role, aria-label for accessible name
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<input
  class="canada-social-insurance-number-input"
  type="text"
  aria-label="Social Insurance Number (SIN)"
  autocomplete="off"
>
