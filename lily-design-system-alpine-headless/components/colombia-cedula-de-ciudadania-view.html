<!-- ColombiaCedulaDeCiudadaniaView component (Alpine.js) -->
<!--
  Description: a read-only display of Colombia's Cedula de Ciudadania Number
  HTML tag: <span>
  CSS class: colombia-cedula-de-ciudadania-view
  Keyboard: None (passive element)
  Accessibility: aria-label for accessible name
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<span
  class="colombia-cedula-de-ciudadania-view"
  aria-label="Cedula de Ciudadania Number"
></span>
