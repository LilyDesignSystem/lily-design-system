<!-- iban-input.html -->
<!-- IbanInput component (Alpine.js) -->
<!--
  Description: an input for entering an International Bank Account Number (IBAN)
  HTML tag: <input>
  CSS class: iban-input
  Keyboard: Tab to focus, standard input keyboard interactions
  Accessibility: Implicit input role, aria-label for accessible name
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<input
  class="iban-input"
  type="text"
  aria-label="IBAN"
  autocomplete="off"
/>
