<!-- pagination-list-item.html -->
<!-- PaginationListItem component (Alpine.js) -->
<!--
  Description: one pagination list item in the trail
  HTML tag: <li wrapped in ol>
  CSS class: pagination-list-item
  Keyboard: none; not interactive, and any interactive children handle their own keys
  Accessibility: aria-label for accessible name
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<ol>
  <li
    class="pagination-list-item"
    aria-label="Example"
  >
    <!-- Consumer provides child content -->
  </li>
</ol>
