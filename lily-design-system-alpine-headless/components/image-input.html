<!-- image-input.html -->
<!-- ImageInput component (Alpine.js) -->
<!--
  Description: a graphical submit button that displays an image <input type="image">
  HTML tag: <input>
  CSS class: image-input
  Keyboard: Tab to focus, standard input keyboard interactions
  Accessibility: Implicit input role, aria-label for accessible name
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<input
  class="image-input"
  type="image"
  aria-label=""
>
