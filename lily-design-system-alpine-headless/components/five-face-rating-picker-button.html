<!-- FiveFaceRatingPickerButton component (Alpine.js) -->
<!--
  Description: a picker button for selecting a 1-5 satisfaction rating using face labels
  HTML tag: <button>
  CSS class: five-face-rating-picker-button
  Keyboard: Tab to focus, Enter or Space to activate
  Accessibility: role="radio", Implicit button role, aria-label for accessible name
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<button
  class="five-face-rating-picker-button"
  role="radio" aria-checked="false"
  aria-label=""
>
  <!-- Consumer provides button content -->
</button>
