<!-- CeskoRodneCisloView component (Alpine.js) -->
<!--
  Description: a read-only display of Czech Republic's Rodné číslo (RČ)
  HTML tag: <span>
  CSS class: cesko-rodne-cislo-view
  Keyboard: None (passive element)
  Accessibility: a visible caption names the value, or the screen-reader-span does. A plain span cannot take aria-label
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<span class="cesko-rodne-cislo-view"
  ><span class="screen-reader-span">Czech Personal Number </span></span
>
