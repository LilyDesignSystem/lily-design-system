<!-- international-patient-summary-section.html -->
<!-- InternationalPatientSummarySection component (Alpine.js) -->
<!--
  Description: one section of an International Patient Summary, with its LOINC code and a status that is never blank
  HTML tag: <section>
  CSS class: international-patient-summary-section
  Keyboard: 
  Accessibility: 
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<section
  class="international-patient-summary-section"
  id="international-patient-summary-problems"
  aria-labelledby="international-patient-summary-problems-heading"
  data-section="problems"
  data-code="11450-4"
  data-status="not-recorded"
  data-required="true"
  data-level="required"
>
  <h2
    id="international-patient-summary-problems-heading"
    class="international-patient-summary-section-heading"
  >
    Problem list
  </h2>
  <p class="international-patient-summary-section-status">Not recorded</p>
  <div class="international-patient-summary-section-meta">Required by the summary</div>
  <div class="international-patient-summary-section-warning">
    No entries were found in the document.
  </div>
  <details class="international-patient-summary-section-narrative">
    <summary>Narrative from the document</summary>
    <p>No problems were recorded at discharge.</p>
  </details>
</section>
