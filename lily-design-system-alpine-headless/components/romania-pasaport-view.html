<!-- RomaniaPasaportView component (Alpine.js) -->
<!--
  Description: a read-only display of Romania's Paşaport
  HTML tag: <span>
  CSS class: romania-pasaport-view
  Keyboard: None (passive element)
  Accessibility: a visible caption names the value, or the screen-reader-span does. A plain span cannot take aria-label
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<span class="romania-pasaport-view"
  ><span class="screen-reader-span">Romanian Passport </span></span
>
