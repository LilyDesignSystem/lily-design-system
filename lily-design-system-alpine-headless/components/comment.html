<!-- comment.html -->
<!-- Comment component (Alpine.js) -->
<!--
  Description: a comment is anything that expresses an opinion, observation, explanation, etc.
  HTML tag: <div>
  CSS class: comment
  Keyboard: None (passive element)
  Accessibility: role="group" with aria-label; drop both when the content needs no name
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<div
  class="comment"
  role="group"
  aria-label=""
>
  <!-- Consumer provides content -->
</div>
