<!-- YisraelTeudatZehutView component (Alpine.js) -->
<!--
  Description: a read-only display of Israel's Teudat Zehut identity number
  HTML tag: <span>
  CSS class: yisrael-teudat-zehut-view
  Keyboard: None (passive element)
  Accessibility: aria-label for accessible name
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<span
  class="yisrael-teudat-zehut-view"
  aria-label="Teudat Zehut (תעודת זהות)"
></span>
