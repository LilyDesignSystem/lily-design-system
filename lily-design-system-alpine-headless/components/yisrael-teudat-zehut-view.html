<!-- YisraelTeudatZehutView component (Alpine.js) -->
<!--
  Description: a read-only display of Israel's Teudat Zehut identity number
  HTML tag: <span>
  CSS class: yisrael-teudat-zehut-view
  Keyboard: None (passive element)
  Accessibility: a visible caption names the value, or the screen-reader-span does. A plain span cannot take aria-label
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<span class="yisrael-teudat-zehut-view"
  ><span class="screen-reader-span">Teudat Zehut (תעודת זהות) </span></span
>
