<!-- PilipinasPhilhealthIdentificationNumberInput component (Alpine.js) -->
<!--
  Description: an input for entering the Philippines' PhilHealth Identification Number (PIN)
  HTML tag: <input>
  CSS class: pilipinas-philhealth-identification-number-input
  Keyboard: Tab to focus, standard input keyboard interactions
  Accessibility: Implicit input role, aria-label for accessible name
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<input
  class="pilipinas-philhealth-identification-number-input"
  type="text"
  aria-label="PhilHealth Identification Number (PIN)"
  autocomplete="off"
>
