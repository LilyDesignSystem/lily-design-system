<!-- progress-spinner.html -->
<!-- ProgressSpinner component (Alpine.js) -->
<!--
  Description: an indeterminate spinning progress indicator
  HTML tag: <div>
  CSS class: progress-spinner
  Keyboard: None (passive element)
  Accessibility: role="status" with aria-live="polite", aria-label for accessible name
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<div
  class="progress-spinner"
  aria-live="polite"
  role="status"
  aria-label=""
>
  <!-- Consumer provides content -->
</div>
