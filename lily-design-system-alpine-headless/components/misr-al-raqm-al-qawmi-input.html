<!-- MisrAlRaqmAlQawmiInput component (Alpine.js) -->
<!--
  Description: an input for entering Egypt's National Number
  HTML tag: <input>
  CSS class: misr-al-raqm-al-qawmi-input
  Keyboard: Tab to focus, standard input keyboard interactions
  Accessibility: Implicit input role, aria-label for accessible name
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<input
  class="misr-al-raqm-al-qawmi-input"
  type="text"
  aria-label="الرقم القومي (Al-Raqm Al-Qawmi)"
  autocomplete="off"
>
