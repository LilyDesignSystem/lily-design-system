<!-- SouthAfricaIdentityNumberInput component (Alpine.js) -->
<!--
  Description: an input for entering South Africa's Identity Number
  HTML tag: <input>
  CSS class: south-africa-identity-number-input
  Keyboard: Tab to focus, standard input keyboard interactions
  Accessibility: Implicit input role, aria-label for accessible name
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<input
  class="south-africa-identity-number-input"
  type="text"
  aria-label="South African Identity Number"
  autocomplete="off"
>
