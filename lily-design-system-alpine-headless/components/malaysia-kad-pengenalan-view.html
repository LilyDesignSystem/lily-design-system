<!-- MalaysiaKadPengenalanView component (Alpine.js) -->
<!--
  Description: a read-only display of Malaysia's MyKad Number (NRIC)
  HTML tag: <span>
  CSS class: malaysia-kad-pengenalan-view
  Keyboard: None (passive element)
  Accessibility: a visible caption names the value, or the screen-reader-span does. A plain span cannot take aria-label
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<span class="malaysia-kad-pengenalan-view"
  ><span class="screen-reader-span">MyKad Number (NRIC) </span></span
>
