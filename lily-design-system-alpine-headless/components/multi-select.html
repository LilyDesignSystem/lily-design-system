<!-- multi-select.html -->
<!-- MultiSelect component (Alpine.js) -->
<!--
  Description: a native select that allows choosing several options at once
  HTML tag: <select multiple>
  CSS class: multi-select
  Keyboard: native only (Arrow keys move, Shift+Arrow extends, Ctrl/Cmd+click toggles)
  Accessibility: aria-label for accessible name; native listbox semantics
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<select
  class="multi-select"
  multiple
  aria-label="Toppings"
  size="4"
>
  <option value="cheese">Cheese</option>
  <option value="olives">Olives</option>
  <option value="peppers">Peppers</option>
  <option value="mushrooms">Mushrooms</option>
</select>
