<!-- split-view.html -->
<!-- SplitView component (Alpine.js) -->
<!--
  Description: a two-panel resizable layout container with a draggable divider between them
  HTML tag: <div>
  CSS class: split-view
  Keyboard: on the divider: the arrows for its orientation, Shift for ten steps, Home/End for the bounds, Enter to collapse and restore
  Accessibility: aria-label on the container; the divider is role="separator" with aria-orientation and the aria-value attributes
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<div
  class="split-view"
  aria-label=""
  data-orientation="horizontal"
  data-split-percent="50"
  x-lily-split-view
>
  <section class="split-view-primary">
    <!-- Consumer provides primary panel content -->
  </section>

  <div
    class="split-view-divider"
    role="separator"
    aria-orientation="horizontal"
    aria-valuenow="50"
    aria-valuemin="0"
    aria-valuemax="100"
    tabindex="0"
  ></div>

  <section class="split-view-secondary">
    <!-- Consumer provides secondary panel content -->
  </section>
</div>
