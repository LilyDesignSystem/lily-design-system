<!-- duration-view.html -->
<!-- DurationView component (Alpine.js) -->
<!--
  Description: a length of time, as an ISO 8601 duration in a <time> element, shown in the consumer's words
  HTML tag: <time>
  CSS class: duration-view
  Keyboard: 
  Accessibility: 
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<time
  class="duration-view"
  datetime="P3DT4H"
  ><span class="screen-reader-span">Length of stay </span>3 days 4 hours</time
>
