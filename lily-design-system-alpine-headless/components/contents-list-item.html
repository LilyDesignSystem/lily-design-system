<!-- contents-list-item.html -->
<!-- ContentsListItem component (Alpine.js) -->
<!--
  Description: one contents list item
  HTML tag: <li wrapped in ol>
  CSS class: contents-list-item
  Keyboard: none; not interactive, and any interactive children handle their own keys
  Accessibility: aria-label for accessible name
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<ol>
  <li
    class="contents-list-item"
    aria-label="Example"
  >
    <!-- Consumer provides child content -->
  </li>
</ol>
