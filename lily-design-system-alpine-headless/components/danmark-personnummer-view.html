<!-- DanmarkPersonnummerView component (Alpine.js) -->
<!--
  Description: a read-only display of Denmark's Personnummer (CPR-nummer) (CPR)
  HTML tag: <span>
  CSS class: danmark-personnummer-view
  Keyboard: None (passive element)
  Accessibility: a visible caption names the value, or the screen-reader-span does. A plain span cannot take aria-label
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<span class="danmark-personnummer-view"
  ><span class="screen-reader-span">Personal Identity Code </span></span
>
