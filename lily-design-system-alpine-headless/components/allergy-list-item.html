<!-- allergy-list-item.html -->
<!-- AllergyListItem component (Alpine.js) -->
<!--
  Description: one allergy or intolerance in an allergy list, with substance, reaction, severity and last update
  HTML tag: <li>
  CSS class: allergy-list-item
  Keyboard: 
  Accessibility: 
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<ul
  class="allergy-list"
  data-status="known"
  aria-label="Known allergies"
>
  <li
    class="allergy-list-item"
    data-severity="severe"
  >
    <span class="allergy-list-item-substance">Penicillin</span>
    <span class="allergy-list-item-reaction">Anaphylaxis</span>
    <span class="allergy-list-item-severity">Severe</span>
    <time
      class="allergy-list-item-updated"
      datetime="2026-11-03"
      >Updated 3 Nov 2026</time
    >
  </li>
</ul>
