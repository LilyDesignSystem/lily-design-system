<!-- ContentsLink component (Alpine.js) -->
<!--
  Description: one table of contents link
  HTML tag: <a>
  CSS class: contents-link
  Keyboard: Tab to focus, Enter to follow link
  Accessibility: aria-label for accessible name
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<!-- ContentsLink component -->
<!--
  Description: one table of contents link
  HTML tag: <a>
  CSS class: contents-link
  Keyboard: Tab to focus, Enter to follow link
  Accessibility: aria-label for accessible name
  Count (optional): put a visible count INSIDE the link, after the text, so the link's accessible name
    includes it, e.g. <span class="contents-link-count">3 to do</span>. Add data-count="3" (and
    data-complete when it is 0) as CSS hooks. The count is text, never colour alone (WCAG 1.4.1). An
    aria-label replaces the whole name, so if you set one, include the count in it.
-->

<a
  class="contents-link"
  aria-label=""
  href=""
>
  <!-- Consumer provides content -->
</a>

<!-- With a count: the visible count sits inside the link, after the text. -->
<a
  class="contents-link"
  id="with-count"
  href="#address"
  data-count="3"
>
  Address
  <span class="contents-link-count">3 to do</span>
</a>
