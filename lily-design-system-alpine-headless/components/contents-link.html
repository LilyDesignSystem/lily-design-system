<!-- contents-link.html -->
<!-- ContentsLink component (Alpine.js) -->
<!--
  Description: one table of contents link
  HTML tag: <a>
  CSS class: contents-link
  Keyboard: Tab to focus, Enter to follow link
  Accessibility: aria-label for accessible name
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<a
  class="contents-link"
  aria-label=""
  href=""
>
  <!-- Consumer provides content -->
</a>

<!-- With a count: the visible count sits inside the link, after the text. -->
<a
  class="contents-link"
  id="with-count"
  href="#address"
  data-count="3"
>
  Address
  <span class="contents-link-count">3 to do</span>
</a>
