<!-- AgeView component (Alpine.js) -->
<!--
  Description: a read-only display of a person's age, in the units suited to it
  HTML tag: <span>
  CSS class: age-view
  Keyboard: 
  Accessibility: 
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

  class="age-view"
  data-duration="P23D"
  ><span class="screen-reader-span">Age </span>3 weeks 2 days</span
>
