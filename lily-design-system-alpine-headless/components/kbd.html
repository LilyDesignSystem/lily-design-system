<!-- kbd.html -->
<!-- Kbd component (Alpine.js) -->
<!--
  Description: show keyboard shortcuts and key combinations in a styled inline element
  HTML tag: <kbd>
  CSS class: kbd
  Keyboard: none; not interactive, and any interactive children handle their own keys
  Accessibility: label is hidden text in a screen-reader-span
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<kbd class="kbd">
  <span class="screen-reader-span">Example </span
  ><span
    class="kbd-text"
    aria-hidden="true"
    ><!-- Consumer provides content --></span
  >
</kbd>
