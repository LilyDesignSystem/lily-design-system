<!-- PortugalPassaporteView component (Alpine.js) -->
<!--
  Description: a read-only display of Portugal's Passaporte
  HTML tag: <span>
  CSS class: portugal-passaporte-view
  Keyboard: None (passive element)
  Accessibility: a visible caption names the value, or the screen-reader-span does. A plain span cannot take aria-label
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<span class="portugal-passaporte-view"
  ><span class="screen-reader-span">Portuguese Passport </span></span
>
