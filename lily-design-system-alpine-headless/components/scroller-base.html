<!-- scroller-base.html -->
<!-- ScrollerBase component (Alpine.js) -->
<!--
  Description: a low-level scroll position tracking primitive for scrollytelling
  HTML tag: <div>
  CSS class: scroller-base
  Keyboard: None (passive element)
  Accessibility: role="group" with aria-label; drop both when the content needs no name
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<div
  class="scroller-base"
  role="group"
  aria-label=""
  data-offset="0.5"
>
  <!-- Consumer provides content -->
</div>
