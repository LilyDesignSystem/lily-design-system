<!-- scroll-area.html -->
<!-- ScrollArea component (Alpine.js) -->
<!--
  Description: a scrollable container with custom scrollbar support
  HTML tag: <div>
  CSS class: scroll-area
  Keyboard: Tab focuses it; arrows, Page Up/Down, Home/End scroll natively
  Accessibility: role="region" with aria-label; tabindex 0 so the keyboard can scroll it
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<div class="scroll-area" role="region" tabindex="0" aria-label="">
  <!-- Consumer provides content; consumer CSS sets the overflow and size -->
</div>
