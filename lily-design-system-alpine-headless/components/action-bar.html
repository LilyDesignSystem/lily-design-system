<!-- action-bar.html -->
<!-- ActionBar component (Alpine.js) -->
<!--
  Description: a contextual action bar that appears when items are selected, showing the selection count and bulk action buttons
  HTML tag: <div with role="toolbar">
  CSS class: action-bar
  Keyboard: ArrowLeft/ArrowRight move between the controls (wrapping), Home/End jump; one tab stop; Escape presses the clear button
  Accessibility: role="toolbar" with required aria-label; the count is announced by the consumer; data-selected-count for CSS
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<div
  class="action-bar"
  role="toolbar"
  aria-label=""
  data-selected-count="0"
  x-lily-toolbar=".action-bar-clear"
>
  <span class="action-bar-count"></span>
  <!-- Consumer inserts action-bar-button children here -->
  <button
    class="action-bar-clear"
    type="button"
    aria-label=""
  >
    ×
  </button>
</div>
