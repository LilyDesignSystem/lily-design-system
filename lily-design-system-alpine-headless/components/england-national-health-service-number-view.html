<!-- EnglandNationalHealthServiceNumberView component (Alpine.js) -->
<!--
  Description: a read-only display of England's National Health Service Number (NHS)
  HTML tag: <span>
  CSS class: england-national-health-service-number-view
  Keyboard: None (passive element)
  Accessibility: a visible caption names the value, or the screen-reader-span does. A plain span cannot take aria-label
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<span class="england-national-health-service-number-view"
  ><span class="screen-reader-span">National Health Service Number </span></span
>
