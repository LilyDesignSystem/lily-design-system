<!-- one-time-password-input.html -->
<!-- OneTimePasswordInput component (Alpine.js) -->
<!--
  Description: a single one-time-password input with a numeric keypad, SMS autofill, and a fixed length
  HTML tag: <input>
  CSS class: one-time-password-input
  Keyboard: native text input only
  Accessibility: aria-label for accessible name (supply the localized text); no hardcoded strings
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<input
  class="one-time-password-input"
  type="text"
  inputmode="numeric"
  autocomplete="one-time-code"
  maxlength="6"
  pattern="[0-9]*"
  spellcheck="false"
  autocapitalize="off"
  aria-label="Verification code"
  data-length="6"
  name="code"
>
