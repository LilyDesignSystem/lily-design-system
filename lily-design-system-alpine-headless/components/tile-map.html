<!-- tile-map.html -->
<!-- TileMap component (Alpine.js) -->
<!--
  Description: a tile cartogram map with configurable layers for geographic data visualization
  HTML tag: <div>
  CSS class: tile-map
  Keyboard: ArrowRight/ArrowLeft step through the tiles, ArrowDown/ArrowUp go to the nearest tile in the next or previous row, Enter/Space activate (tile-activate), Escape deselects
  Accessibility: role="img" with aria-label and aria-roledescription="tile map"
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<div
  class="tile-map"
  role="img"
  aria-label=""
  aria-roledescription="tile map"
  x-data="lilyTileMap()"
  x-bind="map"
>
  <!-- Consumer provides focusable [data-tile] elements (tabindex="0") and positions them; it hears tile-activate -->
</div>
