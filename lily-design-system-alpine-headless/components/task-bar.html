<!-- task-bar.html -->
<!-- TaskBar component (Alpine.js) -->
<!--
  Description: a horizontal bar of task shortcuts or actions
  HTML tag: <div>
  CSS class: task-bar
  Keyboard: ArrowLeft/ArrowRight move between the controls (wrapping), Home/End jump; one tab stop
  Accessibility: role="toolbar" with aria-label
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<div
  class="task-bar"
  role="toolbar"
  aria-label=""
  x-lily-toolbar
>
  <!-- Consumer provides content -->
</div>
