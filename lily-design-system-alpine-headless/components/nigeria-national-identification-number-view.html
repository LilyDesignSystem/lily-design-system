<!-- NigeriaNationalIdentificationNumberView component (Alpine.js) -->
<!--
  Description: a read-only display of Nigeria's National Identification Number (NIN)
  HTML tag: <span>
  CSS class: nigeria-national-identification-number-view
  Keyboard: None (passive element)
  Accessibility: a visible caption names the value, or the screen-reader-span does. A plain span cannot take aria-label
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<span class="nigeria-national-identification-number-view"
  ><span class="screen-reader-span">National Identification Number (NIN) </span></span
>
