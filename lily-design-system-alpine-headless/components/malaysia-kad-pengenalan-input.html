<!-- MalaysiaKadPengenalanInput component (Alpine.js) -->
<!--
  Description: an input for entering Malaysia's MyKad Number (NRIC)
  HTML tag: <input>
  CSS class: malaysia-kad-pengenalan-input
  Keyboard: Tab to focus, standard input keyboard interactions
  Accessibility: Implicit input role, aria-label for accessible name
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<input
  class="malaysia-kad-pengenalan-input"
  type="text"
  aria-label="MyKad Number (NRIC)"
  autocomplete="off"
/>
