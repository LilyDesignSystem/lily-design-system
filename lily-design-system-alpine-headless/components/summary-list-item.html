<!-- summary-list-item.html -->
<!-- SummaryListItem component (Alpine.js) -->
<!--
  Description: one key-value pair in a summary list
  HTML tag: <div wrapped in dl, holding a dt and a dd>
  CSS class: summary-list-item
  Keyboard: none; not interactive, and any interactive children handle their own keys
  Accessibility: the dt and dd pair carries the meaning; the div has no name
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<dl>
  <div class="summary-list-item">
    <dt>Term</dt>
    <dd><!-- Consumer provides the value --></dd>
  </div>
</dl>
