<!-- collapsible.html -->
<!-- Collapsible component (Alpine.js) -->
<!--
  Description: a container that can be expanded or collapsed
  HTML tag: <details>
  CSS class: collapsible
  Keyboard: Tab to the summary, Enter or Space to expand and collapse
  Accessibility: native disclosure semantics; no ARIA added
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<details class="collapsible">
  <summary class="collapsible-summary">
    <!-- Consumer provides summary -->
  </summary>
  <div class="collapsible-body">
    <!-- Consumer provides content -->
  </div>
</details>
