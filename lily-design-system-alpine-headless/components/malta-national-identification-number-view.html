<!-- MaltaNationalIdentificationNumberView component (Alpine.js) -->
<!--
  Description: a read-only display of Malta's Malta National Identification Number
  HTML tag: <span>
  CSS class: malta-national-identification-number-view
  Keyboard: None (passive element)
  Accessibility: a visible caption names the value, or the screen-reader-span does. A plain span cannot take aria-label
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<span class="malta-national-identification-number-view"
  ><span class="screen-reader-span">Malta National Identification Number </span></span
>
