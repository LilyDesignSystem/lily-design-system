<!-- AsSaudiyahRaqmAlHuwiyahAlWataniyahInput component -->
<!--
  Description: an input for entering Saudi Arabia's National Identification Number
  HTML tag: <input>
  CSS class: as-saudiyah-raqm-al-huwiyah-al-wataniyah-input
  Keyboard: Tab to focus, standard input keyboard interactions
  Accessibility: Implicit input role, aria-label for accessible name
  Format: 7-8 digits plus a Modulus-11 check character (0-9 or K).
  Usage:
    <input class="as-saudiyah-raqm-al-huwiyah-al-wataniyah-input" type="text" aria-label="National Identification Number" autocomplete="off">
-->

<input
  class="as-saudiyah-raqm-al-huwiyah-al-wataniyah-input"
  type="text"
  aria-label="National Identification Number"
  autocomplete="off"
  spellcheck="false"
/>
