<!-- PilipinasPhilhealthIdentificationNumberView component -->
<!--
  Description: a read-only display of the Philippines' PhilHealth Identification Number (PIN)
  HTML tag: <span>
  CSS class: pilipinas-philhealth-identification-number-view
  Keyboard: None (passive element)
  Accessibility: aria-label for accessible name
  Format: Twelve-digit number assigned by the Philippine Health Insurance Corporation (PhilHealth) to every enrolled member, commonly displayed grouped as NN-NNNNNNNNN-N. No published check-digit algorithm; correctness is confirmed against PhilHealth's own membership records.
  Usage:
    <span class="pilipinas-philhealth-identification-number-view" aria-label="PhilHealth Identification Number (PIN)">value-here</span>
-->

<span
  class="pilipinas-philhealth-identification-number-view"
  aria-label="PhilHealth Identification Number (PIN)"
></span>
