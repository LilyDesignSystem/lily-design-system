<!-- NigeriaNationalIdentificationNumberView component -->
<!--
  Description: a read-only display of Nigeria's National Identification Number (NIN)
  HTML tag: <span>
  CSS class: nigeria-national-identification-number-view
  Keyboard: None (passive element)
  Accessibility: aria-label for accessible name
  Format: 7-8 digits plus a Modulus-11 check character (0-9 or K).
  Usage:
    <span class="nigeria-national-identification-number-view" aria-label="National Identification Number (NIN)">value-here</span>
-->

<span
  class="nigeria-national-identification-number-view"
  aria-label="National Identification Number (NIN)"
></span>
