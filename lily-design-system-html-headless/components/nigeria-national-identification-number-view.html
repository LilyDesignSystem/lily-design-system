<!-- NigeriaNationalIdentificationNumberView component -->
<!--
  Description: a read-only display of Nigeria's National Identification Number (NIN)
  HTML tag: <span>
  CSS class: nigeria-national-identification-number-view
  Keyboard: None (passive element)
  Accessibility: a visible caption names the value, or the screen-reader-span does. A plain span cannot take aria-label
  Format: 7-8 digits plus a Modulus-11 check character (0-9 or K).
  Usage:
    <span class="nigeria-national-identification-number-view">value-here</span>
-->

<span class="nigeria-national-identification-number-view"
  ><span class="screen-reader-span">National Identification Number (NIN) </span></span
>
