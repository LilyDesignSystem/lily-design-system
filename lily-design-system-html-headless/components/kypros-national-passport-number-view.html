<!-- kypros-national-passport-number-view.html -->
<!-- KyprosNationalPassportNumberView component -->
<!--
  Description: a read-only display of Kypros's National Passport Number
  HTML tag: <span>
  CSS class: kypros-national-passport-number-view
  Keyboard: None (passive element)
  Accessibility: a visible caption names the value, or the screen-reader-span does. A plain span cannot take aria-label
  Format: passports before 13/12/2010 begin with 'E' followed by 6 digits (e.g. E123456); biometric passports issued after 13/12/2010 begin with 'K' followed by 8 digits (e.g. K12345678)
  Usage:
    <span class="kypros-national-passport-number-view">value-here</span>
-->

<span class="kypros-national-passport-number-view"
  ><span class="screen-reader-span">National Passport Number </span></span
>
