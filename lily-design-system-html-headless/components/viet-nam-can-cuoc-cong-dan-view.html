<!-- VietNamCanCuocCongDanView component -->
<!--
  Description: a read-only display of Viet Nam's Citizen Identification Number (CCCD)
  HTML tag: <span>
  CSS class: viet-nam-can-cuoc-cong-dan-view
  Keyboard: None (passive element)
  Accessibility: aria-label for accessible name
  Format: 7-8 digits plus a Modulus-11 check character (0-9 or K).
  Usage:
    <span class="viet-nam-can-cuoc-cong-dan-view" aria-label="Citizen Identification Number (CCCD)">value-here</span>
-->

<span
  class="viet-nam-can-cuoc-cong-dan-view"
  aria-label="Citizen Identification Number (CCCD)"
></span>
