<!-- VietNamCanCuocCongDanView component -->
<!--
  Description: a read-only display of Viet Nam's Citizen Identification Number (CCCD)
  HTML tag: <span>
  CSS class: viet-nam-can-cuoc-cong-dan-view
  Keyboard: None (passive element)
  Accessibility: a visible caption names the value, or the screen-reader-span does. A plain span cannot take aria-label
  Format: 7-8 digits plus a Modulus-11 check character (0-9 or K).
  Usage:
    <span class="viet-nam-can-cuoc-cong-dan-view">value-here</span>
-->

<span class="viet-nam-can-cuoc-cong-dan-view"
  ><span class="screen-reader-span">Citizen Identification Number (CCCD) </span></span
>
