<!-- HongKongIdentityCardView component -->
<!--
  Description: a read-only display of Hong Kong's Identity Card Number
  HTML tag: <span>
  CSS class: hong-kong-identity-card-view
  Keyboard: None (passive element)
  Accessibility: a visible caption names the value, or the screen-reader-span does. A plain span cannot take aria-label
  Format: 7-8 digits plus a Modulus-11 check character (0-9 or K).
  Usage:
    <span class="hong-kong-identity-card-view">value-here</span>
-->

<span class="hong-kong-identity-card-view"
  ><span class="screen-reader-span">Hong Kong Identity Card Number </span></span
>
