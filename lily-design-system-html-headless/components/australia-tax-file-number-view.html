<!-- AustraliaTaxFileNumberView component -->
<!--
  Description: a read-only display of Australia's Tax File Number (TFN)
  HTML tag: <span>
  CSS class: australia-tax-file-number-view
  Keyboard: None (passive element)
  Accessibility: a visible caption names the value, or the screen-reader-span does. A plain span cannot take aria-label
  Format: 7-8 digits plus a Modulus-11 check character (0-9 or K).
  Usage:
    <span class="australia-tax-file-number-view">value-here</span>
-->

<span class="australia-tax-file-number-view"
  ><span class="screen-reader-span">Tax File Number (TFN) </span></span
>
