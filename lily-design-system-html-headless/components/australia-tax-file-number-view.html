<!-- AustraliaTaxFileNumberView component -->
<!--
  Description: a read-only display of Australia's Tax File Number (TFN)
  HTML tag: <span>
  CSS class: australia-tax-file-number-view
  Keyboard: None (passive element)
  Accessibility: aria-label for accessible name
  Format: 7-8 digits plus a Modulus-11 check character (0-9 or K).
  Usage:
    <span class="australia-tax-file-number-view" aria-label="Tax File Number (TFN)">value-here</span>
-->

<span
  class="australia-tax-file-number-view"
  aria-label="Tax File Number (TFN)"
></span>
