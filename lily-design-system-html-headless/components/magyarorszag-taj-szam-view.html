<!-- MagyarorszagTajSzamView component -->
<!--
  Description: a read-only display of Hungary's Tarsadalombiztositasi Azonosito Jel (TAJ)
  HTML tag: <span>
  CSS class: magyarorszag-taj-szam-view
  Keyboard: None (passive element)
  Accessibility: aria-label for accessible name
  Format: Nine digits, SSS SSS SSK. The ninth digit is a check digit from alternating weights 3 and 7 over the first eight, Modulus 10.
  Usage:
    <span class="magyarorszag-taj-szam-view" aria-label="Társadalombiztosítási Azonosító Jel (TAJ)">value-here</span>
-->

<span
  class="magyarorszag-taj-szam-view"
  aria-label="Társadalombiztosítási Azonosító Jel (TAJ)"
></span>
