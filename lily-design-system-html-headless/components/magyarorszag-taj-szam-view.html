<!-- MagyarorszagTajSzamView component -->
<!--
  Description: a read-only display of Hungary's Tarsadalombiztositasi Azonosito Jel (TAJ)
  HTML tag: <span>
  CSS class: magyarorszag-taj-szam-view
  Keyboard: None (passive element)
  Accessibility: a visible caption names the value, or the screen-reader-span does. A plain span cannot take aria-label
  Format: Nine digits, SSS SSS SSK. The ninth digit is a check digit from alternating weights 3 and 7 over the first eight, Modulus 10.
  Usage:
    <span class="magyarorszag-taj-szam-view">value-here</span>
-->

<span class="magyarorszag-taj-szam-view"
  ><span class="screen-reader-span">Társadalombiztosítási Azonosító Jel (TAJ) </span></span
>
