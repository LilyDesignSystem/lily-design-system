<!-- MagyarorszagTajSzamInput component -->
<!--
  Description: an input for entering Hungary's Tarsadalombiztositasi Azonosito Jel (TAJ)
  HTML tag: <input>
  CSS class: magyarorszag-taj-szam-input
  Keyboard: Tab to focus, standard input keyboard interactions
  Accessibility: Implicit input role, aria-label for accessible name
  Format: Nine digits, SSS SSS SSK. The ninth digit is a check digit from alternating weights 3 and 7 over the first eight, Modulus 10.
  Usage:
    <input class="magyarorszag-taj-szam-input" type="text" aria-label="Társadalombiztosítási Azonosító Jel (TAJ)" autocomplete="off">
-->

<input
  class="magyarorszag-taj-szam-input"
  type="text"
  aria-label="Társadalombiztosítási Azonosító Jel (TAJ)"
  autocomplete="off"
>
