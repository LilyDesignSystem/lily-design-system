<!-- banner.html -->
<!-- Banner component -->
<!--
  Description: a prominent message bar across the top of a page
  HTML tag: <div>
  CSS class: banner
  Keyboard: None (passive element)
  Accessibility: role="region" with aria-live="polite", so a change is announced without interrupting
  Usage:
    <div class="banner" role="banner" aria-label="Example">
      ...
    </div>
-->

<div
  class="banner"
  data-type="info"
  role="region"
  aria-live="polite"
>
  <!-- Consumer provides content -->
</div>
