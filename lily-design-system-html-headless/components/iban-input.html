<!-- iban-input.html -->
<!-- IbanInput component -->
<!--
  Description: an input for entering an International Bank Account Number (IBAN)
  HTML tag: <input>
  CSS class: iban-input
  Keyboard: Tab to focus, standard input keyboard interactions
  Accessibility: Implicit input role, aria-label for accessible name
  Format: Up to 34 letters and digits: a two-letter country code, two check digits, then the national account number
  Usage:
    <input class="iban-input" type="text" aria-label="IBAN" autocomplete="off">
-->

<input
  class="iban-input"
  type="text"
  aria-label="IBAN"
  autocomplete="off"
>
