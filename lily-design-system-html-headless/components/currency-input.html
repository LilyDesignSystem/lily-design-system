<!-- currency-input.html -->
<!-- CurrencyInput component -->
<!--
  Description: a locale-aware currency input with automatic formatting, symbols, separators
  HTML tag: <input>
  CSS class: currency-input
  Keyboard: None (passive element)
  Accessibility: aria-label for accessible name
  Usage:
    <div class="currency-input" aria-label="Example" data-currency-code="EUR">
      ...
    </div>
-->

<!-- data-currency-code is REQUIRED: the consumer supplies the ISO 4217 code. It is never defaulted. -->
<input
  class="currency-input"
  type="text"
  inputmode="decimal"
  aria-label=""
  data-currency-code=""
/>

<script>
  // CurrencyInput behavior
  (function() {
    'use strict';
    // CurrencyInput: consumer implements interactive behavior
    document.querySelectorAll('.currency-input').forEach(function(el) {
      // Interactive behavior initialization
    });
  })();
</script>
