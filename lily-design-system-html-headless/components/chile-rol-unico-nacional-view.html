<!-- ChileRolUnicoNacionalView component -->

  Description: a read-only display of Chile's Rol Unico Nacional (RUN)
  HTML tag: <span>
  CSS class: chile-rol-unico-nacional-view
  Keyboard: None (passive element)
  Accessibility: aria-label for accessible name
  Format: 7-8 digits plus a Modulus-11 check character (0-9 or K).
  Usage:
    <span class="chile-rol-unico-nacional-view" aria-label="Rol Único Nacional (RUN)">value-here</span>
-->

<span
  class="chile-rol-unico-nacional-view"
  aria-label="Rol Único Nacional (RUN)"
></span>
