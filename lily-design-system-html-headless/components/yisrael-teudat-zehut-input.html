<!-- YisraelTeudatZehutInput component -->
<!--
  Description: an input for entering Israel's Teudat Zehut (תעודת זהות)
  HTML tag: <input>
  CSS class: yisrael-teudat-zehut-input
  Keyboard: Tab to focus, standard input keyboard interactions
  Accessibility: Implicit input role, aria-label for accessible name
  Format: Nine digits (left-padded with zeros when shorter), with the ninth a Luhn (Modulus-10) check digit: digits alternate between weights of 1 and 2 from the left, any doubled product over 9 has its own two digits summed, and the total must be a multiple of 10.
  Usage:
    <input class="yisrael-teudat-zehut-input" type="text" aria-label="Teudat Zehut (תעודת זהות)" autocomplete="off">
-->

<input
  class="yisrael-teudat-zehut-input"
  type="text"
  aria-label="Teudat Zehut (תעודת זהות)"
  autocomplete="off"
>
