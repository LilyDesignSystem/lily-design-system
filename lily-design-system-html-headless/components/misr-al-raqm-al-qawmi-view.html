<!-- MisrAlRaqmAlQawmiView component -->
<!--
  Description: a read-only display of Egypt's National Number
  HTML tag: <span>
  CSS class: misr-al-raqm-al-qawmi-view
  Keyboard: None (passive element)
  Accessibility: a visible caption names the value, or the screen-reader-span does. A plain span cannot take aria-label
  Format: Fourteen digits: century, date of birth, governorate, serial (sex parity), check digit.
  Usage:
    <span class="misr-al-raqm-al-qawmi-view">value-here</span>
-->

<span class="misr-al-raqm-al-qawmi-view"
  ><span class="screen-reader-span">الرقم القومي (Al-Raqm Al-Qawmi) </span></span
>
