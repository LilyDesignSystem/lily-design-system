<!-- ErrorMessage component -->
<!--
  Description: an error message associated with a form field
  HTML tag: <p>
  CSS class: error-message
  Keyboard: None (passive element)
  Accessibility: aria-label for accessible name
  Usage:
    <p class="error-message" aria-label="Example">
      ...
    </p>
-->

<p
  class="error-message"
  role="alert"
  aria-label=""
>
  <!-- Consumer provides text content -->
</p>
