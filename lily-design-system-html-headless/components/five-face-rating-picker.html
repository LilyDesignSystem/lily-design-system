<!-- five-face-rating-picker.html -->
<!-- FiveFaceRatingPicker component -->
<!--
  Description: a picker for selecting a 1-5 satisfaction rating using face labels
  HTML tag: <fieldset> (a radio group; the -picker suffix's <div> gives way to the native grouping element)
  CSS class: five-face-rating-picker
  Keyboard: native radio group: Tab focuses the checked radio (or the first), the arrow keys move and check, Space checks
  Accessibility: role="radiogroup" with aria-label; five native radios, values 1 to 5, sharing one name; disabled on the fieldset disables them all
  Usage:
    <fieldset class="five-face-rating-picker" role="radiogroup" aria-label="Example">
      <label><input type="radio" name="face-rating" value="1" /> 1</label>
      ...
      <label><input type="radio" name="face-rating" value="5" /> 5</label>
    </fieldset>
  The option text is the consumer's (the numbers by default, no English). Add checked to the radio of the
  starting value; a form reset then restores it natively.
-->

<fieldset
  class="five-face-rating-picker"
  role="radiogroup"
  aria-label=""
>
  <label
    ><input
      type="radio"
      name="face-rating"
      value="1"
    />
    1</label
  >
  <label
    ><input
      type="radio"
      name="face-rating"
      value="2"
    />
    2</label
  >
  <label
    ><input
      type="radio"
      name="face-rating"
      value="3"
    />
    3</label
  >
  <label
    ><input
      type="radio"
      name="face-rating"
      value="4"
    />
    4</label
  >
  <label
    ><input
      type="radio"
      name="face-rating"
      value="5"
    />
    5</label
  >
</fieldset>
