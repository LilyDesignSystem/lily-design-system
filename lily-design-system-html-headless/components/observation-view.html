<!-- observation-view.html -->
<!-- ObservationView component -->
<!--
  Description: a read-only clinical observation or result, with its unit, reference range and interpretation flag
  HTML tag: <span>
  CSS class: observation-view (parts: observation-view-value, -unit, -flag, -range, -meter, -status)
  Spec: spec/healthcare-ui
  Attributes: data-interpretation (a FHIR v3 ObservationInterpretation code: N, L, H, LL, HH, A, ...), data-status
    (final, registered, preliminary, amended, corrected, entered-in-error, cancelled, unknown, masked, not-recorded, unavailable,
    not-applicable). The flag is the consumer's words, never the code or a colour alone. A registered, cancelled, masked,
    not-recorded, unavailable or not-applicable result shows its words in .observation-view-status instead of a value, never a
    blank, and so does an entered-in-error one in a current-results view; any other status but final shows them beside the
    value. A result with no words for its status shows no value. Leave data-interpretation, the flag, range and meter out of
    a withheld or withdrawn result. In an authorised history view, an entered-in-error result is its words, then
    <del class="observation-view-withdrawn-value"> around the former value and unit.
    The value and unit are joined by a no-break space. Lily computes no flag and no range.
    Optional <meter class="observation-view-meter" aria-hidden="true" value min max low high optimum>: where the value sits
    against the reference range, for the theme to draw. It is aria-hidden because the value, range and flag are already
    words; it is their picture, never the only signal. Leave it out unless you have the numbers.
-->

<span
  class="observation-view"
  data-interpretation="H"
  data-status="final"
  ><span class="screen-reader-span">Potassium </span
  ><span class="observation-view-value">5.9</span>&#160;<span class="observation-view-unit"
    >mmol/L</span
  >
  <span class="observation-view-flag">High</span>
  <span class="observation-view-range">3.5–5.3</span>
  <span class="observation-view-range"
    ><span class="observation-view-range-label">Critical</span> above 6.5</span
  >
  <meter
    class="observation-view-meter"
    aria-hidden="true"
    value="5.9"
    min="2"
    max="8"
    low="3.5"
    high="5.3"
    optimum="4.4"
  ></meter
></span>
