<!-- observation-view.html -->
<!-- ObservationView component -->
<!--
  Description: a read-only clinical observation or result, with its unit, reference range and interpretation flag
  HTML tag: <span>
  CSS class: observation-view (parts: observation-view-value, -unit, -flag, -range, -status)
  Spec: spec/healthcare-ui
  Attributes: data-interpretation (a FHIR v3 ObservationInterpretation code: N, L, H, LL, HH, A, ...), data-status
    (final, preliminary, not-recorded, unavailable). The flag is the consumer's words, never the code or a colour alone.
    A not-recorded or unavailable result shows its words in .observation-view-status instead of a value, never a blank.
    The value and unit are joined by a no-break space. Lily computes no flag and no range.
-->

<span class="observation-view" data-interpretation="H" data-status="final"><span class="screen-reader-span">Potassium </span><span class="observation-view-value">5.9</span>&#160;<span class="observation-view-unit">mmol/L</span> <span class="observation-view-flag">High</span> <span class="observation-view-range">3.5–5.3</span></span>
