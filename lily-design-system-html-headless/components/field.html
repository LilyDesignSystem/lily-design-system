<!-- Field component -->
<!--
  Description: a form field wrapper with label, input, and error message
  HTML tag: <div>
  CSS class: field
  Keyboard: None (passive element)
  Accessibility: none of its own: a <div> cannot take a name
  Usage:
    <div class="field" aria-label="Example">
      ...
    </div>
-->

<div
  class="field"
  data-required="true"
>
  <!-- Consumer provides content -->
</div>
