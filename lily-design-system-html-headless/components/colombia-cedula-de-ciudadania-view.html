<!-- ColombiaCedulaDeCiudadaniaView component -->
<!--
  Description: a read-only display of Colombia's Cedula de Ciudadania Number
  HTML tag: <span>
  CSS class: colombia-cedula-de-ciudadania-view
  Keyboard: None (passive element)
  Accessibility: a visible caption names the value, or the screen-reader-span does. A plain span cannot take aria-label
  Format: 7-8 digits plus a Modulus-11 check character (0-9 or K).
  Usage:
    <span class="colombia-cedula-de-ciudadania-view">value-here</span>
-->

<span class="colombia-cedula-de-ciudadania-view"
  ><span class="screen-reader-span">Cedula de Ciudadania Number </span></span
>
