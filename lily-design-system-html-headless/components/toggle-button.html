<!-- toggle-button.html -->
<!-- ToggleButton component -->
<!--
  Description: a button that toggles between pressed and unpressed states
  HTML tag: <button>
  CSS class: toggle-button
  Keyboard: Tab to focus, Space or Enter toggles (native button activation)
  Accessibility: a native button with aria-pressed for the state (the WAI-ARIA toggle button pattern), aria-label for accessible name
  Usage:
    <button
      class="toggle-button"
      type="button"
      aria-label=""
      aria-pressed="false"
    >
    </button>
-->

<button
  class="toggle-button"
  type="button"
  aria-label=""
  aria-pressed="false"
>
  <!-- Consumer provides button content -->
</button>

<script>
  // ToggleButton behavior
  (function () {
    "use strict";
    document.querySelectorAll(".toggle-button").forEach(function (el) {
      el.addEventListener("click", function () {
        if (el.disabled) return;
        el.setAttribute("aria-pressed", String(el.getAttribute("aria-pressed") !== "true"));
      });
    });
  })();
</script>
