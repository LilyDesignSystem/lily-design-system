<!-- PolskaNumerIdentyfikacjiPodatkowejView component -->
<!--
  Description: a read-only display of Poland's Numer Identyfikacji Podatkowej (NIP)
  HTML tag: <span>
  CSS class: polska-numer-identyfikacji-podatkowej-view
  Keyboard: None (passive element)
  Accessibility: a visible caption names the value, or the screen-reader-span does. A plain span cannot take aria-label
  Format: 10 numeric digits used for tax identification
  Usage:
    <span class="polska-numer-identyfikacji-podatkowej-view">value-here</span>
-->

<span class="polska-numer-identyfikacji-podatkowej-view"
  ><span class="screen-reader-span">Tax Identification Number </span></span
>
