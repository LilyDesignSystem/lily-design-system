<!-- iran-kod-e-melli-input.html -->
<!-- IranKodEMelliInput component -->
<!--
  Description: an input for entering Iran's National Code (Kod-e Melli)
  HTML tag: <input>
  CSS class: iran-kod-e-melli-input
  Keyboard: Tab to focus, standard input keyboard interactions
  Accessibility: Implicit input role, aria-label for accessible name
  Format: 7-8 digits plus a Modulus-11 check character (0-9 or K).
  Usage:
    <input class="iran-kod-e-melli-input" type="text" aria-label="National Code (Kod-e Melli)" autocomplete="off">
-->

<input
  class="iran-kod-e-melli-input"
  type="text"
  aria-label="National Code (Kod-e Melli)"
  autocomplete="off"
  spellcheck="false"
/>
