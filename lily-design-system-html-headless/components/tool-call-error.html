<!-- ToolCallError component -->
<!--
  Description: the error shown when a tool call fails.
  HTML tag: <div>
  CSS class: tool-call-error
  Contract: `role="alert"` announces the error when it appears (open the tool call on error so it is not hidden inside a closed `<details>`)
-->

<div class="tool-call-error" role="alert">The tool timed out.</div>
