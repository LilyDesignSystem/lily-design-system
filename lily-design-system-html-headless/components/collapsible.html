<!-- collapsible.html -->
<!-- Collapsible component -->
<!--
  Description: a container that can be expanded or collapsed
  HTML tag: <details>
  CSS class: collapsible (collapsible-summary, collapsible-body)
  Keyboard: Tab to the summary, Enter or Space to toggle (native)
  Accessibility: native <details> and <summary>; no ARIA added
  Usage:
    Add the open attribute to start expanded.
-->

<details class="collapsible">
  <summary class="collapsible-summary">
    <!-- Consumer provides summary -->
  </summary>
  <div class="collapsible-body">
    <!-- Consumer provides content -->
  </div>
</details>
