<!-- timer.html -->
<!-- Timer component -->
<!--
  Description: a countdown or elapsed time display
  HTML tag: <time>
  CSS class: timer
  Keyboard: None (passive element)
  Accessibility: aria-label for accessible name; role="timer", not live
  Usage:
    <div class="timer" aria-label="Example">
      ...
    </div>
-->

<time
  class="timer"
  role="timer"
  aria-label=""
>
  <!-- Consumer provides content -->
</time>

<!-- Not a live region: role="timer" is aria-live="off" by default, because a value that changes every second would flood
     a screen reader. Announce milestones ("one minute left") in a separate role="status" region. -->
