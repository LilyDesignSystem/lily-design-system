<!-- DeutschlandKrankenversichertennummerView component -->
<!--
  Description: a read-only display of Germany's Krankenversichertennummer (KVNR)
  HTML tag: <span>
  CSS class: deutschland-krankenversichertennummer-view
  Keyboard: None (passive element)
  Accessibility: a visible caption names the value, or the screen-reader-span does. A plain span cannot take aria-label
  Format: a random capital letter followed by eight random digits and a Luhn check digit
  Usage:
    <span class="deutschland-krankenversichertennummer-view">value-here</span>
-->

<span class="deutschland-krankenversichertennummer-view"
  ><span class="screen-reader-span">Health Insurance Number </span></span
>
