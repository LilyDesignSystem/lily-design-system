<!-- PilipinasPhilhealthIdentificationNumberInput component -->
<!--
  Description: an input for entering the Philippines' PhilHealth Identification Number (PIN)
  HTML tag: <input>
  CSS class: pilipinas-philhealth-identification-number-input
  Keyboard: Tab to focus, standard input keyboard interactions
  Accessibility: Implicit input role, aria-label for accessible name
  Format: Twelve-digit number assigned by the Philippine Health Insurance Corporation (PhilHealth) to every enrolled member, commonly displayed grouped as NN-NNNNNNNNN-N. No published check-digit algorithm; correctness is confirmed against PhilHealth's own membership records.
  Usage:
    <input class="pilipinas-philhealth-identification-number-input" type="text" aria-label="PhilHealth Identification Number (PIN)" autocomplete="off">
-->

<input
  class="pilipinas-philhealth-identification-number-input"
  type="text"
  aria-label="PhilHealth Identification Number (PIN)"
  autocomplete="off"
>
