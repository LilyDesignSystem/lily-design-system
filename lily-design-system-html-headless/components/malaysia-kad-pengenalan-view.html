<!-- MalaysiaKadPengenalanView component -->
<!--
  Description: a read-only display of Malaysia's MyKad Number (NRIC)
  HTML tag: <span>
  CSS class: malaysia-kad-pengenalan-view
  Keyboard: None (passive element)
  Accessibility: a visible caption names the value, or the screen-reader-span does. A plain span cannot take aria-label
  Format: 7-8 digits plus a Modulus-11 check character (0-9 or K).
  Usage:
    <span class="malaysia-kad-pengenalan-view">value-here</span>
-->

<span class="malaysia-kad-pengenalan-view"
  ><span class="screen-reader-span">MyKad Number (NRIC) </span></span
>
