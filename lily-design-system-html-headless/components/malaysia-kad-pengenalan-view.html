<!-- MalaysiaKadPengenalanView component -->
<!--
  Description: a read-only display of Malaysia's MyKad Number (NRIC)
  HTML tag: <span>
  CSS class: malaysia-kad-pengenalan-view
  Keyboard: None (passive element)
  Accessibility: aria-label for accessible name
  Format: 7-8 digits plus a Modulus-11 check character (0-9 or K).
  Usage:
    <span class="malaysia-kad-pengenalan-view" aria-label="MyKad Number (NRIC)">value-here</span>
-->

<span
  class="malaysia-kad-pengenalan-view"
  aria-label="MyKad Number (NRIC)"
></span>
