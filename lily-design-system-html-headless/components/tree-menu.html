<!-- tree-menu.html -->
<!-- TreeMenu component -->
<!--
  Description: a hierarchical tree menu with expandable branches
  HTML tag: <div>
  CSS class: tree-menu
  Keyboard: ArrowDown/ArrowUp move between the [role="treeitem"] items (wrapping), Home/End jump
  Accessibility: role="tree", aria-label for accessible name
  Usage:
    <div class="tree-menu" role="tree" aria-label="Example">
      ...
    </div>
-->

<div
  class="tree-menu"
  role="tree"
  aria-label=""
>
  <!-- Consumer provides content -->
</div>

<script>
  // TreeMenu behavior: ArrowDown / ArrowUp move focus between the consumer's [role="treeitem"]
  // items, wrapping at the ends; Home / End jump. Items are read at key time, so items added later work.
  (function() {
    'use strict';
    var KEYS = ['ArrowDown', 'ArrowUp', 'Home', 'End'];
    document.querySelectorAll('.tree-menu').forEach(function(root) {
      if (!root.hasAttribute('tabindex')) root.setAttribute('tabindex', '-1');
      root.addEventListener('keydown', function(event) {
        if (KEYS.indexOf(event.key) === -1) return;
        var items = Array.prototype.slice.call(root.querySelectorAll('[role="treeitem"]'));
        if (items.length === 0) return;
        var current = items.indexOf(event.target.closest('[role="treeitem"]'));
        var last = items.length - 1;
        var next;
        if (event.key === 'Home') next = 0;
        else if (event.key === 'End') next = last;
        else if (event.key === 'ArrowDown') next = current >= last ? 0 : current + 1;
        else next = current <= 0 ? last : current - 1;
        event.preventDefault();
        items[next].focus();
      });
    });
  })();
</script>
