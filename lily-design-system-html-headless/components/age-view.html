<!-- age-view.html -->
<!-- AgeView component -->
<!--
  Description: a read-only display of a person's age, in the units suited to it
  HTML tag: <span>
  CSS class: age-view
  Spec: spec/healthcare-ui
  The age is the consumer's words (for example from ageParts in a TypeScript library); data-duration holds the same age
    as an ISO 8601 duration.
-->

<span class="age-view" data-duration="P23D"><span class="screen-reader-span">Age </span>3 weeks 2 days</span>
