<!-- RossiyaSnilsView component -->
<!--
  Description: a read-only display of Russia's SNILS Individual Insurance Account Number
  HTML tag: <span>
  CSS class: rossiya-snils-view
  Keyboard: None (passive element)
  Accessibility: aria-label for accessible name
  Format: Eleven digits, NNN-NNN-NNN CC, a Modulus-101 check value over the first nine.
  Usage:
    <span class="rossiya-snils-view" aria-label="СНИЛС (Strakhovoy Nomer Individualnogo Litsevogo Scheta)">value-here</span>
-->

<span
  class="rossiya-snils-view"
  aria-label="СНИЛС (Strakhovoy Nomer Individualnogo Litsevogo Scheta)"
></span>
