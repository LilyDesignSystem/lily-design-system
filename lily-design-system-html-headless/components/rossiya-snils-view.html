<!-- RossiyaSnilsView component -->
<!--
  Description: a read-only display of Russia's SNILS Individual Insurance Account Number
  HTML tag: <span>
  CSS class: rossiya-snils-view
  Keyboard: None (passive element)
  Accessibility: a visible caption names the value, or the screen-reader-span does. A plain span cannot take aria-label
  Format: Eleven digits, NNN-NNN-NNN CC, a Modulus-101 check value over the first nine.
  Usage:
    <span class="rossiya-snils-view">value-here</span>
-->

<span class="rossiya-snils-view"
  ><span class="screen-reader-span"
    >СНИЛС (Strakhovoy Nomer Individualnogo Litsevogo Scheta)
  </span></span
>
