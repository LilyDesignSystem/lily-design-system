<!-- iban-view.html -->
<!-- IbanView component -->
<!--
  Description: a read-only display of an International Bank Account Number (IBAN)
  HTML tag: <span>
  CSS class: iban-view
  Keyboard: None (passive element)
  Accessibility: aria-label for accessible name
  Format: Up to 34 letters and digits: a two-letter country code, two check digits, then the national account number
  Usage:
    <span class="iban-view" aria-label="IBAN">value-here</span>
-->

<span
  class="iban-view"
  aria-label="IBAN"
></span>
