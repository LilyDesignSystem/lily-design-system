<!-- menu.html -->
<!-- Menu component -->
<!--
  Description: a list of actions or options triggered by a button
  HTML tag: <div>
  CSS class: menu
  Keyboard: ArrowDown/ArrowUp move between items (wrapping), Home/End jump to first/last
  Accessibility: role="menu", aria-label for accessible name; items are role="menuitem" tabindex="-1"
  Usage:
    <div
      class="menu"
      role="menu"
      aria-label=""
    >
    </div>
-->

<div
  class="menu"
  role="menu"
  aria-label=""
>
  <!-- Consumer provides role="menuitem" items -->
</div>

<script>
  // Menu behavior
  (function() {
    'use strict';
    document.querySelectorAll('.menu').forEach(function(root) {
      root.addEventListener('keydown', function(e) {
        var items = Array.from(root.querySelectorAll("[role='menuitem']"));
        var index = items.indexOf(document.activeElement);
        if (e.key === 'ArrowDown') {
          e.preventDefault();
          if (items.length) items[index < items.length - 1 ? index + 1 : 0].focus();
        } else if (e.key === 'ArrowUp') {
          e.preventDefault();
          if (items.length) items[index > 0 ? index - 1 : items.length - 1].focus();
        } else if (e.key === 'Home') {
          e.preventDefault();
          if (items.length) items[0].focus();
        } else if (e.key === 'End') {
          e.preventDefault();
          if (items.length) items[items.length - 1].focus();
        }
      });
    });
  })();
</script>
