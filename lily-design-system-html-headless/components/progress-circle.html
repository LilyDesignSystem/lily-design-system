<!-- progress-circle.html -->
<!-- ProgressCircle component -->
<!--
  Description: a circular progress indicator
  HTML tag: <div>
  CSS class: progress-circle
  Keyboard: None (passive element)
  Accessibility: role="progressbar", aria-label for accessible name
  Usage:
    <div class="progress-circle" role="progressbar" aria-label="Example">
      ...
    </div>
-->

<div
  class="progress-circle"
  role="progressbar"
  aria-label=""
  aria-valuemin="0"
  aria-valuemax="100"
  aria-valuenow="0"
>
  <!-- Consumer provides content -->
</div>
