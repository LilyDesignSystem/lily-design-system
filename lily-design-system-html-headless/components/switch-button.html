<!-- switch-button.html -->
<!-- SwitchButton component -->
<!--
  Description: a toggle switch for turning a setting on or off
  HTML tag: <button>
  CSS class: switch-button
  Keyboard: Tab to focus, Space or Enter toggles (native button activation)
  Accessibility: role="switch", aria-checked for the on/off state, aria-label for accessible name
  Usage:
    <button
      class="switch-button"
      type="button"
      role="switch"
      aria-label=""
      aria-checked="false"
    >
    </button>
-->

<button
  class="switch-button"
  type="button"
  role="switch"
  aria-label=""
  aria-checked="false"
>
  <!-- Consumer provides button content -->
</button>

<script>
  // SwitchButton behavior
  (function() {
    'use strict';
    document.querySelectorAll('.switch-button').forEach(function(el) {
      el.addEventListener('click', function() {
        if (el.disabled) return;
        el.setAttribute('aria-checked', String(el.getAttribute('aria-checked') !== 'true'));
      });
    });
  })();
</script>
