<!-- IndonesiaNomorIndukKependudukanView component -->
<!--
  Description: a read-only display of Indonesia's Nomor Induk Kependudukan (NIK)
  HTML tag: <span>
  CSS class: indonesia-nomor-induk-kependudukan-view
  Keyboard: None (passive element)
  Accessibility: a visible caption names the value, or the screen-reader-span does. A plain span cannot take aria-label
  Format: Sixteen digits: region, date of birth (+40 to day for females), serial. No check digit.
  Usage:
    <span class="indonesia-nomor-induk-kependudukan-view">value-here</span>
-->

<span class="indonesia-nomor-induk-kependudukan-view"
  ><span class="screen-reader-span">Nomor Induk Kependudukan (NIK) </span></span
>
