<!-- UruguayCedulaDeIdentidadView component -->
<!--
  Description: a read-only display of Uruguay's Cedula de Identidad Number
  HTML tag: <span>
  CSS class: uruguay-cedula-de-identidad-view
  Keyboard: None (passive element)
  Accessibility: a visible caption names the value, or the screen-reader-span does. A plain span cannot take aria-label
  Format: 7-8 digits plus a Modulus-11 check character (0-9 or K).
  Usage:
    <span class="uruguay-cedula-de-identidad-view">value-here</span>
-->

<span class="uruguay-cedula-de-identidad-view"
  ><span class="screen-reader-span">Cedula de Identidad Number </span></span
>
