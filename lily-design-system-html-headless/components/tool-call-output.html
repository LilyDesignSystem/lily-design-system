<!-- tool-call-output.html -->
<!-- ToolCallOutput component -->
<!--
  Description: the output or result returned by a tool in a tool call.
  HTML tag: <div>
  CSS class: tool-call-output
  Keyboard: none; not interactive, and any interactive children handle their own keys
  Contract: `label` (optional) sets `role="group"` and `aria-label`; without it neither is rendered
-->

<div class="tool-call-output" role="group" aria-label="Arguments">{"query": "weather"}</div>
