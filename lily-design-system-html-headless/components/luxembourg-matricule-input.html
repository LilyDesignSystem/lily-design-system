<!-- luxembourg-matricule-input.html -->
<!-- LuxembourgMatriculeInput component -->
<!--
  Description: an input for entering Luxembourg's Numero d'Identification Nationale (Matricule)
  HTML tag: <input>
  CSS class: luxembourg-matricule-input
  Keyboard: Tab to focus, standard input keyboard interactions
  Accessibility: Implicit input role, aria-label for accessible name
  Format: Thirteen digits, YYYYMMDDNNNCC: date of birth, sequence number, a Luhn check digit, then a Verhoeff check digit.
  Usage:
    <input class="luxembourg-matricule-input" type="text" aria-label="Numéro d'Identification Nationale (Matricule)" autocomplete="off">
-->

<input
  class="luxembourg-matricule-input"
  type="text"
  aria-label="Numéro d'Identification Nationale (Matricule)"
  autocomplete="off"
>
