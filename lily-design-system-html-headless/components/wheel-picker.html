<!-- wheel-picker.html -->
<!-- WheelPicker component -->
<!--
  Description: a vertical single-select listbox where the selection follows the cursor
  HTML tag: <div> holding a listbox <div>
  CSS class: wheel-picker (sub-elements: wheel-picker-list, wheel-picker-option)
  Keyboard: ArrowDown / ArrowUp, Home / End, PageDown / PageUp, type-ahead over the labels; disabled options are skipped
  Accessibility: role="listbox" with aria-orientation="vertical" and aria-activedescendant on the focusable list; each option
    is role="option" with aria-selected (and aria-disabled when disabled). The label is the consumer's.
  Attributes on the root: data-loop (arrows wrap), data-page-size (default 5). Mark the initial option aria-selected="true".
    An optional <input type="hidden" name="…"> inside the root carries the value for a form. A bubbling `change` event
    fires with detail.value when the selection changes.
  Usage (see the markup below)
-->

<div class="wheel-picker" data-page-size="5">
  <div class="wheel-picker-list" role="listbox" aria-orientation="vertical" aria-label="Month" tabindex="0" aria-activedescendant="wheel-month-2">
    <div class="wheel-picker-option" role="option" id="wheel-month-1" aria-selected="false" data-value="1">January</div>
    <div class="wheel-picker-option" role="option" id="wheel-month-2" aria-selected="true" data-value="2">February</div>
    <div class="wheel-picker-option" role="option" id="wheel-month-3" aria-selected="false" data-value="3">March</div>
    <div class="wheel-picker-option" role="option" id="wheel-month-4" aria-selected="false" aria-disabled="true" data-value="4">April</div>
    <div class="wheel-picker-option" role="option" id="wheel-month-5" aria-selected="false" data-value="5">May</div>
  </div>
  <input type="hidden" name="month" value="2">
</div>

<script>

/* BEGIN shared/wheel-picker.ts (generated by bin/sync-shared-modules; do not edit) */
/**
 * Keyboard model for a wheel picker: a single-select listbox where the selection follows the cursor (APG listbox, "selection
 * follows focus"), so moving the cursor IS choosing. Pure and framework-neutral, tested without a browser.
 *
 * Disabled options are skipped by every move. Arrows wrap only when `loop` is set; Home, End, PageUp and PageDown never wrap.
 */

const WHEEL_MOVE_KEYS                    = ["ArrowUp", "ArrowDown", "Home", "End", "PageUp", "PageDown"];

/** Indexes of the options that can be selected. */
function enabledIndexes(options                        )           {
    const out           = [];
    options.forEach((o, i) => {
        if (!o.disabled) out.push(i);
    });
    return out;
}

/**
 * The index to select after `key`, or -1 when no option can be selected. `current` is the selected index, or -1 for none.
 * With nothing selected, ArrowDown / PageDown / Home choose the first enabled option and ArrowUp / PageUp / End the last.
 */
function nextWheelIndex(options                        , current        , key              , move                   = {})         {
    const enabled = enabledIndexes(options);
    if (enabled.length === 0) return -1;
    const first = enabled[0];
    const last = enabled[enabled.length - 1];
    const position = enabled.indexOf(current);
    const pageSize = Math.max(1, Math.floor(move.pageSize ?? 5));

    if (key === "Home") return first;
    if (key === "End") return last;
    if (position === -1) return key === "ArrowDown" || key === "PageDown" ? first : last;

    switch (key) {
        case "ArrowDown":
            return position + 1 < enabled.length ? enabled[position + 1] : move.loop ? first : current;
        case "ArrowUp":
            return position > 0 ? enabled[position - 1] : move.loop ? last : current;
        case "PageDown":
            return enabled[Math.min(enabled.length - 1, position + pageSize)];
        case "PageUp":
            return enabled[Math.max(0, position - pageSize)];
    }
}

/** Lower-case and strip diacritics so "é" is typed with "e". */
function fold(text        )         {
    return text.normalize("NFD").replace(/\p{M}/gu, "").toLocaleLowerCase();
}

const WHEEL_TYPEAHEAD_RESET_MS = 700;

/** The prefix after `key` at time `now`: it grows while presses are within the reset time, else starts over. */
function nextWheelPrefix(previous                , key        , now        , resetMs         = WHEEL_TYPEAHEAD_RESET_MS)                 {
    const continuing = previous.prefix !== "" && now - previous.at <= resetMs;
    return { prefix: (continuing ? previous.prefix : "") + key, at: now };
}

/** Whether a key press is a type-ahead character: one printable character other than space, no Ctrl, Alt or Meta. */
function isWheelTypeaheadKey(event                                                                         )          {
    return event.key.length === 1 && event.key !== " " && !event.ctrlKey && !event.altKey && !event.metaKey;
}

/**
 * The enabled option to move to for the typed `prefix`, or -1. Searches from the option after `current` and wraps; a prefix of one
 * repeated letter ("ss") counts as that single letter, so pressing it again steps through the options that start with it.
 */
function wheelTypeaheadIndex(options                        , current        , prefix        )         {
    const folded = fold(prefix);
    if (folded === "" || options.length === 0) return -1;
    const repeated = folded.length > 1 && [...folded].every((c) => c === folded[0]);
    const needle = repeated ? folded[0] : folded;
    const startOffset = needle.length > 1 ? 0 : 1;
    const from = current < 0 ? -startOffset : current;
    for (let step = 0; step < options.length; step++) {
        const index = (from + startOffset + step + options.length) % options.length;
        const option = options[index];

  function init(root) {
    var list = root.querySelector(".wheel-picker-list");
    var optionEls = Array.prototype.slice.call(root.querySelectorAll(".wheel-picker-option"));
    var options = optionEls.map(function (el) {
      return { value: el.getAttribute("data-value"), label: el.textContent, disabled: el.getAttribute("aria-disabled") === "true" };
    });
    var hidden = root.querySelector('input[type="hidden"]');
    var loop = root.hasAttribute("data-loop");
    var pageSize = Number(root.getAttribute("data-page-size") || 5);
    var typeahead = { prefix: "", at: 0 };
    var selected = optionEls.findIndex(function (el) { return el.getAttribute("aria-selected") === "true"; });

    function centre() {
      if (selected < 0) return;
      var el = optionEls[selected];
      list.scrollTop = el.offsetTop - (list.clientHeight - el.offsetHeight) / 2;
    }

    function show() {
      optionEls.forEach(function (el, i) { el.setAttribute("aria-selected", String(i === selected)); });
      if (selected >= 0) list.setAttribute("aria-activedescendant", optionEls[selected].id);
      else list.removeAttribute("aria-activedescendant");
      if (hidden) hidden.value = selected >= 0 ? options[selected].value : "";
      centre();
    }

    function select(index) {
      if (index < 0 || index === selected) return; // applying the selection already held is a no-op
      selected = index;
      show();
      root.dispatchEvent(new CustomEvent("change", { bubbles: true, detail: { value: options[index].value } }));
    }

    list.addEventListener("keydown", function (event) {
      if (list.getAttribute("aria-disabled") === "true") return;
      if (WHEEL_MOVE_KEYS.indexOf(event.key) !== -1) {
        event.preventDefault();
        select(nextWheelIndex(options, selected, event.key, { loop: loop, pageSize: pageSize }));
      } else if (isWheelTypeaheadKey(event)) {
        typeahead = nextWheelPrefix(typeahead, event.key, Date.now());
        select(wheelTypeaheadIndex(options, selected, typeahead.prefix));
      }
    });

    list.addEventListener("click", function (event) {
      if (list.getAttribute("aria-disabled") === "true") return;
      var target = event.target.closest('[role="option"]');
      if (!target || target.getAttribute("aria-disabled") === "true") return;
      select(optionEls.indexOf(target));
      list.focus();
    });

    centre();
  }

  Array.prototype.forEach.call(document.querySelectorAll(".wheel-picker"), init);

</script>
