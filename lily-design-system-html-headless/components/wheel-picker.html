<!-- WheelPicker component -->
<!--
  Description: a single-select listbox, vertical by default, where the selection follows the cursor
  HTML tag: <div> holding a listbox <div>
  CSS class: wheel-picker (sub-elements: wheel-picker-list, wheel-picker-option)
  Keyboard: ArrowDown / ArrowUp (ArrowRight / ArrowLeft with aria-orientation="horizontal", swapped right-to-left), Home / End, PageDown / PageUp, type-ahead over the labels; disabled options are skipped
  Accessibility: role="listbox" with aria-orientation ("vertical", or "horizontal") and aria-activedescendant on the focusable list; each option
    is role="option" with aria-selected (and aria-disabled when disabled). The label is the consumer's.
  Attributes on the root: data-loop (arrows wrap), data-page-size (default 5). Mark the initial option aria-selected="true".
    An optional <input type="hidden" name="…"> inside the root carries the value for a form; give it a `form` attribute
    when the picker sits outside its form. The script disables it while the list is aria-disabled, so a disabled picker is
    not submitted, and a form reset puts back the initial selection. When the user turns the wheel and it settles, the
    option in the middle is chosen. A bubbling `change` event fires with detail.value
    when the selection changes.
  Usage (see the markup below)
-->

<div class="wheel-picker" data-page-size="5">
  <div class="wheel-picker-list" role="listbox" aria-orientation="vertical" aria-label="Month" tabindex="0" aria-activedescendant="wheel-month-2">
    <div class="wheel-picker-option" role="option" id="wheel-month-1" aria-selected="false" data-value="1">January</div>
    <div class="wheel-picker-option" role="option" id="wheel-month-2" aria-selected="true" data-value="2">February</div>
    <div class="wheel-picker-option" role="option" id="wheel-month-3" aria-selected="false" data-value="3">March</div>
    <div class="wheel-picker-option" role="option" id="wheel-month-4" aria-selected="false" aria-disabled="true" data-value="4">April</div>
    <div class="wheel-picker-option" role="option" id="wheel-month-5" aria-selected="false" data-value="5">May</div>
  </div>
  <input type="hidden" name="month" value="2">
</div>

 *
 * Disabled options are skipped by every move. Arrows wrap only when `loop` is set; Home, End, PageUp and PageDown never wrap.
 */

const WHEEL_MOVE_KEYS                    = [
    "ArrowUp",
    "ArrowDown",
    "Home",
    "End",
    "PageUp",
    "PageDown",

 * with ArrowLeft / ArrowRight, swapped when `rtl`, so the arrow always points the way the cursor goes; their ArrowUp / ArrowDown are
 * left to the page. Home, End, PageUp and PageDown move a wheel of either orientation.

    key        ,
    orientation                   = "vertical",
    rtl          = false,

    if (key === "Home" || key === "End" || key === "PageUp" || key === "PageDown") return key;
    if (orientation === "horizontal") {
        if (key === "ArrowRight") return rtl ? "ArrowUp" : "ArrowDown";
        if (key === "ArrowLeft") return rtl ? "ArrowDown" : "ArrowUp";
        return undefined;

    return key === "ArrowDown" || key === "ArrowUp" ? key : undefined;

 * `middles` holds each option's middle along the scrolling axis and `centre` the list's, in the same coordinates (for
 * example from getBoundingClientRect). A tie goes to the earlier option.

    middles                   ,

    let bestDistance = Infinity;

 * nearest the middle, or re-centre the chosen one if the wheel came to rest elsewhere, such as on a disabled option. A scroll

    let timer                                           ;

    const clicked = ()       => {

    };

        turned = false;
        const horizontal = watch.orientation() === "horizontal";
        const box = list.getBoundingClientRect();

        const middles = Array.from(list.querySelectorAll             ('[role="option"]'), (el) => {

    const scrolled = ()       => {
        clearTimeout(timer);
        timer = setTimeout(settle, WHEEL_SCROLL_SETTLE_MS);

    const events                         = [
        ["wheel", gesture],
        ["touchstart", gesture],
        ["pointerdown", gesture],
        ["click", clicked],
        ["scroll", scrolled],
        ["scrollend", settle],
    ];
    for (const [type, handler] of events) list.addEventListener(type, handler, { passive: true });

    options.forEach((o, i) => {

    return out;

 * With nothing selected, ArrowDown / PageDown / Home choose the first enabled option and ArrowUp / PageUp / End the last.

function nextWheelIndex(
    options                        ,
    current        ,
    key              ,
    move                   = {},

    const enabled = enabledIndexes(options);
    if (enabled.length === 0) return -1;
    const first = enabled[0];
    const last = enabled[enabled.length - 1];
    const position = enabled.indexOf(current);
    const pageSize = Math.max(1, Math.floor(move.pageSize ?? 5));

    if (key === "Home") return first;
    if (key === "End") return last;

    switch (key) {

                ? enabled[position + 1]

        case "ArrowUp":

/** The prefix after `key` at time `now`: it grows while presses are within the reset time, else starts over. */

    previous                ,
    key        ,
    now        ,
    resetMs         = WHEEL_TYPEAHEAD_RESET_MS,

        event.key !== " " &&

    options                        ,
    current        ,
    prefix        ,
