<!-- tool-bar.html -->
<!-- ToolBar component -->
<!--
  Description: a horizontal bar of tool actions
  HTML tag: <div>
  CSS class: tool-bar
  Keyboard: ArrowRight/ArrowLeft move between controls (wrapping), Home/End jump to first/last
  Accessibility: role="toolbar", aria-label for accessible name
  Usage:
    <div
      class="tool-bar"
      role="toolbar"
      aria-label=""
    >
    </div>
-->

<div
  class="tool-bar"
  role="toolbar"
  aria-label=""
>
  <!-- Consumer provides buttons -->
</div>

<script>
  // ToolBar behavior
  (function() {
    'use strict';
    document.querySelectorAll('.tool-bar').forEach(function(root) {
      root.addEventListener('keydown', function(e) {
        var items = Array.from(root.querySelectorAll("button, [role='button'], [tabindex]"));
        var index = items.indexOf(document.activeElement);
        if (e.key === 'ArrowRight') {
          e.preventDefault();
          if (items.length) items[index < items.length - 1 ? index + 1 : 0].focus();
        } else if (e.key === 'ArrowLeft') {
          e.preventDefault();
          if (items.length) items[index > 0 ? index - 1 : items.length - 1].focus();
        } else if (e.key === 'Home') {
          e.preventDefault();
          if (items.length) items[0].focus();
        } else if (e.key === 'End') {
          e.preventDefault();
          if (items.length) items[items.length - 1].focus();
        }
      });
    });
  })();
</script>
