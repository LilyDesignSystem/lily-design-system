<!-- AotearoaNationalHealthIndexInput component -->
<!--
  Description: an input for entering New Zealand's National Health Index (NHI) Number
  HTML tag: <input>
  CSS class: aotearoa-national-health-index-input
  Keyboard: Tab to focus, standard input keyboard interactions
  Accessibility: Implicit input role, aria-label for accessible name
  Format: Seven-character identifier (three letters, four digits). The legacy AAANNNC format uses a Modulus-11 check digit over the six preceding characters; an expanded AAANNAX format (issued from July 2026) uses a Modulus-23 check digit instead, to extend the identifier space.
  Usage:
    <input class="aotearoa-national-health-index-input" type="text" aria-label="National Health Index (NHI) Number" autocomplete="off">
-->

<input
  class="aotearoa-national-health-index-input"
  type="text"
  aria-label="National Health Index (NHI) Number"
  autocomplete="off"
>
