<!-- warning-text.html -->
<!-- WarningText component -->
<!--
  Description: a short warning shown as an icon and a bold line of text, with a visually hidden prefix supplied by the consumer.
  HTML tag: <div>
  CSS class: warning-text (sub-classes warning-text-icon, warning-text-text)
  Contract: the icon is the consumer's and sits in an aria-hidden span (omit the span for no icon);
  the visually hidden prefix ("Warning" here) is the consumer's text, in the consumer's language,
  hidden with the consumer's own visually-hidden class.
-->

<div class="warning-text">
  <span class="warning-text-icon" aria-hidden="true">!</span>
  <strong class="warning-text-text">
    <span class="visually-hidden">Warning</span>
    You can be fined up to £5,000 if you do not register.
  </strong>
</div>
