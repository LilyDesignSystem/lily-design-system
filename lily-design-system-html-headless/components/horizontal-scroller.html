<!-- horizontal-scroller.html -->
<!-- HorizontalScroller component -->
<!--
  Description: a horizontally scrollable content container
  HTML tag: <div>
  CSS class: horizontal-scroller
  Keyboard: ArrowRight/ArrowLeft scroll by data-step pixels (default 100), Home scrolls to the start, End to the end
  Accessibility: role="region", aria-label for accessible name, tabindex="0" (a scrollable region must be focusable)
  Usage:
    <div
      class="horizontal-scroller"
      role="region"
      aria-label=""
      tabindex="0"
      data-step="100"
    >
    </div>
-->

<div
  class="horizontal-scroller"
  role="region"
  aria-label=""
  tabindex="0"
  data-step="100"
>
  <!-- Consumer provides content -->
</div>

<script>
  // HorizontalScroller behavior
  (function() {
    'use strict';
    document.querySelectorAll('.horizontal-scroller').forEach(function(el) {
      el.addEventListener('keydown', function(e) {
        var step = parseFloat(el.getAttribute('data-step'));
        if (isNaN(step)) step = 100;
        if (e.key === 'ArrowRight') {
          e.preventDefault();
          el.scrollBy({ left: step, behavior: 'smooth' });
        } else if (e.key === 'ArrowLeft') {
          e.preventDefault();
          el.scrollBy({ left: -step, behavior: 'smooth' });
        } else if (e.key === 'Home') {
          e.preventDefault();
          el.scrollTo({ left: 0, behavior: 'smooth' });
        } else if (e.key === 'End') {
          e.preventDefault();
          el.scrollTo({ left: el.scrollWidth, behavior: 'smooth' });
        }
      });
    });
  })();
</script>
