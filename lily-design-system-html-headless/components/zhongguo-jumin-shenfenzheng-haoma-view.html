<!-- ZhongguoJuminShenfenzhengHaomaView component -->
<!--
  Description: a read-only display of China's Resident Identity Card Number
  HTML tag: <span>
  CSS class: zhongguo-jumin-shenfenzheng-haoma-view
  Keyboard: None (passive element)
  Accessibility: a visible caption names the value, or the screen-reader-span does. A plain span cannot take aria-label
  Format: Eighteen characters (GB 11643): region, date of birth, sequence with sex parity, then an ISO 7064 MOD 11-2 check character (may be X).
  Usage:
    <span class="zhongguo-jumin-shenfenzheng-haoma-view">value-here</span>
-->

<span class="zhongguo-jumin-shenfenzheng-haoma-view"
  ><span class="screen-reader-span">居民身份证号码 (Jūmín Shēnfènzhèng Hàomǎ) </span></span
