<!-- red-amber-green-picker.html -->
<!-- RedAmberGreenPicker component -->
<!--
  Description: a picker for a red/amber/green (RAG) status
  HTML tag: <fieldset> (a radio group; the -picker suffix's <div> gives way to the native grouping element)
  CSS class: red-amber-green-picker
  Keyboard: native radio group: Tab focuses the checked radio (or the first), the arrow keys move and check, Space checks
  Accessibility: role="radiogroup" with aria-label; one native radio per status (red, amber, green), sharing one name; disabled on the fieldset disables them all
  Usage:
    <fieldset class="red-amber-green-picker" role="radiogroup" aria-label="Example">
      <label><input type="radio" name="status" value="red" /> …</label>
      ...
    </fieldset>
  Each option's text is the consumer's, in its own words: the values below stand in for it. Add checked to the radio
  of the starting value; a form reset then restores it natively.
-->

<fieldset
  class="red-amber-green-picker"
  role="radiogroup"
  aria-label=""
>
  <label
    ><input
      type="radio"
      name="status"
      value="red"
    />
    red</label
  >
  <label
    ><input
      type="radio"
      name="status"
      value="amber"
    />
    amber</label
  >
  <label
    ><input
      type="radio"
      name="status"
      value="green"
    />
    green</label
  >
</fieldset>
