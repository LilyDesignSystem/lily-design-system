<!-- hidden-input.html -->
<!-- HiddenInput component -->
<!--
  Description: a hidden input for including data in form submission
  HTML tag: <input>
  CSS class: hidden-input
  Accessibility: none; a hidden input is not perceivable, so it takes no label. The consumer sets name and value.
-->

<input
  class="hidden-input"
  type="hidden"
  name=""
  value=""
/>
