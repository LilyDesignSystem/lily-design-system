<!-- split-button.html -->
<!-- SplitButton component -->
<!--
  Description: a button with a primary action and a dropdown for related actions

  HTML tag: <div> with role="group"
  CSS class: split-button
  Keyboard:
    - Tab moves focus into the group; Tab again moves between primary and trigger.
    - Enter or Space on the primary button activates the primary action.
    - Enter or Space on the trigger toggles the menu.
    - Escape on the trigger or the menu closes the menu and returns focus to the trigger.
  Accessibility:
    - role="group" with aria-label groups the two buttons.
    - The trigger uses aria-haspopup="menu", aria-controls, and aria-expanded reflects the open state.
    - The closed menu is not rendered (a closed popover, or the hidden attribute in the fallback), so it is out of the accessibility tree.

  Popover API (tasks.md P18-T11):
    The menu is popover="auto" and the trigger names it with
    command="toggle-popover" commandfor (and popovertarget), so the browser
    opens and closes it, closes it on Escape and on a click outside, and puts
    it in the top layer, with no script. The embedded script keeps
    aria-expanded in step with the menu's toggle event. Where the Popover API
    is missing it falls back to toggling the `hidden` attribute, with Escape
    and an outside click.

  Usage:
    <div class="split-button" role="group" aria-label="Save options">
      <button class="split-button-primary" type="button">Save</button>
      <button class="split-button-menu-trigger" type="button"
              aria-haspopup="menu" aria-expanded="false" aria-label="More save options"
              aria-controls="split-button-menu-1" command="toggle-popover"
              commandfor="split-button-menu-1" popovertarget="split-button-menu-1">
      </button>
      <div class="split-button-menu" id="split-button-menu-1" popover="auto">
        … Consumer-supplied menu content …
      </div>
    </div>
-->

<div
  class="split-button"
  role="group"
  aria-label=""
>
  <!-- Primary action button — consumer provides the visible label text -->
  <button
    class="split-button-primary"
    type="button"
  >
    <!-- Consumer provides primary label text -->
  </button>

  <!-- Menu trigger — consumer provides any glyph or icon as inner content (or leaves empty) -->
  <button
    class="split-button-menu-trigger"
    type="button"
    aria-haspopup="menu"
    aria-expanded="false"
    aria-label=""
    aria-controls="split-button-menu-1"
    command="toggle-popover"
    commandfor="split-button-menu-1"
    popovertarget="split-button-menu-1"
  >
    <!-- Consumer optionally provides a chevron icon -->
  </button>

  <!-- Menu container — a popover the trigger opens -->
  <div
    class="split-button-menu"
    id="split-button-menu-1"
    popover="auto"
  >
    <!-- Consumer provides menu items (typically a Menu component) -->
  </div>
</div>

<script>
  // SplitButton behavior
  // With the Popover API the browser opens, closes and light-dismisses the
  // menu; this script only keeps aria-expanded in step with its toggle event.
  // Without it (the fallback) the script manages the open/closed state by:
  //   - Toggling on trigger click.
  //   - Closing on Escape (returning focus to the trigger).
  //   - Closing on outside click.
  // and keeps aria-expanded and the menu's hidden attribute in sync.
  (function () {
    "use strict";

    var native = typeof HTMLElement.prototype.showPopover === "function";
    var groups = document.querySelectorAll('div.split-button');

    groups.forEach(function (group) {
      // Locate the trigger and the menu container within this group.
      var trigger = group.querySelector('.split-button-menu-trigger');
      var menu = group.querySelector('.split-button-menu');
      if (!trigger || !menu) return;

      if (native) {
        menu.addEventListener('toggle', function (event) {
          trigger.setAttribute('aria-expanded', event.newState === 'open' ? 'true' : 'false');
        });
        return;
      }

      // Fallback: no Popover API.
      menu.removeAttribute('popover');
      menu.setAttribute('hidden', '');

      // Apply the open/closed state to both ARIA and the hidden attribute.
      function setOpen(isOpen) {
        trigger.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
        if (isOpen) {
          menu.removeAttribute('hidden');
        } else {
          menu.setAttribute('hidden', '');
        }
      }

      // Click on the trigger toggles the menu.
      trigger.addEventListener('click', function () {
        if (trigger.disabled) return;
        var isOpen = trigger.getAttribute('aria-expanded') === 'true';
        setOpen(!isOpen);
      });

      // Escape closes the menu and returns focus to the trigger.
      group.addEventListener('keydown', function (event) {
        if (event.key === 'Escape') {
          if (trigger.getAttribute('aria-expanded') === 'true') {
            setOpen(false);
            trigger.focus();
          }
        }
      });

      // Click outside the group closes the menu.
      document.addEventListener('click', function (event) {
        if (!group.contains(event.target)) {
          if (trigger.getAttribute('aria-expanded') === 'true') {
            setOpen(false);
          }
        }
      });
    });
  })();
</script>
