<!-- menu-bar.html -->
<!-- MenuBar component -->
<!--
  Description: a horizontal bar of menu triggers
  HTML tag: <div>
  CSS class: menu-bar
  Keyboard: ArrowRight/ArrowLeft move between items (wrapping), Home/End jump to first/last
  Accessibility: role="menubar", aria-label for accessible name; items are role="menuitem" tabindex="-1"
  Usage:
    <div
      class="menu-bar"
      role="menubar"
      aria-label=""
    >
    </div>
-->

<div
  class="menu-bar"
  role="menubar"
  aria-label=""
>
  <!-- Consumer provides role="menuitem" items -->
</div>

<script>
  // MenuBar behavior
  (function() {
    'use strict';
    document.querySelectorAll('.menu-bar').forEach(function(root) {
      root.addEventListener('keydown', function(e) {
        var items = Array.from(root.querySelectorAll("[role='menuitem']"));
        var index = items.indexOf(document.activeElement);
        if (e.key === 'ArrowRight') {
          e.preventDefault();
          if (items.length) items[index < items.length - 1 ? index + 1 : 0].focus();
        } else if (e.key === 'ArrowLeft') {
          e.preventDefault();
          if (items.length) items[index > 0 ? index - 1 : items.length - 1].focus();
        } else if (e.key === 'Home') {
          e.preventDefault();
          if (items.length) items[0].focus();
        } else if (e.key === 'End') {
          e.preventDefault();
          if (items.length) items[items.length - 1].focus();
        }
      });
    });
  })();
</script>
