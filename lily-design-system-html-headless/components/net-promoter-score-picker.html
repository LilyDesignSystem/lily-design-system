<!-- net-promoter-score-picker.html -->
<!-- NetPromoterScorePicker component -->
<!--
  Description: a picker for selecting a 0-10 Net Promoter Score
  HTML tag: <fieldset> (a radio group; the -picker suffix's <div> gives way to the native grouping element)
  CSS class: net-promoter-score-picker
  Keyboard: native radio group: Tab focuses the checked radio (or the first), the arrow keys move and check, Space checks
  Accessibility: role="radiogroup" with aria-label; eleven native radios, values 0 to 10, sharing one name
  Usage:
    <fieldset class="net-promoter-score-picker" role="radiogroup" aria-label="Example">
      <label><input type="radio" name="nps" value="0" aria-label="0" /> 0</label>
      ...
      <label><input type="radio" name="nps" value="10" aria-label="10" /> 10</label>
    </fieldset>
  Add checked to the radio of the starting value; a form reset then restores it natively.
-->

<fieldset
  class="net-promoter-score-picker"
  role="radiogroup"
  aria-label=""
>
  <label
    ><input
      type="radio"
      name="nps"
      value="0"
      aria-label="0"
    />
    0</label
  >

      type="radio"
      name="nps"
      value="1"
      aria-label="1"
    />
    1</label
  >
