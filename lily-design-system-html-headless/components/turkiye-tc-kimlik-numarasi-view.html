<!-- TurkiyeTcKimlikNumarasiView component -->
<!--
  Description: a read-only display of Turkey's T.C. Kimlik Numarasi
  HTML tag: <span>
  CSS class: turkiye-tc-kimlik-numarasi-view
  Keyboard: None (passive element)
  Accessibility: aria-label for accessible name
  Format: Eleven digits; digits 10-11 are computed check digits, the last always even.
  Usage:
    <span class="turkiye-tc-kimlik-numarasi-view" aria-label="T.C. Kimlik Numarası">value-here</span>
-->

<span
  class="turkiye-tc-kimlik-numarasi-view"
  aria-label="T.C. Kimlik Numarası"
></span>
