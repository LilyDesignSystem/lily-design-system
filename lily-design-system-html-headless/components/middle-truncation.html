<!-- MiddleTruncation component -->
<!--
  Description: a string shortened in the middle to fit its width, keeping the start and the end
  HTML tag: <span> holding two <span>s
  CSS class: middle-truncation (sub-elements: middle-truncation-visual, middle-truncation-full)
  Keyboard: None
  Accessibility: the shortened text is aria-hidden; the full text in .middle-truncation-full is what assistive technology,
    find-in-page and copy receive. The consumer's CSS bounds the root (display: block; overflow: hidden; white-space: nowrap)
    and visually hides .middle-truncation-full (clipped, never display: none).
  Attributes on the root: data-ellipsis (required, no default), data-strategy ("even" | "fixed-end" | "min-end"), data-end.
    The full text is written once, in .middle-truncation-full; the script copies it into the visual span and shortens it.
  Usage (see the markup below):
    <span class="middle-truncation" data-ellipsis="…" data-strategy="min-end" data-end="6">
      <span class="middle-truncation-visual" aria-hidden="true">quarterly-report-final-version-3.pdf</span>
      <span class="middle-truncation-full">quarterly-report-final-version-3.pdf</span>
    </span>
-->
