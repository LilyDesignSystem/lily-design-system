<!-- contextual-help.html -->
<!-- ContextualHelp component -->
<!--
  Description: a help button that opens a popover with explanatory content

  HTML tag: <div>
  CSS class: contextual-help
  Keyboard: Tab to focus the trigger button; Enter or Space toggles the panel;
            Escape closes it.
  Accessibility: trigger button has aria-label (its accessible name),
                 aria-haspopup="dialog", aria-expanded and aria-controls
                 referencing the panel; panel has role="dialog".

  Behavior:
    No script is needed to open it. The panel is popover="auto" (top layer,
    light dismiss, Escape) and the trigger names it with
    command="toggle-popover" commandfor (Chrome 135, Firefox 144, Safari 26.2)
    and popovertarget (Chrome 114, Firefox 125, Safari 17), so the browser
    opens and closes it. The embedded script keeps aria-expanded in step with
    the panel's toggle event, and where the Popover API is missing falls back
    to toggling the `hidden` attribute.

  Text: the trigger's visible text (here "?") is the consumer's — use the
    glyph for your script and locale ("?", "؟", …), or leave it empty and draw
    an icon in CSS. aria-label carries the accessible name.

  Usage:
    <div class="contextual-help">
      <button class="contextual-help-trigger" type="button"
              aria-label="Help"
              aria-haspopup="dialog"
              aria-controls="contextual-help-panel-1"
              command="toggle-popover"
              commandfor="contextual-help-panel-1"
              popovertarget="contextual-help-panel-1">?</button>
      <div class="contextual-help-panel" id="contextual-help-panel-1"
           role="dialog" popover="auto">
        … consumer popover content …
      </div>
    </div>
-->

<div class="contextual-help">
  <button
    class="contextual-help-trigger"
    type="button"
    aria-label=""
    aria-haspopup="dialog"
    aria-controls="contextual-help-panel-1"
    command="toggle-popover"
    commandfor="contextual-help-panel-1"
    popovertarget="contextual-help-panel-1"
  ><!-- Consumer provides the trigger text, such as "?" --></button>

  <div
    class="contextual-help-panel"
    id="contextual-help-panel-1"
    role="dialog"
    popover="auto"
  >
    <!-- Consumer provides popover content -->
  </div>
</div>

<script>
  // ContextualHelp behavior
  // Opening, closing, Escape and light dismiss are the browser's: popover="auto"
  // and a trigger with command="toggle-popover" commandfor (or popovertarget)
  // need no script. This script only (1) keeps aria-expanded on each trigger in
  // step with the panel's toggle event and (2) where the Popover API is missing
  // (browsers before Chrome 114, Firefox 125, Safari 17) falls back to the
  // hidden attribute, a click toggle and Escape. Pure vanilla JavaScript.
  (function () {
    "use strict";

    var native = typeof HTMLElement.prototype.showPopover === "function";

    document.querySelectorAll("div.contextual-help-panel").forEach(function (panel) {
      if (!panel.id) return;
      var triggers = Array.prototype.slice.call(
        document.querySelectorAll(
          '[commandfor="' + panel.id + '"], [popovertarget="' + panel.id + '"]'
        )
      ).filter(function (t) {
        var command = t.getAttribute("command");
        return !command || command === "toggle-popover";
      });

      function setExpanded(open) {
        triggers.forEach(function (t) {
          t.setAttribute("aria-expanded", open ? "true" : "false");
        });
      }

      if (native) {
        setExpanded(panel.matches(":popover-open"));
        panel.addEventListener("toggle", function (event) {
          setExpanded(event.newState === "open");
        });
        return;
      }

      // Fallback: no Popover API.
      panel.removeAttribute("popover");
      panel.setAttribute("hidden", "");
      setExpanded(false);
      function show(open) {
        if (open) panel.removeAttribute("hidden");
        else panel.setAttribute("hidden", "");
        setExpanded(open);
      }
      triggers.forEach(function (t) {
        t.addEventListener("click", function () {
          if (t.disabled) return;
          show(panel.hasAttribute("hidden"));
        });
      });
      panel.addEventListener("keydown", function (event) {
        if (event.key === "Escape" && !panel.hasAttribute("hidden")) {
          show(false);
          if (triggers[0]) triggers[0].focus();
        }
      });
    });
  })();
</script>
