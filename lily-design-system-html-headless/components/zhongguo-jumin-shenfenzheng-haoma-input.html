<!-- ZhongguoJuminShenfenzhengHaomaInput component -->
<!--
  Description: an input for entering China's Resident Identity Card Number
  HTML tag: <input>
  CSS class: zhongguo-jumin-shenfenzheng-haoma-input
  Keyboard: Tab to focus, standard input keyboard interactions
  Accessibility: Implicit input role, aria-label for accessible name
  Format: Eighteen characters (GB 11643): region, date of birth, sequence with sex parity, then an ISO 7064 MOD 11-2 check character (may be X).
  Usage:
    <input class="zhongguo-jumin-shenfenzheng-haoma-input" type="text" aria-label="居民身份证号码 (Jūmín Shēnfènzhèng Hàomǎ)" autocomplete="off">
-->

<input
  class="zhongguo-jumin-shenfenzheng-haoma-input"
  type="text"
  aria-label="居民身份证号码 (Jūmín Shēnfènzhèng Hàomǎ)"
  autocomplete="off"
>
