<!-- AustraliaTaxFileNumberInput component -->
<!--
  Description: an input for entering Australia's Tax File Number (TFN)
  HTML tag: <input>
  CSS class: australia-tax-file-number-input
  Keyboard: Tab to focus, standard input keyboard interactions
  Accessibility: Implicit input role, aria-label for accessible name
  Format: 7-8 digits plus a Modulus-11 check character (0-9 or K).
  Usage:
    <input class="australia-tax-file-number-input" type="text" aria-label="Tax File Number (TFN)" autocomplete="off">
-->

<input
  class="australia-tax-file-number-input"
  type="text"
  aria-label="Tax File Number (TFN)"
  autocomplete="off"
  spellcheck="false"
/>
