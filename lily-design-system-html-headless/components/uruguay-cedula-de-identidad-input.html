<!-- UruguayCedulaDeIdentidadInput component -->
<!--
  Description: an input for entering Uruguay's Cedula de Identidad Number
  HTML tag: <input>
  CSS class: uruguay-cedula-de-identidad-input
  Keyboard: Tab to focus, standard input keyboard interactions
  Accessibility: Implicit input role, aria-label for accessible name
  Format: 7-8 digits plus a Modulus-11 check character (0-9 or K).
  Usage:
    <input class="uruguay-cedula-de-identidad-input" type="text" aria-label="Cedula de Identidad Number" autocomplete="off">
-->

<input
  class="uruguay-cedula-de-identidad-input"
  type="text"
  aria-label="Cedula de Identidad Number"
  autocomplete="off"
/>
