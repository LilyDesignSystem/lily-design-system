<!-- dialog.html -->
<!-- Dialog component -->
<!--
  Description: a modal or non-modal dialog window
  HTML tag: <dialog>
  CSS class: dialog
  Keyboard: Escape closes (also the native cancel event); Tab is trapped by showModal()
  Accessibility: role="dialog", aria-label for accessible name, aria-modal, tabindex="-1"
  Usage:
    <dialog
      class="dialog"
      role="dialog"
      tabindex="-1"
      aria-label=""
      aria-modal="true"
    >
    </dialog>
-->

<dialog
  class="dialog"
  role="dialog"
  tabindex="-1"
  aria-label=""
  aria-modal="true"
>
  <!-- Consumer provides dialog content -->
</dialog>

<script>
  // Dialog behavior
  (function() {
    'use strict';
    document.querySelectorAll('.dialog').forEach(function(el) {
      function close() {
        if (typeof el.close === 'function') el.close();
        else el.removeAttribute('open');
      }
      el.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') {
          e.preventDefault();
          close();
        }
      });
      el.addEventListener('cancel', function(e) {
        e.preventDefault();
        close();
      });
    });
  })();
</script>
