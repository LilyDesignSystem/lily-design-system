<!-- IranKodEMelliView component -->
<!--
  Description: a read-only display of Iran's National Code (Kod-e Melli)
  HTML tag: <span>
  CSS class: iran-kod-e-melli-view
  Keyboard: None (passive element)
  Accessibility: aria-label for accessible name
  Format: 7-8 digits plus a Modulus-11 check character (0-9 or K).
  Usage:
    <span class="iran-kod-e-melli-view" aria-label="National Code (Kod-e Melli)">value-here</span>
-->

<span
  class="iran-kod-e-melli-view"
  aria-label="National Code (Kod-e Melli)"
></span>
