<!-- Avatar component -->
<!--
  Description: an avatar indicator that shows an avatar image or avatar text
  HTML tag: <span>
  CSS class: avatar
  Keyboard: None (passive element)
  Accessibility: aria-label for accessible name
  Usage:
    <span class="avatar" aria-label="Example">
      ...
    </span>
-->

<span
  class="avatar"
  role="img"
  aria-label=""
>
  <!-- Consumer provides content -->
</span>
