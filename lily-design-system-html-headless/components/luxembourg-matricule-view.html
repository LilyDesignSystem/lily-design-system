<!-- luxembourg-matricule-view.html -->
<!-- LuxembourgMatriculeView component -->
<!--
  Description: a read-only display of Luxembourg's Numero d'Identification Nationale (Matricule)
  HTML tag: <span>
  CSS class: luxembourg-matricule-view
  Keyboard: None (passive element)
  Accessibility: aria-label for accessible name
  Format: Thirteen digits, YYYYMMDDNNNCC: date of birth, sequence number, a Luhn check digit, then a Verhoeff check digit.
  Usage:
    <span class="luxembourg-matricule-view" aria-label="Numéro d'Identification Nationale (Matricule)">value-here</span>
-->

<span
  class="luxembourg-matricule-view"
  aria-label="Numéro d'Identification Nationale (Matricule)"
></span>
