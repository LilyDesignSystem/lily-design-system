<!-- luxembourg-matricule-view.html -->
<!-- LuxembourgMatriculeView component -->
<!--
  Description: a read-only display of Luxembourg's Numero d'Identification Nationale (Matricule)
  HTML tag: <span>
  CSS class: luxembourg-matricule-view
  Keyboard: None (passive element)
  Accessibility: a visible caption names the value, or the screen-reader-span does. A plain span cannot take aria-label
  Format: Thirteen digits, YYYYMMDDNNNCC: date of birth, sequence number, a Luhn check digit, then a Verhoeff check digit.
  Usage:
    <span class="luxembourg-matricule-view">value-here</span>
-->

<span class="luxembourg-matricule-view"
  ><span class="screen-reader-span">Numéro d'Identification Nationale (Matricule) </span></span
>
