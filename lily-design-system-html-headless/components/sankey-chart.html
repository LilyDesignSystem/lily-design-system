<!-- sankey-chart.html -->
<!-- SankeyChart component -->
<!--
  Description: a headless wrapper for a flow chart where link width encodes the quantity moving between nodes.
    Wraps a consumer-supplied inline <svg>; no drawing happens here.
  HTML tag: <figure role="img">
  CSS class: sankey-chart
  Keyboard: None (the chart is a single image to assistive technology)
  Accessibility: role="img" exposes the chart as one image; aria-label names it
    (required, consumer-supplied); aria-describedby should reference a text
    description or a real <table> carrying the same data.
  Usage:
    <figure
      class="sankey-chart"
      role="img"
      aria-label="Example"
      aria-describedby="sankey-chart-desc"
    >
      <!-- Consumer provides the inline svg; no drawing happens in this component. -->
      <svg data-testid="art" viewBox="0 0 10 10"><circle r="4" cx="5" cy="5"></circle></svg>
    </figure>
    <!-- Text description or real <table> carrying the same data, referenced by aria-describedby -->
    <p id="sankey-chart-desc">Example description</p>
-->

<figure
  class="sankey-chart"
  role="img"
  aria-label="Example"
  aria-describedby="sankey-chart-desc"
>
  <!-- Consumer provides the inline svg; no drawing happens in this component. -->
  <svg data-testid="art" viewBox="0 0 10 10"><circle r="4" cx="5" cy="5"></circle></svg>
</figure>
<!-- Text description or real <table> carrying the same data, referenced by aria-describedby -->
<p id="sankey-chart-desc">Example description</p>
