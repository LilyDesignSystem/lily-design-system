<!-- hamburger-menu.html -->
<!-- HamburgerMenu component -->
<!--
  Description: a toggle button that opens a mobile navigation menu
  HTML tag: <div>
  CSS class: hamburger-menu (hamburger-menu-button, hamburger-menu-nav)
  Keyboard: Enter or Space on the button toggles; Tab moves into the navigation when open
  Accessibility: button: aria-label, aria-expanded, aria-controls; navigation: aria-label, hidden while closed
  Usage:
    Give each menu its own nav id, and the same two labels their words.
-->

<div class="hamburger-menu">
  <button
    class="hamburger-menu-button"
    type="button"
    aria-label=""
    aria-expanded="false"
    aria-controls="hamburger-menu-nav-1"
  >
    <!-- Consumer provides the icon -->
  </button>
  <nav
    class="hamburger-menu-nav"
    id="hamburger-menu-nav-1"
    aria-label=""
    hidden
  >
    <!-- Consumer provides navigation content -->
  </nav>
</div>

<script>
  // HamburgerMenu behavior
  (function() {
    'use strict';
    document.querySelectorAll('.hamburger-menu').forEach(function(el) {
      var button = el.querySelector('.hamburger-menu-button');
      var nav = el.querySelector('.hamburger-menu-nav');
      if (!button || !nav) return;
      button.addEventListener('click', function() {
        var open = button.getAttribute('aria-expanded') !== 'true';
        button.setAttribute('aria-expanded', String(open));
        nav.hidden = !open;
      });
    });
  })();
</script>
