<!-- allergy-list-item.html -->
<!-- AllergyListItem component -->
<!--
  Description: one allergy or intolerance in an allergy list, with substance, reaction, severity and last update
  HTML tag: <li>
  CSS class: allergy-list-item (parts: allergy-list-item-substance, -reaction, -severity, -updated)
  Spec: spec/healthcare-ui
  Attributes: data-severity (mild, moderate, severe: the FHIR AllergyIntolerance reaction severity). The severity is
    also text. The substance is never truncated. .allergy-list-item-updated is a <time datetime>.
-->

<ul class="allergy-list" data-status="known" aria-label="Known allergies"><li class="allergy-list-item" data-severity="severe"><span class="allergy-list-item-substance">Penicillin</span> <span class="allergy-list-item-reaction">Anaphylaxis</span> <span class="allergy-list-item-severity">Severe</span> <time class="allergy-list-item-updated" datetime="2026-11-03">Updated 3 Nov 2026</time></li></ul>
