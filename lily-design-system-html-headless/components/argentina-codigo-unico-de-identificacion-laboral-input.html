<!-- ArgentinaCodigoUnicoDeIdentificacionLaboralInput component -->
<!--
  Description: an input for entering Argentina's Codigo Unico de Identificacion Laboral (CUIL)
  HTML tag: <input>
  CSS class: argentina-codigo-unico-de-identificacion-laboral-input
  Keyboard: Tab to focus, standard input keyboard interactions
  Accessibility: Implicit input role, aria-label for accessible name
  Format: XX-NNNNNNNN-X: prefix, 8-digit DNI, Modulus-11 check digit.
  Usage:
    <input class="argentina-codigo-unico-de-identificacion-laboral-input" type="text" aria-label="Código Único de Identificación Laboral (CUIL)" autocomplete="off">
-->

<input
  class="argentina-codigo-unico-de-identificacion-laboral-input"
  type="text"
  aria-label="Código Único de Identificación Laboral (CUIL)"
  autocomplete="off"
>
