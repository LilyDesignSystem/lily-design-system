<!-- SouthAfricaIdentityNumberInput component -->
<!--
  Description: an input for entering South Africa's Identity Number
  HTML tag: <input>
  CSS class: south-africa-identity-number-input
  Keyboard: Tab to focus, standard input keyboard interactions
  Accessibility: Implicit input role, aria-label for accessible name
  Format: Thirteen digits in the form YYMMDDSSSSCAZ: the first six encode date of birth; the next four encode sex (0000-4999 female, 5000-9999 male); the eleventh digit encodes citizenship status (0 citizen, 1 permanent resident, 2 refugee); the twelfth is a legacy field fixed at 8 on modern cards; the thirteenth is a Luhn (Modulus-10) check digit over the preceding twelve.
  Usage:
    <input class="south-africa-identity-number-input" type="text" aria-label="South African Identity Number" autocomplete="off">
-->

<input
  class="south-africa-identity-number-input"
  type="text"
  aria-label="South African Identity Number"
  autocomplete="off"
>
