<!-- IndonesiaNomorIndukKependudukanInput component -->
<!--
  Description: an input for entering Indonesia's Nomor Induk Kependudukan (NIK)
  HTML tag: <input>
  CSS class: indonesia-nomor-induk-kependudukan-input
  Keyboard: Tab to focus, standard input keyboard interactions
  Accessibility: Implicit input role, aria-label for accessible name
  Format: Sixteen digits: region, date of birth (+40 to day for females), serial. No check digit.
  Usage:
    <input class="indonesia-nomor-induk-kependudukan-input" type="text" aria-label="Nomor Induk Kependudukan (NIK)" autocomplete="off">
-->

<input
  class="indonesia-nomor-induk-kependudukan-input"
  type="text"
  aria-label="Nomor Induk Kependudukan (NIK)"
  autocomplete="off"
>
