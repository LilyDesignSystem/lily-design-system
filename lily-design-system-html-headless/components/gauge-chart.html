<!-- gauge-chart.html -->
<!-- GaugeChart component -->
<!--
  Description: a headless wrapper for a dial chart showing one value within a range, with optional thresholds.
    Wraps a consumer-supplied inline <svg>; no drawing happens here.
  HTML tag: <figure> containing <div class="gauge-chart-graphic" role="img">
  CSS class: gauge-chart (sub-elements: gauge-chart-graphic, gauge-chart-data-table)
  Keyboard: None on the graphic; the data table follows native table behaviour
  Accessibility: the graphic wrapper carries role="img" and the required
    consumer-supplied aria-label; aria-describedby (optional) references a text
    description. The optional data table is a sibling of the graphic, outside
    role="img", so assistive technology can reach it.
  Usage (see the markup below for the commented version):
    <figure class="gauge-chart">
        <div class="gauge-chart-graphic" role="img" aria-label="Example" aria-describedby="gauge-chart-desc">
            <svg data-testid="art" viewBox="0 0 10 10"><circle r="4" cx="5" cy="5"></circle></svg>
      </div>
        <div class="gauge-chart-data-table">
        <table>
          <caption>Values</caption>
          <tbody><tr><th scope="row">A</th><td>1</td></tr></tbody>
        </table>
      </div>
    </figure>
    <p id="gauge-chart-desc">Example description</p>
-->

<figure class="gauge-chart">
  <!-- role="img" lives on the graphic wrapper, never on the figure: it makes
       its descendants presentational, so a data table inside it would be
       invisible to assistive technology. -->
  <div class="gauge-chart-graphic" role="img" aria-label="Example" aria-describedby="gauge-chart-desc">
    <!-- Consumer provides the inline svg; no drawing happens in this component. -->
    <svg data-testid="art" viewBox="0 0 10 10"><circle r="4" cx="5" cy="5"></circle></svg>
  </div>
  <!-- Optional accessible table alternative: a SIBLING of the graphic, outside role="img". -->
  <div class="gauge-chart-data-table">
    <table>
      <caption>Values</caption>
      <tbody><tr><th scope="row">A</th><td>1</td></tr></tbody>
    </table>
  </div>
</figure>
<!-- Optional short text description referenced by aria-describedby on the graphic -->
<p id="gauge-chart-desc">Example description</p>
