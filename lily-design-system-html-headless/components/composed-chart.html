<!-- composed-chart.html -->
<!-- ComposedChart component -->
<!--
  Description: a chart that combines several chart types, such as bars and a line, on shared axes.
    Wraps a consumer-supplied inline <svg>; no drawing happens here.
  HTML tag: <figure> containing <div class="composed-chart-graphic" role="img">
  CSS class: composed-chart (sub-elements: composed-chart-graphic, composed-chart-data-table)
  Keyboard: None on the graphic; the data table follows native table behaviour
  Accessibility: the graphic wrapper carries role="img" and the consumer-supplied
    aria-label; the optional data table is a sibling of the graphic, outside
    role="img", so assistive technology can reach it.
  Usage (see the markup below for the commented version):
    <figure class="composed-chart">
        <div class="composed-chart-graphic" role="img" aria-label="Example">
            <svg data-testid="art" viewBox="0 0 10 10"><circle r="4" cx="5" cy="5"></circle></svg>
      </div>
        <div class="composed-chart-data-table">
        <table>
          <caption>Values</caption>
          <tbody><tr><th scope="row">A</th><td>1</td></tr></tbody>
        </table>
      </div>
    </figure>
-->

<figure class="composed-chart">
  <!-- role="img" lives on the graphic wrapper, never on the figure: it makes
       its descendants presentational, so a data table inside it would be
       invisible to assistive technology. -->
  <div class="composed-chart-graphic" role="img" aria-label="Example">
    <!-- Consumer provides the inline svg; no drawing happens in this component. -->
    <svg data-testid="art" viewBox="0 0 10 10"><circle r="4" cx="5" cy="5"></circle></svg>
  </div>
  <!-- Optional accessible table alternative: a SIBLING of the graphic, outside role="img". -->
  <div class="composed-chart-data-table">
    <table>
      <caption>Values</caption>
      <tbody><tr><th scope="row">A</th><td>1</td></tr></tbody>
    </table>
  </div>
</figure>
