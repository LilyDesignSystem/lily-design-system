<!-- tool-call-status.html -->
<!-- ToolCallStatus component -->
<!--
  Description: the status of a tool call as a word, such as pending, running, done or error.
  HTML tag: <span>
  CSS class: tool-call-status
  Contract: `status` (optional) sets `data-status`; the visible status word is the children (consumer text, never colour alone)
-->

<span class="tool-call-status" data-status="running">Running</span>
