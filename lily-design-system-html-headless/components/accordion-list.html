<!-- AccordionList component -->
<!--
  Description: a grouped container of accordion list item components
  HTML tag: <ol>, of accordion-list-item <li>s each holding a <details>
  CSS class: accordion-list
  Keyboard: None (passive element)
  Accessibility: native list semantics; optional aria-label
  Usage:
    <ol class="accordion-list" aria-label="Example">
      <li class="accordion-list-item"><details><summary>…</summary>…</details></li>
    </ol>
-->

<ol
  class="accordion-list"
  aria-label=""
>
  <!-- Consumer provides accordion list items -->
</ol>
