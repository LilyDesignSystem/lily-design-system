<!-- VietNamCanCuocCongDanInput component -->
<!--
  Description: an input for entering Viet Nam's Citizen Identification Number (CCCD)
  HTML tag: <input>
  CSS class: viet-nam-can-cuoc-cong-dan-input
  Keyboard: Tab to focus, standard input keyboard interactions
  Accessibility: Implicit input role, aria-label for accessible name
  Format: 7-8 digits plus a Modulus-11 check character (0-9 or K).
  Usage:
    <input class="viet-nam-can-cuoc-cong-dan-input" type="text" aria-label="Citizen Identification Number (CCCD)" autocomplete="off">
-->

<input
  class="viet-nam-can-cuoc-cong-dan-input"
  type="text"
  aria-label="Citizen Identification Number (CCCD)"
  autocomplete="off"
  spellcheck="false"
/>
