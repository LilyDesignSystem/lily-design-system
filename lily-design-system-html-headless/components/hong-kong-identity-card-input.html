<!-- HongKongIdentityCardInput component -->
<!--
  Description: an input for entering Hong Kong's Identity Card Number
  HTML tag: <input>
  CSS class: hong-kong-identity-card-input
  Keyboard: Tab to focus, standard input keyboard interactions
  Accessibility: Implicit input role, aria-label for accessible name
  Format: 7-8 digits plus a Modulus-11 check character (0-9 or K).
  Usage:
    <input class="hong-kong-identity-card-input" type="text" aria-label="Hong Kong Identity Card Number" autocomplete="off">
-->

<input
  class="hong-kong-identity-card-input"
  type="text"
  aria-label="Hong Kong Identity Card Number"
  autocomplete="off"
/>
