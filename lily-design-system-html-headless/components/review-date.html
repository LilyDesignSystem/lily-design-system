<!-- review-date.html -->
<!-- ReviewDate component -->
<!--
  Description: a display of a content review date
  HTML tag: <time>
  CSS class: review-date
  Keyboard: None (passive element)
  Accessibility: aria-label gives context; datetime is the ISO 8601 machine-readable date
  Usage: replace the aria-label and datetime values and the visible text
-->

<time class="review-date" aria-label="Last reviewed" datetime="2026-10-06">6 October 2026</time>
