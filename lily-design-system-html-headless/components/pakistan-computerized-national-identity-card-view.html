<!-- PakistanComputerizedNationalIdentityCardView component -->
<!--
  Description: a read-only display of Pakistan's Computerized National Identity Card Number (CNIC)
  HTML tag: <span>
  CSS class: pakistan-computerized-national-identity-card-view
  Keyboard: None (passive element)
  Accessibility: aria-label for accessible name
  Format: 7-8 digits plus a Modulus-11 check character (0-9 or K).
  Usage:
    <span class="pakistan-computerized-national-identity-card-view" aria-label="Computerized National Identity Card Number (CNIC)">value-here</span>
-->

<span
  class="pakistan-computerized-national-identity-card-view"
  aria-label="Computerized National Identity Card Number (CNIC)"
></span>
