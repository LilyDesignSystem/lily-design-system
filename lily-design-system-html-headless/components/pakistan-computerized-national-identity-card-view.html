<!-- PakistanComputerizedNationalIdentityCardView component -->
<!--
  Description: a read-only display of Pakistan's Computerized National Identity Card Number (CNIC)
  HTML tag: <span>
  CSS class: pakistan-computerized-national-identity-card-view
  Keyboard: None (passive element)
  Accessibility: a visible caption names the value, or the screen-reader-span does. A plain span cannot take aria-label
  Format: 7-8 digits plus a Modulus-11 check character (0-9 or K).
  Usage:
    <span class="pakistan-computerized-national-identity-card-view">value-here</span>
-->

<span class="pakistan-computerized-national-identity-card-view"
  ><span class="screen-reader-span">Computerized National Identity Card Number (CNIC) </span></span
>
