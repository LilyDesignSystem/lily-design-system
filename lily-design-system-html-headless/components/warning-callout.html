<!-- WarningCallout component -->
<!--
  Description: a callout box highlighting a warning message
  HTML tag: <aside>
  CSS class: warning-callout
  Keyboard: None (passive element)
  Accessibility: aria-label for accessible name
  Usage:
    <aside class="warning-callout" aria-label="Example">
      ...
    </aside>
-->

<aside
  class="warning-callout"
  role="alert"
  aria-label=""
>
  <!-- Consumer provides content -->
</aside>
