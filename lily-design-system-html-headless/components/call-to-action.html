<!-- CallToAction component -->
<!--
  Description: a prominent prompt encouraging user action
  HTML tag: <a> when it navigates, else <button type="button">
  CSS class: call-to-action
  Keyboard: Tab focuses it; Enter activates (and Space, on the button)
  Accessibility: native link or button; aria-label only when the text is not enough
  Usage:
    <a class="call-to-action" href="/signup">Sign up now</a>
    <button class="call-to-action" type="button">Start</button>
-->

<a
  class="call-to-action"
  href=""
>
  <!-- Consumer provides content -->
</a>
