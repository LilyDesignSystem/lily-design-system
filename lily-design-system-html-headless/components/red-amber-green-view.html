<!-- RedAmberGreenView component -->
<!--
  Description: a read-only display of a red/amber/green status
  HTML tag: <span>
  CSS class: red-amber-green-view
  Keyboard: None (passive element)
  Accessibility: a visible caption names the value, or the screen-reader-span does. A plain span cannot take aria-label
  Usage:
    <span class="red-amber-green-view" data-value="green">
      ...
    </span>
-->

<span class="red-amber-green-view" data-value="green">
  <!-- Consumer provides text content -->
</span>
