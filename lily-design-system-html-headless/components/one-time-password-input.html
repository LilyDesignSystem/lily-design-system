<!-- one-time-password-input.html -->
<!-- OneTimePasswordInput component -->
<!--
  Description: a single-line input for a one-time passcode (SMS / authenticator code). One real
    <input>, not segmented boxes, so SMS autofill and paste work.
  HTML tag: <input>
  CSS class: one-time-password-input
  Keyboard: native text input only
  Accessibility: aria-label for accessible name (supply the localized text); no hardcoded strings
  Attributes:
    maxlength    the code length; the consumer decides (also mirrored as data-length)
    inputmode    "numeric" by default; use "text" for alphanumeric codes
    pattern      "[0-9]*" by default; change together with inputmode
    autocomplete "one-time-code" (enables OS autofill)
    name, required, disabled, and any other attribute pass through on the root
  Usage:
    <input class="one-time-password-input" type="text" inputmode="numeric"
      autocomplete="one-time-code" maxlength="6" pattern="[0-9]*" spellcheck="false"
      autocapitalize="off" aria-label="Verification code" data-length="6" name="code">
-->

<input
  class="one-time-password-input"
  type="text"
  inputmode="numeric"
  autocomplete="one-time-code"
  maxlength="6"
  pattern="[0-9]*"
  spellcheck="false"
  autocapitalize="off"
  aria-label="Verification code"
  data-length="6"
  name="code"
>
