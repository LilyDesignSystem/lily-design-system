<!-- medication-view.html -->
<!-- MedicationView component -->
<!--
  Description: a read-only display of a medicine, with its name, strength, form, route and frequency
  HTML tag: <span>
  CSS class: medication-view (parts: medication-view-name, -tall-man, -strength, -form, -route, -frequency)
  Spec: spec/healthcare-ui
  Tall man letters are marked by the consumer, as .medication-view-tall-man spans inside the name; Lily ships no tall
    man list. The strength is written the safe way by the consumer (5 mg, never 5.0 mg; 0.5 mg, never .5 mg). No part
    is ever truncated.
-->

<span class="medication-view"><span class="medication-view-name">hydr<span class="medication-view-tall-man">ALAZINE</span></span> <span class="medication-view-strength">25&#160;mg</span> <span class="medication-view-form">tablet</span> <span class="medication-view-route">oral</span> <span class="medication-view-frequency">twice daily</span></span>
