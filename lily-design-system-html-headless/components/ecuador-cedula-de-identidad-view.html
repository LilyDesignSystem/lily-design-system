<!-- EcuadorCedulaDeIdentidadView component -->
<!--
  Description: a read-only display of Ecuador's Cedula de Identidad Number
  HTML tag: <span>
  CSS class: ecuador-cedula-de-identidad-view
  Keyboard: None (passive element)
  Accessibility: aria-label for accessible name
  Format: 7-8 digits plus a Modulus-11 check character (0-9 or K).
  Usage:
    <span class="ecuador-cedula-de-identidad-view" aria-label="Cedula de Identidad Number">value-here</span>
-->

<span
  class="ecuador-cedula-de-identidad-view"
  aria-label="Cedula de Identidad Number"
></span>
