<!-- slider.html -->
<!-- Slider component -->
<!--
  Description: a draggable control for selecting a value along a track
  HTML tag: <input type="range">
  CSS class: slider
  Keyboard: the native range input's: Tab to focus, the arrow keys, Home, End, PageUp and PageDown adjust the value
  Accessibility: the input's implicit slider role, with aria-label for its name
  Usage:
    <input class="slider" type="range" aria-label="Example" min="0" max="100" value="50" />
-->

<input
  class="slider"
  type="range"
  aria-label=""
  min="0"
  max="100"
  value="50"
/>
