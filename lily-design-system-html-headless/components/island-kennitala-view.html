<!-- IslandKennitalaView component -->
<!--
  Description: a read-only display of Iceland's Kennitala
  HTML tag: <span>
  CSS class: island-kennitala-view
  Keyboard: None (passive element)
  Accessibility: a visible caption names the value, or the screen-reader-span does. A plain span cannot take aria-label
  Format: 10 digits where the first 6 are the date of birth (DDMMYY)
  Usage:
    <span class="island-kennitala-view">value-here</span>
-->

<span class="island-kennitala-view"
  ><span class="screen-reader-span">Personal Identity Code </span></span
>
