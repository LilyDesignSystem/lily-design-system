<!-- ChileRolUnicoNacionalInput component -->
<!--
  Description: an input for entering Chile's Rol Unico Nacional (RUN)
  HTML tag: <input>
  CSS class: chile-rol-unico-nacional-input
  Keyboard: Tab to focus, standard input keyboard interactions
  Accessibility: Implicit input role, aria-label for accessible name
  Format: 7-8 digits plus a Modulus-11 check character (0-9 or K).
  Usage:
    <input class="chile-rol-unico-nacional-input" type="text" aria-label="Rol Único Nacional (RUN)" autocomplete="off">
-->

<input
  class="chile-rol-unico-nacional-input"
  type="text"
  aria-label="Rol Único Nacional (RUN)"
  autocomplete="off"
>
