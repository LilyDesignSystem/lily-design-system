<!doctype html>
<!--
    Example 1 — Basic usage.

    The minimum viable picker: a label and a slug list. The control
    resolves "medium" as the initial active size (since "medium" is in
    the list) and sets data-text-size="medium" on <html>. There is no
    themes-url / dynamic asset to load — text-size-picker only ever
    writes one data-* attribute; the CSS that actually resizes anything
    is yours (see the mapping below).

    The control is an icon button that opens a dropdown listbox
    (WAI-ARIA APG listbox pattern), not a native <select>.

    THE POSITIONING CSS IS NOT OPTIONAL. The package ships no CSS at
    all, so the <ul class="text-size-picker-list"> renders in normal
    flow and pushes the page down when it opens. The <style> block
    below is the minimum that makes it behave like a dropdown. Note the
    [hidden] rule: any `display` value on the list would override the
    user-agent `[hidden] { display: none }` and leave the closed list
    permanently visible.

    THE STATUS LINE IS PART OF THE PATTERN — copy it along with the
    control. The closed button shows only the "A" glyph, never the
    active size name, so without this line there is nowhere the current
    selection is announced or displayed. See docs/accessibility.md.

    Three things to note about it:

    1. It is VISIBLE by default, not sr-only. Sighted users get the
       same "what size am I on?" answer that screen-reader users do,
       which is what WCAG 2.2 AAA favours. For designs that genuinely
       cannot spare the space, swap the <p> for a visually-hidden
       variant (position: absolute; width: 1px; height: 1px;
       overflow: hidden; clip-path: inset(50%)) — keep the element in
       the accessibility tree; never use display: none or hidden.

    2. aria-live="polite" announces MUTATIONS only, so the region is
       silent on first paint and speaks once per change. That is the
       behaviour we want: no announcement on page load, a polite
       confirmation on every switch.

    3. The initial text is authored in the markup rather than written
       by JS on startup, which keeps first paint mutation-free (and so
       silent). It matches the resolved initial size — "medium", since
       this example sets no storage-key or default-value.
-->
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>text-size-picker — basic</title>
    <script type="module" src="/dist/text-size-picker.js"></script>
    <style>
        /* The CSS that actually resizes the page. Relative units on
           :root so every descendant inherits — a px font-size anywhere
           in the cascade opts that text out of the mechanism entirely
           (WCAG 1.4.4). */
        :root[data-text-size="small"] {
            font-size: 87.5%;
        }
        :root[data-text-size="medium"] {
            font-size: 100%;
        }
        :root[data-text-size="large"] {
            font-size: 112.5%;
        }
        :root[data-text-size="x-large"] {
            font-size: 125%;
        }

        /* The root is the positioning context for the dropdown. */
        .text-size-picker {
            position: relative;
            display: inline-block;
        }

        .text-size-picker-button {
            display: inline-flex;
            align-items: center;
            padding: 0.35rem 0.5rem;
            border: 1px solid currentColor;
            border-radius: 0.25rem;
            background: transparent;
            color: inherit;
            cursor: pointer;
            line-height: 1;
        }

        .text-size-picker-button:focus-visible,
        .text-size-picker-list:focus-visible {
            outline: 2px solid currentColor;
            outline-offset: 2px;
        }

        .text-size-picker-list {
            position: absolute;
            inset-block-start: calc(100% + 0.25rem);
            inset-inline-start: 0;
            z-index: 10;
            min-inline-size: 8rem;
            margin: 0;
            padding: 0.25rem 0;
            list-style: none;
            border: 1px solid currentColor;
            border-radius: 0.25rem;
            background: Canvas;
        }

        /* Any `display` rule above would beat the UA stylesheet's
           `[hidden] { display: none }`, so re-assert it here. */
        .text-size-picker-list[hidden] {
            display: none;
        }

        .text-size-picker-option {
            padding: 0.35rem 0.75rem;
            cursor: pointer;
        }

        /* The keyboard-highlighted option: where Enter would land.
           Focus stays on the <ul>, so :focus never matches an <li>. */
        .text-size-picker-option[data-active] {
            background: Highlight;
            color: HighlightText;
        }

        /* The chosen option: a deliberately different signal, since
           the two frequently disagree while the list is open. */
        .text-size-picker-option[aria-selected="true"]::after {
            content: " ✓";
        }
    </style>
</head>
<body>
    <h1>Text size picker — basic</h1>

    <text-size-picker
        label="Text size"
        sizes="small,medium,large,x-large"
    ></text-size-picker>

    <p class="text-size-picker-status" aria-live="polite">Text size: Medium</p>

    <p>Some body copy so the effect of switching sizes is visible.
       Resize with the control above and watch this paragraph scale.</p>

    <script type="module">
        await customElements.whenDefined("text-size-picker");

        const picker = document.querySelector("text-size-picker");
        const status = document.querySelector(".text-size-picker-status");

        // labelFor() is a public method on the element, so any
        // size-labels overrides are picked up for free and the status
        // line never shows a raw slug.
        picker.addEventListener("textsizechange", (e) => {
            status.textContent = `Text size: ${picker.labelFor(e.detail.size)}`;
        });
    </script>
</body>
</html>
