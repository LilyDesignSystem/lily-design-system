---
title: "Field: browser autocomplete"
components: [field, label, text-input]
tags: [form, autocomplete]
---

<!-- The autocomplete tokens let the browser fill known details (WCAG 1.3.5, Identify Input Purpose). -->
<div class="field">
  <label
    class="label"
    for="given-name"
    >Given name</label
  >
  <input
    class="text-input"
    type="text"
    id="given-name"
    name="given-name"
    autocomplete="given-name"
  />
</div>
<div class="field">
  <label
    class="label"
    for="family-name"
    >Family name</label
  >
  <input
    class="text-input"
    type="text"
    id="family-name"
    name="family-name"
    autocomplete="family-name"
  />
</div>
