allowBuilds:
  esbuild: true
  "@parcel/watcher": true
  sharp: true
  unrs-resolver: true
  better-sqlite3: true
minimumReleaseAgeExclude:
  - "@lilydesignsystem/vue-locale-picker@0.1.3"
  - "@lilydesignsystem/vue-text-size-picker@0.1.2"
  - "@lilydesignsystem/vue-theme-picker@0.1.2"
overrides:
  # @nuxt/devtools 3.x imports simple-git's default export, which the patched
  # simple-git 4.x line dropped (Dependabot alerts 580-583); devtools 4 no
  # longer depends on simple-git. Remove once nuxt depends on devtools 4.
  "@nuxt/devtools": 4.0.0-beta.4
