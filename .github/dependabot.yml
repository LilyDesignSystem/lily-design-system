# Dependabot configuration — Lily Design System™
#
# Scheduled dependency-update PRs (spec/dependabot/index.md). This is a large
# monorepo — 20 npm/pnpm entries (each catalog's pnpm-workspace.yaml lets
# one entry cover its nested helper packages too; the Svelte helper packages,
# one top-level subproject each, share one entry via `directories:`) and 10 standalone .NET
# project directories (NuGet has no workspace concept, so each .csproj gets
# its own entry) — so every directory groups all its updates into a single
# weekly PR (`groups: lily: patterns: ["*"]`) rather than one PR per package,
# which would otherwise be dozens of PRs a week for one maintainer to review.
# See also: repo-level Dependabot security updates, enabled via
# `gh api` (spec/dependabot/index.md's other half; not a file in this repo).

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/lily-design-system-angular-examples"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
    groups:
      lily:
        patterns:
          - "*"
    ignore:
      # TypeScript 7 is too new for parts of this ecosystem's build
      # tooling right now -- confirmed breakage in the Angular
      # directories (@analogjs/vite-plugin-angular's
      # ts.createPrinter usage) and vue-helpers (vue-tsc's internal
      # typescript/lib/tsc import), both from the same major bump.
      # Ignoring here too rather than accepting an unverified major
      # bump; revisit once this catalog's own TS 7 compatibility is
      # confirmed.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "npm"
    directory: "/lily-design-system-angular-headless"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
    groups:
      lily:
        patterns:
          - "*"
    ignore:
      # TypeScript 7.x removed the ts.createPrinter API
      # @analogjs/vite-plugin-angular's JS emitter depends on, which
      # breaks `vitest run` outright (TypeError: ts.createPrinter is
      # not a function). Revisit once @analogjs/vite-plugin-angular
      # ships TS 7 support — see the closed PR history for the
      # verification.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

