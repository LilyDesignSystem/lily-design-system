name: CI

# pnpm 11 everywhere (plan P7-T12): every pnpm/action-setup step below
# pins 11, matching this repo's own tooling and publish.yml. Each
# subproject's build-script allowlist lives in its own
# pnpm-workspace.yaml (`allowBuilds:`), the pnpm-11 location -- the
# legacy package.json#pnpm.onlyBuiltDependencies field pnpm 11 ignores
# has been removed everywhere it's redundant with that file.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same branch or pull request cancels the run it supersedes (tasks.md P24-T4).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Does this push change anything but Markdown? If not, the test matrices are skipped (they
  # report "skipped", which a required check accepts) and only verify, eslint + Prettier and
  # spell check run, since those read Markdown. Unknown history (a new branch, a force push)
  # counts as code.
  changes:
    name: changed files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "No usable base commit; treating the change as code."
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          other="$(git diff --name-only "$BASE...$HEAD" | grep -v '\.md$' || true)"
          if [ -n "$other" ]; then
            echo "Changed files other than Markdown:"
            echo "$other" | head -20
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "Markdown only; the test matrices are skipped."
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  verify:
    name: bin/test + link check + junk guard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      # The junk guard, the docs-site install, bin/test, check-links, the registries, coverage, class names and metadata.
      - run: bin/ci --job verify

  lint:
    # Repo-level ESLint (eslint.config.mjs, scope set by the root "lint" script).
    # Errors fail; warnings are reported only. Prettier (.prettierrc.json) is enforced by
    # `pnpm format:check` on the same libraries; run `pnpm format` to fix.
    name: eslint
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      # eslint, Prettier and the Alpine generator's --check.
      - run: bin/ci --job lint

  helper-packages:
    # Top-level helper packages, one subproject each (the *-helpers
    # catalogs dissolved into them, Svelte first, 2026-10-10). Each is its
    # own pnpm root; one that depends on a sibling resolves it in dev/test
    # from the sibling's built dist/, so bin/list-helper-packages gives the
    # build order, and each package builds before the next one tests.
    name: helper packages tests (${{ matrix.framework }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        framework:
          - svelte
          - react
          - vue
          - angular
          - html
          - web-components
          - nunjucks
          - alpine
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      # The repo root (its @types/node types every package's tests), the headless library they depend on, then each package
      # installed, built, checked and tested in dependency order.
      - run: bin/ci --job helper-packages ${{ matrix.framework }}

  headless:
    name: headless tests (${{ matrix.catalog }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        catalog:
          - lily-design-system-svelte-headless
          - lily-design-system-react-headless
          - lily-design-system-vue-headless
          - lily-design-system-angular-headless
          - lily-design-system-nunjucks-headless
          - lily-design-system-web-components-headless
          - lily-design-system-alpine-headless
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: ${{ matrix.catalog }}/pnpm-lock.yaml
      # Install, typecheck (where there is a check script; tasks.md P12-T1), build (tasks.md P22-T31) and test.
      - run: bin/ci --job headless ${{ matrix.catalog }}

  html-headless:
    name: headless tests (lily-design-system-html-headless, WebDriverIO)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: lily-design-system-html-headless/pnpm-lock.yaml
      # Install, typecheck and the WebDriverIO specs in headless Chrome.
      - run: bin/ci --job html-headless

  dotnet-tests:
    name: dotnet test (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: lily-design-system-blazor-headless
            csproj: tests/LilyBlazorHeadless.Tests/LilyBlazorHeadless.Tests.csproj
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ matrix.project }}-${{ hashFiles(format('{0}/**/*.csproj', matrix.project)) }}
          restore-keys: nuget-${{ matrix.project }}-
      # bin/ci also runs the JavaScript modules behind the components whose keys bUnit cannot run (tests/js), so it needs Node.
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - run: bin/ci --job dotnet-tests

  dotnet-helper-packages:
    # The Blazor helper packages, one top-level subproject each since
    # 2026-10-10, each with its own test project in tests/.
    name: dotnet test (Blazor helper packages)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-blazor-helper-packages-${{ hashFiles('lily-design-system-blazor-*/**/*.csproj') }}
          restore-keys: nuget-blazor-helper-packages-
      - run: bin/ci --job dotnet-helper-packages

  example-smoke:
    name: example-app Playwright smoke (svelte-sveltekit-examples)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: lily-design-system-svelte-sveltekit-examples/pnpm-lock.yaml
      - name: Install
        working-directory: lily-design-system-svelte-sveltekit-examples
        run: pnpm install --frozen-lockfile
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ hashFiles('lily-design-system-svelte-sveltekit-examples/pnpm-lock.yaml') }}
      - name: Install Playwright browsers (Chromium, Firefox, WebKit)
        working-directory: lily-design-system-svelte-sveltekit-examples
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        timeout-minutes: 10
        run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Install Playwright OS deps only (browser cached)
        working-directory: lily-design-system-svelte-sveltekit-examples
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        timeout-minutes: 10
        run: pnpm exec playwright install-deps chromium firefox webkit
      # Accessibility, responsive, /components search, rtl-demo and book-an-appointment.
      - run: bin/ci --job example-smoke

  eleventy-example:
    # Nothing built this app in CI, and it went unbuildable for weeks
    # (2026-09-16 to 2026-10-10) without anyone noticing. Its build fails
    # on a missing headless directory or picker script, and the full
    # Playwright suite visits every component page in components.tsv.
    name: example-app build + Playwright (nunjucks-eleventy-examples)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: lily-design-system-nunjucks-eleventy-examples/pnpm-lock.yaml
      - name: Install
        working-directory: lily-design-system-nunjucks-eleventy-examples
        run: pnpm install --frozen-lockfile
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ hashFiles('lily-design-system-nunjucks-eleventy-examples/pnpm-lock.yaml') }}
      - name: Install Playwright browsers (Chromium, Firefox, WebKit)
        working-directory: lily-design-system-nunjucks-eleventy-examples
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        timeout-minutes: 10
        run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Install Playwright OS deps only (browser cached)
        working-directory: lily-design-system-nunjucks-eleventy-examples
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        timeout-minutes: 10
        run: pnpm exec playwright install-deps chromium firefox webkit
      # Builds the locale and date-time pickers the site serves, builds the site, and runs every Playwright spec.
      - run: bin/ci --job eleventy-example

  alpine-examples:
    # The Alpine.js example site is generated from components.tsv, the Alpine headless snippets and the four Alpine
    # helpers; vitest mounts every demo under Alpine, and Playwright + axe visits every page in Chromium.
    name: example-app build + Playwright (alpine-examples)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: lily-design-system-alpine-examples/pnpm-lock.yaml
      - name: Install
        working-directory: lily-design-system-alpine-examples
        run: pnpm install --frozen-lockfile
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('lily-design-system-alpine-examples/pnpm-lock.yaml') }}
      - name: Install Playwright Chromium
        working-directory: lily-design-system-alpine-examples
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        timeout-minutes: 10
        run: pnpm exec playwright install --with-deps chromium
      - name: Install Playwright OS deps only (browser cached)
        working-directory: lily-design-system-alpine-examples
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        timeout-minutes: 10
        run: pnpm exec playwright install-deps chromium
      # Build, unit-test (every demo mounted under Alpine), then axe on every page and the helpers' flows.
      - run: bin/ci --job alpine-examples

  consumer-smoke:
    name: consumer smoke (packed tarballs import as a consumer would)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          # These four subprojects are pnpm projects (pnpm-lock.yaml),
          # but this job intentionally uses plain `npm install` inside
          # each to simulate a real npm consumer, not the project's own
          # tooling. There's no package-lock.json for setup-node's npm
          # cache to key off, so the pnpm lockfiles stand in as the
          # cache-invalidation signal (~/.npm still gets warmed and
          # reused across runs; it just busts a little more often than
          # a matching npm lockfile would).
          cache-dependency-path: |
            lily-design-system-angular-headless/pnpm-lock.yaml
            lily-design-system-svelte-headless/pnpm-lock.yaml
            lily-design-system-react-headless/pnpm-lock.yaml
            lily-design-system-vue-headless/pnpm-lock.yaml
            lily-design-system-svelte-*-picker/pnpm-lock.yaml
            lily-design-system-react-*-picker/pnpm-lock.yaml
            lily-design-system-vue-*-picker/pnpm-lock.yaml
            lily-design-system-angular-*-picker/pnpm-lock.yaml
            lily-design-system-html-*-picker/pnpm-lock.yaml
            lily-design-system-nunjucks-*-picker/pnpm-lock.yaml
      - name: Free preinstalled runner bloat for headroom
        # The ubuntu runner ships ~30 GB of toolchains this job never
        # touches (dotnet SDKs, Android, Haskell, CodeQL bundles).
        # Reclaim them up front; each removal is best-effort so a
        # runner-image change never breaks the build.
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet \
                      /usr/local/lib/android \
                      /opt/ghc /usr/local/.ghcup \
                      /opt/hostedtoolcache/CodeQL \
                      /usr/local/share/boost 2>/dev/null || true
          df -h / | tail -1
      # The headless and helper packages built with plain npm, as a consumer would, then bin/smoke-packages.
      - run: bin/ci --job consumer-smoke

  shadcn-registry:
    # P16-T5: `npx shadcn add` against Lily's shadcn registry
    # (lilydesignsystem.github.io/static/r/react/, from bin/generate-registries),
    # served from this checkout on localhost, so the job never reads the
    # live site. Three items, one with a registry dependency (scroller pulls
    # in scroller-base), into a scratch Next.js app that must typecheck,
    # build, and prerender the copied components.
    name: shadcn registry (npx shadcn add into a scratch Next.js app)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - run: bin/ci --job shadcn-registry

  spell-check:
    name: spell check (root docs + hand-authored site content)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - run: bin/ci --job spell-check
