name: CI

# pnpm 11 everywhere (plan P7-T12): every pnpm/action-setup step below
# pins 11, matching this repo's own tooling and publish.yml. Each
# subproject's build-script allowlist lives in its own
# pnpm-workspace.yaml (`allowBuilds:`), the pnpm-11 location -- the
# legacy package.json#pnpm.onlyBuiltDependencies field pnpm 11 ignores
# has been removed everywhere it's redundant with that file.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: bin/test + link check + junk guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: No tracked node_modules or dist
        run: |
          junk="$(git ls-files | grep -E '(^|/)(node_modules|dist)/|/(obj|bin)/(Debug|Release|.*\.nuget\.)' || true)"
          if [ -n "$junk" ]; then
            echo "Tracked build/dependency artifacts found:" >&2
            echo "$junk" | head -20 >&2
            exit 1
          fi

      - name: bin/test (required files + catalog/registry consistency)
        run: bin/test

      - name: bin/check-links (markdown link integrity)
        run: bin/check-links

      - name: Registries are freshly generated
        run: |
          bin/generate-registries
          if ! git diff --quiet; then
            echo "bin/generate-registries produced changes; commit regenerated registries:" >&2
            git diff --stat >&2
            exit 1
          fi

      - name: bin/check-coverage (7-headless-implementation drift matrix)
        run: bin/check-coverage --quiet

      - name: bin/check-class-names (every headless implementation carries its base class)
        run: bin/check-class-names

  helper-packages:
    # Top-level helper packages, one subproject each (the *-helpers
    # catalogs dissolved into them, Svelte first, 2026-10-10). Each is its
    # own pnpm root; one that depends on a sibling resolves it in dev/test
    # from the sibling's built dist/, so bin/list-helper-packages gives the
    # build order, and each package builds before the next one tests.
    name: helper packages tests (${{ matrix.framework }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        framework:
          - svelte
          - react
          - vue
          - angular
          - html
          - web-components
          - nunjucks
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Build the headless library they depend on
        # Some headless libraries (HTML) are consumed as source and have no build.
        working-directory: lily-design-system-${{ matrix.framework }}-headless
        run: |
          pnpm install --no-frozen-lockfile
          pnpm run --if-present build
      - name: Install, build and test each package in dependency order
        run: |
          for d in $(bin/list-helper-packages ${{ matrix.framework }}); do
            echo "::group::$d"
            ( cd "$d" && pnpm install --no-frozen-lockfile && pnpm run build && pnpm run test )
            echo "::endgroup::"
          done

  headless:
    name: headless tests (${{ matrix.catalog }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        catalog:
          - lily-design-system-svelte-headless
          - lily-design-system-react-headless
          - lily-design-system-vue-headless
          - lily-design-system-angular-headless
          - lily-design-system-nunjucks-headless
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ${{ matrix.catalog }}/pnpm-lock.yaml
      - name: Install
        working-directory: ${{ matrix.catalog }}
        run: pnpm install --no-frozen-lockfile
      - name: Test
        working-directory: ${{ matrix.catalog }}
        run: pnpm exec vitest run

  html-headless:
    name: headless tests (lily-design-system-html-headless, WebDriverIO)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: lily-design-system-html-headless/pnpm-lock.yaml
      - name: Install
        working-directory: lily-design-system-html-headless
        run: pnpm install --no-frozen-lockfile
      - name: Test (491 WebDriverIO specs, headless Chrome)
        working-directory: lily-design-system-html-headless
        run: pnpm test

  dotnet-tests:
    name: dotnet test (${{ matrix.project }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: lily-design-system-blazor-headless
            csproj: tests/LilyBlazorHeadless.Tests/LilyBlazorHeadless.Tests.csproj
          - project: lily-design-system-blazor-helpers
            csproj: tests/LilyDesignSystem.Blazor.Helpers.Tests/LilyDesignSystem.Blazor.Helpers.Tests.csproj
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ matrix.project }}-${{ hashFiles(format('{0}/**/*.csproj', matrix.project)) }}
          restore-keys: nuget-${{ matrix.project }}-
      - name: Test
        working-directory: ${{ matrix.project }}
        run: dotnet test ${{ matrix.csproj }}

  example-smoke:
    name: example-app Playwright smoke (svelte-sveltekit-examples)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: lily-design-system-svelte-sveltekit-examples/pnpm-lock.yaml
      - name: Install
        working-directory: lily-design-system-svelte-sveltekit-examples
        run: pnpm install --no-frozen-lockfile
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('lily-design-system-svelte-sveltekit-examples/pnpm-lock.yaml') }}
      - name: Install Playwright Chromium
        working-directory: lily-design-system-svelte-sveltekit-examples
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - name: Install Playwright OS deps only (browser cached)
        working-directory: lily-design-system-svelte-sveltekit-examples
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      - name: Test (accessibility, responsive, /components search, rtl-demo, book-an-appointment)
        working-directory: lily-design-system-svelte-sveltekit-examples
        run: |
          pnpm exec playwright test \
            e2e/accessibility.spec.ts \
            e2e/responsive.spec.ts \
            e2e/components-index.spec.ts \
            e2e/rtl-demo.spec.ts \
            e2e/book-an-appointment.spec.ts

  consumer-smoke:
    name: consumer smoke (packed tarballs import as a consumer would)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          # These four subprojects are pnpm projects (pnpm-lock.yaml),
          # but this job intentionally uses plain `npm install` inside
          # each to simulate a real npm consumer, not the project's own
          # tooling. There's no package-lock.json for setup-node's npm
          # cache to key off, so the pnpm lockfiles stand in as the
          # cache-invalidation signal (~/.npm still gets warmed and
          # reused across runs; it just busts a little more often than
          # a matching npm lockfile would).
          cache-dependency-path: |
            lily-design-system-angular-headless/pnpm-lock.yaml
            lily-design-system-svelte-headless/pnpm-lock.yaml
            lily-design-system-react-headless/pnpm-lock.yaml
            lily-design-system-vue-headless/pnpm-lock.yaml
            lily-design-system-svelte-*-picker/pnpm-lock.yaml
            lily-design-system-react-*-picker/pnpm-lock.yaml
            lily-design-system-vue-*-picker/pnpm-lock.yaml
            lily-design-system-angular-*-picker/pnpm-lock.yaml
            lily-design-system-html-*-picker/pnpm-lock.yaml
            lily-design-system-nunjucks-*-picker/pnpm-lock.yaml
      - name: Free preinstalled runner bloat for headroom
        # The ubuntu runner ships ~30 GB of toolchains this job never
        # touches (dotnet SDKs, Android, Haskell, CodeQL bundles).
        # Reclaim them up front; each removal is best-effort so a
        # runner-image change never breaks the build.
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet \
                      /usr/local/lib/android \
                      /opt/ghc /usr/local/.ghcup \
                      /opt/hostedtoolcache/CodeQL \
                      /usr/local/share/boost 2>/dev/null || true
          df -h / | tail -1
      # Each build step cleans its subproject's node_modules once the
      # dist exists: npm pack needs the dist and the manifest, not the
      # dependency tree, and ten full trees would crowd the runner.
      # --legacy-peer-deps on every npm install below: this job's `npm
      # install` (not the project's own pnpm) has hit npm's internal
      # Arborist crash "Cannot read properties of null (reading
      # 'edgesOut')" on every main-branch CI run for at least 12 days
      # (earliest run checked: 2026-09-07) -- not specific to any one
      # catalog's peer-dependency shape (first found on angular's
      # @angular/core/@angular/common peerDependencies, but svelte hit
      # it too with no comparable peer complexity). --legacy-peer-deps
      # skips npm 7+'s strict peer resolver, which sidesteps whatever
      # graph shape trips the crash.
      - name: Build angular dist (ng-packagr)
        working-directory: lily-design-system-angular-headless
        run: |
          npm install --no-audit --no-fund --legacy-peer-deps
          npm run build
          rm -rf node_modules
      - name: Build svelte dist
        working-directory: lily-design-system-svelte-headless
        run: |
          npm install --no-audit --no-fund --legacy-peer-deps
          npm run build
          rm -rf node_modules
      - name: Build react dist
        working-directory: lily-design-system-react-headless
        run: |
          npm install --no-audit --no-fund --legacy-peer-deps
          npm run build
          rm -rf node_modules
      - name: Build vue dist
        working-directory: lily-design-system-vue-headless
        run: |
          npm install --no-audit --no-fund --legacy-peer-deps
          npm run build
          rm -rf node_modules
      # bin/smoke-packages also packs the 6 picker helpers in each of
      # these 7 npm-published helper catalogs (Blazor is NuGet, not
      # npm, so it's excluded here same as it is from smoke-packages
      # itself) — each catalog's own `npm run build` builds all 6 of
      # its nested picker packages in one pass.
      - name: Build svelte helper packages dist
        # One top-level subproject per package, built in dependency order.
        run: |
          for d in $(bin/list-helper-packages svelte); do
            ( cd "$d" && npm install --no-audit --no-fund --legacy-peer-deps && npm run build && rm -rf node_modules )
          done
      - name: Build react helper packages dist
        run: |
          for d in $(bin/list-helper-packages react); do
            ( cd "$d" && npm install --no-audit --no-fund --legacy-peer-deps && npm run build && rm -rf node_modules )
          done
      - name: Build vue helper packages dist
        run: |
          for d in $(bin/list-helper-packages vue); do
            ( cd "$d" && npm install --no-audit --no-fund --legacy-peer-deps && npm run build && rm -rf node_modules )
          done
      - name: Build angular helper packages dist (ng-packagr)
        run: |
          for d in $(bin/list-helper-packages angular); do
            ( cd "$d" && npm install --no-audit --no-fund --legacy-peer-deps && npm run build && rm -rf node_modules )
          done
      - name: Build html helper packages dist
        run: |
          for d in $(bin/list-helper-packages html); do
            ( cd "$d" && npm install --no-audit --no-fund --legacy-peer-deps && npm run build && rm -rf node_modules )
          done
      - name: Build nunjucks helper packages dist
        run: |
          for d in $(bin/list-helper-packages nunjucks); do
            ( cd "$d" && npm install --no-audit --no-fund --legacy-peer-deps && npm run build && rm -rf node_modules )
          done
      - name: Build web-components helper packages dist
        run: |
          for d in $(bin/list-helper-packages web-components); do
            ( cd "$d" && npm install --no-audit --no-fund --legacy-peer-deps && npm run build && rm -rf node_modules )
          done
      - name: Smoke every package as a consumer
        run: |
          bin/smoke-packages
          df -h / | tail -1

  spell-check:
    name: spell check (root docs + hand-authored site content)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: cspell
        run: |
          npx --yes cspell --no-progress \
            "*.md" "docs/**/*.md" "help/**/*.md" \
            "lilydesignsystem.github.io/src/routes/+page.svelte" \
            "lilydesignsystem.github.io/src/routes/{about,accessibility,comparisons,examples,help,lily-claude-code,lily-claude-design,lily-figma,tutorials,why}/**/*.svelte"
