name: Publish

# Monorepo publishing: every npm and NuGet package is built and published
# from this repository (LilyDesignSystem/lily-design-system), whose
# package.json files name it as `repository` (with `directory`) and whose
# .csproj files name it as <RepositoryUrl>. (The per-subproject git subtree
# mirrors were deleted 2026-10-10; this is the only source repository.) See
# docs/releasing.md and spec/trusted-publishing/index.md.
#
# Tag-gated, dry-run by default. A v* tag (or a manual dispatch) runs
# the publish scripts in --dry-run mode; publishing for real requires
# the explicit `real` input on a manual dispatch — a tag alone never
# ships bytes. npm publishes carry provenance (id-token: write).
#
# NuGet: OIDC Trusted Publishing (spec/trusted-publishing/index.md), not a
# long-lived key. The NuGet/login step exchanges this job's GitHub OIDC
# token (id-token: write, already below) for a 1-hour API key — request
# it right before publishing, not earlier, since it expires in an hour.
# Requires a trusted publishing policy on nuget.org matching this repo
# (owner LilyDesignSystem, repo lily-design-system, workflow publish.yml,
# no environment) — GitHub only; GitLab and Codeberg aren't covered yet,
# so those two forges still can't publish to NuGet at all.
#
# Secrets required for a real run:
#   NPM_TOKEN    npm automation token for the lily-design-system-* names
#   NUGET_USER   username of the trusted-publishing policy CREATOR (not the owning org, not an email)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      real:
        description: "Actually publish (default: dry run)"
        type: boolean
        default: false
      target:
        description: "What to publish"
        type: choice
        options: [headless, helpers, both]
        default: both
      nuget_only:
        description: "Publish only the NuGet (Blazor) package(s) for the selected target, skip npm"
        type: boolean
        default: false
      only:
        description: "helpers only: restrict to one helper package directory (e.g. lily-design-system-svelte-theme-picker or lily-design-system-blazor-theme-picker)"
        type: string
        default: ""

permissions:
  contents: read
  id-token: write # npm --provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11 # matches ci.yml and this repo's own tooling (plan P7-T12)
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Check every package names the monorepo as its source
        # Packages publish from this monorepo, the only source repository.
        # npm --provenance rejects a package whose
        # repository.url is not the repository this workflow runs in, so
        # fail before any registry is touched.
        run: bin/check-package-metadata

      - name: Decide mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.real }}" = "true" ]; then
            echo "flag=" >> "$GITHUB_OUTPUT"; echo "mode=REAL" >> "$GITHUB_OUTPUT"
          else
            echo "flag=--dry-run" >> "$GITHUB_OUTPUT"; echo "mode=dry-run" >> "$GITHUB_OUTPUT"
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.nuget_only }}" = "true" ]; then
            echo "nuget_only=--nuget-only" >> "$GITHUB_OUTPUT"
          else
            echo "nuget_only=" >> "$GITHUB_OUTPUT"
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.only }}" ]; then
            echo "only=--only ${{ inputs.only }}" >> "$GITHUB_OUTPUT"
          else
            echo "only=" >> "$GITHUB_OUTPUT"
          fi
          echo "publish mode: $(cat "$GITHUB_OUTPUT")"

      - name: Log in to NuGet (Trusted Publishing)
        # Real runs only: a dry run never pushes, so it never needs a key,
        # and the token is short-lived (1 hour) — request it right before
        # the steps that spend it, not any earlier.
        if: steps.mode.outputs.mode == 'REAL'
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish headless libraries
        if: github.event_name != 'workflow_dispatch' || inputs.target != 'helpers'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: bin/publish-headless ${{ steps.mode.outputs.flag }} ${{ steps.mode.outputs.nuget_only }}

      - name: Publish helper packages
        if: github.event_name != 'workflow_dispatch' || inputs.target != 'headless'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: bin/publish-helpers ${{ steps.mode.outputs.flag }} ${{ steps.mode.outputs.nuget_only }} ${{ steps.mode.outputs.only }}
