<!-- GuatemalaCodigoUnicoDeIdentificacionView component (Alpine.js) -->
<!--
  Description: a read-only display of Guatemala's Código Único de Identificación (CUI)
  HTML tag: <span>
  CSS class: guatemala-codigo-unico-de-identificacion-view
  Keyboard: None (passive element)
  Accessibility: a visible caption names the value, or the screen-reader-span does. A plain span cannot take aria-label
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<span class="guatemala-codigo-unico-de-identificacion-view"
  ><span class="screen-reader-span">Código Único de Identificación (CUI) </span></span
>
