<!-- sri-lanka-national-identity-card-input.html -->
<!-- SriLankaNationalIdentityCardInput component (Alpine.js) -->
<!--
  Description: an input for entering Sri Lanka's National Identity Card (NIC) number
  HTML tag: <input>
  CSS class: sri-lanka-national-identity-card-input
  Keyboard: Tab to focus, standard input keyboard interactions
  Accessibility: Implicit input role, aria-label for accessible name
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<input
  class="sri-lanka-national-identity-card-input"
  type="text"
  aria-label="National Identity Card (NIC) number"
  autocomplete="off"
  spellcheck="false"
/>
