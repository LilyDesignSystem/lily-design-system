<!-- bangladesh-national-identity-card-input.html -->
<!-- BangladeshNationalIdentityCardInput component (Alpine.js) -->
<!--
  Description: an input for entering Bangladesh's National ID (NID) number
  HTML tag: <input>
  CSS class: bangladesh-national-identity-card-input
  Keyboard: Tab to focus, standard input keyboard interactions
  Accessibility: Implicit input role, aria-label for accessible name
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<input
  class="bangladesh-national-identity-card-input"
  type="text"
  aria-label="National ID (NID) number"
  autocomplete="off"
  spellcheck="false"
/>
