<!-- CostaRicaCedulaDeIdentidadView component (Alpine.js) -->
<!--
  Description: a read-only display of Costa Rica's Cédula de Identidad
  HTML tag: <span>
  CSS class: costa-rica-cedula-de-identidad-view
  Keyboard: None (passive element)
  Accessibility: a visible caption names the value, or the screen-reader-span does. A plain span cannot take aria-label
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<span class="costa-rica-cedula-de-identidad-view"
  ><span class="screen-reader-span">Cédula de Identidad </span></span
>
