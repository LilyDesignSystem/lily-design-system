<!-- PeruDocumentoNacionalDeIdentidadInput component (Alpine.js) -->
<!--
  Description: an input for entering Peru's Documento Nacional de Identidad (DNI)
  HTML tag: <input>
  CSS class: peru-documento-nacional-de-identidad-input
  Keyboard: Tab to focus, standard input keyboard interactions
  Accessibility: Implicit input role, aria-label for accessible name
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<input
  class="peru-documento-nacional-de-identidad-input"
  type="text"
  aria-label="Documento Nacional de Identidad (DNI)"
  autocomplete="off"
  spellcheck="false"
/>
