  HTML tag: <input>
  CSS class: ozbekiston-jismoniy-shaxsning-shaxsiy-identifikatsion-raqami-input
  Keyboard: Tab to focus, standard input keyboard interactions
  Accessibility: Implicit input role, aria-label for accessible name

-->

<input
  class="ozbekiston-jismoniy-shaxsning-shaxsiy-identifikatsion-raqami-input"
  type="text"
  aria-label="Personal identification number (JShShIR / PINFL)"
  autocomplete="off"
  spellcheck="false"
/>
