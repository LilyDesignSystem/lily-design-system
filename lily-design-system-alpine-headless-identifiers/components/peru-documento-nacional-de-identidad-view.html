<!-- PeruDocumentoNacionalDeIdentidadView component (Alpine.js) -->
<!--
  Description: a read-only display of Peru's Documento Nacional de Identidad (DNI)
  HTML tag: <span>
  CSS class: peru-documento-nacional-de-identidad-view
  Keyboard: None (passive element)
  Accessibility: a visible caption names the value, or the screen-reader-span does. A plain span cannot take aria-label
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<span class="peru-documento-nacional-de-identidad-view"
  ><span class="screen-reader-span">Documento Nacional de Identidad (DNI) </span></span
>
