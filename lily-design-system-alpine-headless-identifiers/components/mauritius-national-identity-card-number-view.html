<!-- MauritiusNationalIdentityCardNumberView component (Alpine.js) -->
<!--
  Description: a read-only display of Mauritius's National Identity Card number
  HTML tag: <span>
  CSS class: mauritius-national-identity-card-number-view
  Keyboard: None (passive element)
  Accessibility: a visible caption names the value, or the screen-reader-span does. A plain span cannot take aria-label
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<span class="mauritius-national-identity-card-number-view"
  ><span class="screen-reader-span">National Identity Card number </span></span
>
