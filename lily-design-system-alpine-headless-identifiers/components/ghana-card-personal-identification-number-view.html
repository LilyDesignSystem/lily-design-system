<!-- GhanaCardPersonalIdentificationNumberView component (Alpine.js) -->
<!--
  Description: a read-only display of Ghana's Ghana Card PIN
  HTML tag: <span>
  CSS class: ghana-card-personal-identification-number-view
  Keyboard: None (passive element)
  Accessibility: a visible caption names the value, or the screen-reader-span does. A plain span cannot take aria-label
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<span class="ghana-card-personal-identification-number-view"
  ><span class="screen-reader-span">Ghana Card PIN </span></span
>
