<!-- GuatemalaCodigoUnicoDeIdentificacionInput component (Alpine.js) -->
<!--
  Description: an input for entering Guatemala's Código Único de Identificación (CUI)
  HTML tag: <input>
  CSS class: guatemala-codigo-unico-de-identificacion-input
  Keyboard: Tab to focus, standard input keyboard interactions
  Accessibility: Implicit input role, aria-label for accessible name
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<input
  class="guatemala-codigo-unico-de-identificacion-input"
  type="text"
  aria-label="Código Único de Identificación (CUI)"
  autocomplete="off"
  spellcheck="false"
/>
