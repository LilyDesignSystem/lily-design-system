<!-- RepublicaDominicanaCedulaDeIdentidadYElectoralInput component (Alpine.js) -->

  Description: an input for entering the Dominican Republic's Cédula de Identidad y Electoral
  HTML tag: <input>
  CSS class: republica-dominicana-cedula-de-identidad-y-electoral-input
  Keyboard: Tab to focus, standard input keyboard interactions
  Accessibility: Implicit input role, aria-label for accessible name
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<input
  class="republica-dominicana-cedula-de-identidad-y-electoral-input"
  type="text"
  aria-label="Cédula de Identidad y Electoral"
  autocomplete="off"
  spellcheck="false"
/>
