<!-- CostaRicaCedulaDeIdentidadInput component (Alpine.js) -->
<!--
  Description: an input for entering Costa Rica's Cédula de Identidad
  HTML tag: <input>
  CSS class: costa-rica-cedula-de-identidad-input
  Keyboard: Tab to focus, standard input keyboard interactions
  Accessibility: Implicit input role, aria-label for accessible name
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<input
  class="costa-rica-cedula-de-identidad-input"
  type="text"
  aria-label="Cédula de Identidad"
  autocomplete="off"
  spellcheck="false"
/>
