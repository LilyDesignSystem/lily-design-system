<!-- QazaqstanZhekeSaikestendiruNomiriView component (Alpine.js) -->
<!--
  Description: a read-only display of Kazakhstan's Individual Identification Number (IIN)
  HTML tag: <span>
  CSS class: qazaqstan-zheke-saikestendiru-nomiri-view
  Keyboard: None (passive element)
  Accessibility: a visible caption names the value, or the screen-reader-span does. A plain span cannot take aria-label
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<span class="qazaqstan-zheke-saikestendiru-nomiri-view"
  ><span class="screen-reader-span">Individual Identification Number (IIN) </span></span
>
