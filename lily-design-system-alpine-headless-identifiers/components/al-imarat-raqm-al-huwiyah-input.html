<!-- AlImaratRaqmAlHuwiyahInput component (Alpine.js) -->

  Description: an input for entering the United Arab Emirates' Emirates ID number
  HTML tag: <input>
  CSS class: al-imarat-raqm-al-huwiyah-input
  Keyboard: Tab to focus, standard input keyboard interactions
  Accessibility: Implicit input role, aria-label for accessible name
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<input
  class="al-imarat-raqm-al-huwiyah-input"
  type="text"
  aria-label="Emirates ID number"
  autocomplete="off"
  spellcheck="false"
/>
