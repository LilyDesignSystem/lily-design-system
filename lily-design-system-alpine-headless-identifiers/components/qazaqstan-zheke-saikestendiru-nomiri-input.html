<!-- QazaqstanZhekeSaikestendiruNomiriInput component (Alpine.js) -->
<!--
  Description: an input for entering Kazakhstan's Individual Identification Number (IIN)
  HTML tag: <input>
  CSS class: qazaqstan-zheke-saikestendiru-nomiri-input
  Keyboard: Tab to focus, standard input keyboard interactions
  Accessibility: Implicit input role, aria-label for accessible name
  Requires: Alpine.js with the Lily plugin (lily-alpine.js)
-->

<input
  class="qazaqstan-zheke-saikestendiru-nomiri-input"
  type="text"
  aria-label="Individual Identification Number (IIN)"
  autocomplete="off"
  spellcheck="false"
/>
