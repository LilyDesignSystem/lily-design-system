<!-- GhanaCardPersonalIdentificationNumberInput component -->
<!--
  Description: an input for entering Ghana's Ghana Card PIN
  HTML tag: <input>
  CSS class: ghana-card-personal-identification-number-input
  Keyboard: Tab to focus, standard input keyboard interactions
  Accessibility: Implicit input role, aria-label for accessible name
  Format: 7-8 digits plus a Modulus-11 check character (0-9 or K).
  Usage:
    <input class="ghana-card-personal-identification-number-input" type="text" aria-label="Ghana Card PIN" autocomplete="off">
-->

<input
  class="ghana-card-personal-identification-number-input"
  type="text"
  aria-label="Ghana Card PIN"
  autocomplete="off"
  spellcheck="false"
/>
