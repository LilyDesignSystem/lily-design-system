<!-- BangladeshNationalIdentityCardView component -->
<!--
  Description: a read-only display of Bangladesh's National ID (NID) number
  HTML tag: <span>
  CSS class: bangladesh-national-identity-card-view
  Keyboard: None (passive element)
  Accessibility: a visible caption names the value, or the screen-reader-span does. A plain span cannot take aria-label
  Format: 7-8 digits plus a Modulus-11 check character (0-9 or K).
  Usage:
    <span class="bangladesh-national-identity-card-view">value-here</span>
-->

<span class="bangladesh-national-identity-card-view"
  ><span class="screen-reader-span">National ID (NID) number </span></span
>
