<!-- AlImaratRaqmAlHuwiyahView component -->
<!--
  Description: a read-only display of the United Arab Emirates' Emirates ID number
  HTML tag: <span>
  CSS class: al-imarat-raqm-al-huwiyah-view
  Keyboard: None (passive element)
  Accessibility: a visible caption names the value, or the screen-reader-span does. A plain span cannot take aria-label
  Format: 7-8 digits plus a Modulus-11 check character (0-9 or K).
  Usage:
    <span class="al-imarat-raqm-al-huwiyah-view">value-here</span>
-->

<span class="al-imarat-raqm-al-huwiyah-view"
  ><span class="screen-reader-span">Emirates ID number </span></span
>
