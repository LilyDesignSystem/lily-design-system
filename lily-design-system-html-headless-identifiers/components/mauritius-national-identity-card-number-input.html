<!-- MauritiusNationalIdentityCardNumberInput component -->
<!--
  Description: an input for entering Mauritius's National Identity Card number
  HTML tag: <input>
  CSS class: mauritius-national-identity-card-number-input
  Keyboard: Tab to focus, standard input keyboard interactions
  Accessibility: Implicit input role, aria-label for accessible name
  Format: 7-8 digits plus a Modulus-11 check character (0-9 or K).
  Usage:
    <input class="mauritius-national-identity-card-number-input" type="text" aria-label="National Identity Card number" autocomplete="off">
-->

<input
  class="mauritius-national-identity-card-number-input"
  type="text"
  aria-label="National Identity Card number"
  autocomplete="off"
  spellcheck="false"
/>
