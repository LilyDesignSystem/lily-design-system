<!-- ItyopyaFaydaIdentificationNumberView component -->
<!--
  Description: a read-only display of Ethiopia's Fayda Identification Number (FIN)
  HTML tag: <span>
  CSS class: ityopya-fayda-identification-number-view
  Keyboard: None (passive element)
  Accessibility: a visible caption names the value, or the screen-reader-span does. A plain span cannot take aria-label
  Format: 7-8 digits plus a Modulus-11 check character (0-9 or K).
  Usage:
    <span class="ityopya-fayda-identification-number-view">value-here</span>
-->

<span class="ityopya-fayda-identification-number-view"
  ><span class="screen-reader-span">Fayda Identification Number (FIN) </span></span
>
