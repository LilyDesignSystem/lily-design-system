<!-- ItyopyaFaydaIdentificationNumberInput component -->
<!--
  Description: an input for entering Ethiopia's Fayda Identification Number (FIN)
  HTML tag: <input>
  CSS class: ityopya-fayda-identification-number-input
  Keyboard: Tab to focus, standard input keyboard interactions
  Accessibility: Implicit input role, aria-label for accessible name
  Format: 7-8 digits plus a Modulus-11 check character (0-9 or K).
  Usage:
    <input class="ityopya-fayda-identification-number-input" type="text" aria-label="Fayda Identification Number (FIN)" autocomplete="off">
-->

<input
  class="ityopya-fayda-identification-number-input"
  type="text"
  aria-label="Fayda Identification Number (FIN)"
  autocomplete="off"
  spellcheck="false"
/>
