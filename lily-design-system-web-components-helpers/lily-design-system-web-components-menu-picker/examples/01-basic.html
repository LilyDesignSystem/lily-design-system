<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>lily-menu-picker — basic</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 2rem; max-width: 40rem; }
      lily-menu-picker { display: inline-block; }
      .lily-menu-picker { position: relative; display: inline-block; }
      .menu-picker-button { cursor: pointer; padding: 0.4rem 0.6rem; background: none; border: 1px solid currentColor; border-radius: 0.25rem; }
      .menu-picker-panel {
        position: absolute; inset-block-start: 100%; inset-inline-start: 0; z-index: 10;
        margin: 0.25rem 0 0; padding: 0.25rem 0; min-inline-size: max-content;
        background: #fff; border: 1px solid #d8dde0; border-radius: 0.25rem; box-shadow: 0 2px 8px rgb(0 0 0 / 0.12);
      }
      .menu-picker-panel[hidden], .menu-picker-tooltip[hidden] { display: none; }
      .menu-picker-panel ul { margin: 0; padding: 0; list-style: none; }
      .menu-picker-panel a, .menu-picker-panel button { display: block; padding: 0.5rem 0.75rem; color: inherit; text-decoration: none; background: none; border: 0; font: inherit; text-align: start; inline-size: 100%; cursor: pointer; }
      :focus-visible { outline: 3px solid #ffeb3b; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <h1>lily-menu-picker — basic</h1>
    <p>The app provides the panel's content: here, two links and a button.</p>
    <lily-menu-picker label="Menu">
      <ul>
        <li><a href="/">Home</a></li>
        <li><a href="/about/">About Us</a></li>
        <li><button type="button">Sign out</button></li>
      </ul>
    </lily-menu-picker>

    <script type="module">
      import "/dist/index.js";
    </script>
  </body>
</html>
